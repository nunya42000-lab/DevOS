<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexus Reconstructor Standalone</title>
    <!-- Core Storage Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --accent: #2f81f7;
            --success: #3fb950;
            --warn: #d29922;
            --danger: #f85149;
            --text: #c9d1d9;
            --muted: #8b949e;
            --border: #30363d;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--panel);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.2rem; margin: 0; color: var(--accent); }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            overflow: hidden;
        }

        #input-box {
            flex: 1;
            background: var(--panel);
            color: #3fb950;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        #input-box:focus { border-color: var(--accent); }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active { transform: scale(0.98); }

        .btn-primary { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-danger { background: var(--danger); color: white; }

        #log-panel {
            background: #000;
            border-radius: 8px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
            border: 1px solid var(--border);
        }

        .log-entry { margin-bottom: 4px; border-left: 2px solid var(--accent); padding-left: 8px; }
        .log-success { border-color: var(--success); color: var(--success); }
        .log-error { border-color: var(--danger); color: var(--danger); }
        .log-warn { border-color: var(--warn); color: var(--warn); }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            button { padding: 12px; font-size: 14px; }
            #log-panel { height: 100px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Nexus Reconstructor</h1>
        <div id="status-dot" style="width: 10px; height: 10px; border-radius: 50%; background: var(--muted);"></div>
    </header>

    <div class="container">
        <div style="font-size: 13px; color: var(--muted);">
            Paste chat history below. Filenames (e.g., <b>index.html</b>) right above code blocks will be detected automatically.
        </div>

        <textarea id="input-box" placeholder="Paste conversation text or code blocks here..."></textarea>

        <div id="log-panel">
            <div class="log-entry">System ready. Waiting for input...</div>
        </div>

        <div class="controls">
            <button class="btn-outline" onclick="clearAll()">Clear UI</button>
            <button class="btn-primary" onclick="processReconstruction()">
                <span>🚀</span> Rebuild Nexus
            </button>
        </div>
        
        <div class="controls" style="margin-top: -5px;">
            <button class="btn-danger" style="font-size: 11px; opacity: 0.7;" onclick="nukeVFS()">☢️ Emergency Reset VFS</button>
        </div>
    </div>

    <script>
        // Configuration
        localforage.config({ name: 'DevOS' }); // Target the main IDE database

        const logPanel = document.getElementById('log-panel');
        const statusDot = document.getElementById('status-dot');

        function addLog(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logPanel.appendChild(entry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function triggerHaptic(type) {
            if (!navigator.vibrate) return;
            if (type === 'success') navigator.vibrate([10, 30, 10]);
            else if (type === 'error') navigator.vibrate(50);
            else navigator.vibrate(10);
        }

        async function processReconstruction() {
            const text = document.getElementById('input-box').value;
            if (!text.trim()) {
                addLog("No text found. Please paste the chat content.", "error");
                return;
            }

            statusDot.style.background = 'var(--warn)';
            addLog("Scanning for code modules...");

            /**
             * Smart Regex:
             * Group 1: Filename with extension (js, html, css, etc.)
             * Group 2: Code block content
             */
            const blockPattern = /([\w\-\.]+\.(?:js|html|css|json|md|txt|jsx|ts|tsx))[:\*\s]*\n+```\w*\n([\s\S]*?)```/gi;
            
            let match;
            let updatedFiles = {};
            let count = 0;

            while ((match = blockPattern.exec(text)) !== null) {
                const fileName = match[1].trim();
                const fileContent = match[2].trim();
                updatedFiles[fileName] = fileContent;
                count++;
                addLog(`Detected: ${fileName}`, 'success');
            }

            if (count > 0) {
                try {
                    // Load existing VFS to merge or replace
                    let vfs = await localforage.getItem('nexus_vfs') || {};
                    
                    // Merge new files into VFS
                    Object.assign(vfs, updatedFiles);
                    
                    // Save back to storage
                    await localforage.setItem('nexus_vfs', vfs);
                    
                    addLog(`RECONSTRUCTION COMPLETE! ${count} files saved to VFS.`, 'success');
                    statusDot.style.background = 'var(--success)';
                    triggerHaptic('success');

                    if (updatedFiles['index.html']) {
                        addLog("Core (index.html) detected. You can now launch the IDE.");
                    }
                } catch (err) {
                    addLog(`Storage Error: ${err.message}`, 'error');
                    statusDot.style.background = 'var(--danger)';
                    triggerHaptic('error');
                }
            } else {
                addLog("No valid files found. Ensure the filename (e.g. main.js) is right above the ``` block.", "error");
                statusDot.style.background = 'var(--danger)';
                triggerHaptic('error');
            }
        }

        function clearAll() {
            document.getElementById('input-box').value = '';
            logPanel.innerHTML = '<div class="log-entry">UI Cleared. Ready for new input.</div>';
            statusDot.style.background = 'var(--muted)';
        }

        async function nukeVFS() {
            if (confirm("☢️ NUKE VFS: This will delete ALL files in your virtual drive. Are you sure?")) {
                const pass = prompt("Type 'RESETPWA' to confirm:");
                if (pass === 'RESETPWA') {
                    await localforage.removeItem('nexus_vfs');
                    addLog("VFS Wiped Clean.", "error");
                    statusDot.style.background = 'var(--danger)';
                    triggerHaptic('error');
                }
            }
        }

        // Check connection on load
        window.onload = async () => {
            try {
                const test = await localforage.getItem('nexus_vfs');
                addLog(`Storage link established. Current VFS contains ${test ? Object.keys(test).length : 0} files.`);
            } catch (e) {
                addLog("Storage check failed. LocalForage may be blocked.", "error");
            }
        };
    </script>
</body>
</html>
