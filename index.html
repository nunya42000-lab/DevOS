<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Reconstructor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 300px; background: #161b22; color: #3fb950; border: 1px solid #30363d; border-radius: 8px; padding: 10px; font-family: monospace; }
        button { background: #2f81f7; color: white; border: none; padding: 15px 30px; border-radius: 8px; margin-top: 20px; width: 100%; font-weight: bold; cursor: pointer; }
        .log { margin-top: 20px; font-size: 12px; color: #8b949e; overflow-y: auto; max-height: 200px; border-top: 1px solid #30363d; padding-top: 10px; }
    </style>
</head>
<body>
    <h1>Nexus Reconstructor</h1>
    <p>Paste the conversation history below to rebuild your DevOS files.</p>
    <textarea id="chat-input" placeholder="Paste conversation text here..."></textarea>
    <button onclick="rebuildSystem()">Rebuild Nexus System</button>
    <div id="status-log" class="log"></div>

    <script>
        localforage.config({ name: 'DevOS' }); // Must match your main app name

        async function rebuildSystem() {
            const text = document.getElementById('chat-input').value;
            const log = document.getElementById('status-log');
            const filePattern = /### ([\w.-]+)\n```\w*\n([\s\S]*?)```/g;
            let match;
            let filesFound = {};

            log.innerHTML = "Starting reconstruction...<br>";

            while ((match = filePattern.exec(text)) !== null) {
                const fileName = match[1];
                const fileContent = match[2].trim();
                filesFound[fileName] = fileContent;
                log.innerHTML += `Extracted: ${fileName} (${fileContent.length} bytes)<br>`;
            }

            if (Object.keys(filesFound).length === 0) {
                log.innerHTML += "<span style='color:#f85149'>Error: No file blocks found. Make sure to include the '### filename' headers.</span>";
                return;
            }

            try {
                // Save to the Nexus VFS
                await localforage.setItem('nexus_vfs', filesFound);
                log.innerHTML += "<br><span style='color:#3fb950'>SUCCESS: Nexus VFS Rebuilt. You can now open your main index.html.</span>";
            } catch (err) {
                log.innerHTML += `<br><span style='color:#f85149'>Storage Error: ${err.message}</span>`;
            }
        }
    </script>
</body>
</html>
