<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>DevOS Nexus Prime v8.0</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify.min.js"></script>

    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --surface: #21262d;
            --border: #30363d; --text: #c9d1d9; --accent: #2f81f7;
            --success: #3fb950; --warn: #d29922; --danger: #f85149;
            --gold: #d29922;
        }
        body.outdoor-mode {
            --bg: #ffffff; --panel: #f0f0f0; --surface: #e0e0e0;
            --border: #000000; --text: #000000; --accent: #004dc7;
        }
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; }

        /* UI STRATEGY: TABS & PANELS */
        #app-root { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        #ribbon { height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .tool-btn { padding: 6px 12px; border-radius: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); font-size: 11px; font-weight: 600; white-space: nowrap; }
        .btn-accent { background: var(--accent); color: #fff; border: none; }
        .btn-gold { color: var(--gold); border-color: var(--gold); }

        #main-view { flex: 1; position: relative; overflow: hidden; display: flex; }
        .view-panel { display: none; width: 100%; height: 100%; flex-direction: column; }
        .view-panel.active { display: flex; }

        /* EDITOR */
        #editor-frame { flex: 1; display: flex; background: #000; }
        #gutter { width: 40px; background: #0d1117; border-right: 1px solid var(--border); color: #484f58; font-size: 11px; text-align: right; padding: 15px 8px 0 0; font-family: monospace; }
        #raw-terminal { flex: 1; background: transparent; color: inherit; border: none; padding: 15px; font-family: 'Courier New', monospace; font-size: 14px; outline: none; resize: none; white-space: pre; overflow: auto; }

        /* BLUEPRINT (VISUAL BUILDER) */
        #blueprint-ui { padding: 20px; gap: 15px; overflow-y: auto; }
        .bp-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }

        /* SIDEBARS */
        .side-panel { position: fixed; top: 0; bottom: 0; width: 85vw; max-width: 320px; background: var(--panel); border: 1px solid var(--border); z-index: 2000; transition: transform 0.3s; display: flex; flex-direction: column; }
        .left-p { left: 0; transform: translateX(-105%); border-right: 2px solid var(--gold); }
        .right-p { right: 0; transform: translateX(105%); border-left: 2px solid var(--accent); }
        .side-panel.open { transform: translateX(0); }
        .p-head { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 12px; }
        .p-body { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 12px; }

        /* OVERLAYS */
        #cmd-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: none; align-items: flex-start; justify-content: center; padding-top: 15vh; }
        #cmd-box { width: 90%; background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; padding: 15px; display: flex; align-items: center; position: relative; }
        #cmd-input { flex: 1; background: transparent; border: none; color: #fff; font-family: monospace; font-size: 16px; outline: none; }
        .close-cmd { position: absolute; right: -10px; top: -30px; color: #fff; font-size: 24px; cursor: pointer; }

        #footer { height: 25px; background: var(--panel); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; font-size: 10px; font-family: monospace; }
        .file-item { padding: 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .active-file { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div id="app-root">
    <nav id="ribbon">
        <button class="tool-btn" onclick="toggleP('panel-left')">📁 VORTEX</button>
        <button class="tool-btn" onclick="switchV('view-editor')">📝 EDITOR</button>
        <button class="tool-btn" onclick="switchV('view-blueprint')">🎨 BLUEPRINT</button>
        <button class="tool-btn btn-accent" onclick="runSandbox()">▶ RUN</button>
        <button class="tool-btn" onclick="toggleP('panel-right')">🧠 INTEL</button>
        <button class="tool-btn btn-gold" id="btn-cmd-open">⌨ CMD</button>
        <button class="tool-btn" onclick="document.body.classList.toggle('outdoor-mode')">☀️ SUN</button>
    </nav>

    <div id="main-view">
        <div id="view-editor" class="view-panel active">
            <div id="editor-frame">
                <div id="gutter">1</div>
                <textarea id="raw-terminal" spellcheck="false" placeholder="Initializing Nexus Core..."></textarea>
            </div>
        </div>

        <div id="view-blueprint" class="view-panel">
            <div id="blueprint-ui">
                <h3 style="color:var(--accent)">Visual UI Builder</h3>
                <div class="bp-card">
                    <p style="font-size:12px; opacity:0.7;">Create a new Ribbon Button</p>
                    <input type="text" id="bp-btn-name" placeholder="Button Name" class="tool-btn" style="width:100%; margin-bottom:10px; text-align:left;">
                    <input type="text" id="bp-btn-id" placeholder="Button ID (unique)" class="tool-btn" style="width:100%; margin-bottom:10px; text-align:left;">
                    <button class="tool-btn btn-accent" style="width:100%" onclick="Nexus.buildUIComponent()">Generate & Inject</button>
                </div>
            </div>
        </div>

        <div id="view-sandbox" class="view-panel">
            <iframe id="sandbox-frame" style="flex:1; background:#fff; border:none;" sandbox="allow-scripts allow-modals"></iframe>
            <div id="sandbox-console" style="height:150px; background:#000; color:#0f0; padding:10px; font-family:monospace; font-size:11px; overflow-y:auto; border-top:1px solid var(--accent);"></div>
        </div>
    </div>

    <aside id="panel-left" class="side-panel left-p">
        <div class="p-head"><span>VORTEX WORKSPACE</span><span onclick="toggleP('panel-left')">&times;</span></div>
        <div class="p-body">
            <div style="margin-bottom:20px;">
                <div style="color:var(--gold); margin-bottom:10px;">FILE MANAGER</div>
                <div id="vfs-list"></div>
                <button class="tool-btn" style="width:100%; margin-top:10px;" onclick="Nexus.createNewFile()">+ NEW FILE</button>
                <button class="tool-btn btn-gold" style="width:100%; margin-top:10px;" onclick="Nexus.importAndMerge()">📥 IMPORT & MERGE</button>
            </div>
            <hr style="border:0; border-top:1px solid var(--border);">
            <div>
                <div style="color:var(--gold); margin:10px 0;">SNIPPET VAULT</div>
                <div id="vault-list"></div>
                <button class="tool-btn btn-gold" style="width:100%; margin-top:10px;" onclick="Nexus.compileVault()">COMPILE CHECKED</button>
            </div>
        </div>
    </aside>

    <aside id="panel-right" class="side-panel right-p">
        <div class="p-head"><span>DIAGNOSTICS HUB</span><span onclick="toggleP('panel-right')">&times;</span></div>
        <div class="p-body">
            <button class="tool-btn btn-gold" style="width:100%; padding:10px; margin-bottom:15px;" onclick="Nexus.runMedic()">🩹 MEDIC: FIX SYNTAX</button>
            <button class="tool-btn btn-accent" style="width:100%; padding:10px; margin-bottom:15px;" onclick="Nexus.formatCode()">✨ BEAUTIFY CODE</button>
            <div id="diag-results" style="background:#000; color:#0f0; padding:10px; border-radius:5px; height:200px; overflow-y:auto;">System Idle.</div>
        </div>
    </aside>

    <div id="cmd-overlay">
        <div id="cmd-box">
            <span class="close-cmd" id="btn-cmd-close">&times;</span>
            <span style="color:var(--success); margin-right:10px;">nexus&gt;</span>
            <input type="text" id="cmd-input" placeholder="Execute command..." autocomplete="off">
        </div>
    </div>

    <footer id="footer">
        <div id="footer-file">FILE: main.js</div>
        <div style="margin-left:auto; color:var(--gold)" id="footer-status">SYSTEM: READY</div>
    </footer>
</div>

<script>
    // --- NEXUS CORE ENGINE ---
    window.Nexus = {
        vfs: { "main.js": "console.log('DevOS Nexus v8.0 Booted');" },
        vault: [],
        activeFile: "main.js",

        init: async function() {
            // Persistence
            const savedVFS = await localforage.getItem('devos_vfs');
            if (savedVFS) this.vfs = savedVFS;
            const savedVault = await localforage.getItem('devos_vault');
            if (savedVault) this.vault = savedVault;

            this.switchFile(this.activeFile);
            this.renderAll();
            
            // CMD Closing Logic (Fixed)
            document.getElementById('btn-cmd-open').onclick = () => {
                document.getElementById('cmd-overlay').style.display = 'flex';
                document.getElementById('cmd-input').focus();
            };
            document.getElementById('btn-cmd-close').onclick = () => {
                document.getElementById('cmd-overlay').style.display = 'none';
            };
            document.getElementById('cmd-overlay').onclick = (e) => {
                if (e.target.id === 'cmd-overlay') document.getElementById('cmd-overlay').style.display = 'none';
            };
            
            // Auto-save
            document.getElementById('raw-terminal').addEventListener('input', () => {
                this.vfs[this.activeFile] = document.getElementById('raw-terminal').value;
                this.sync();
                this.updateGutter();
            });
        },

        sync: async function() {
            await localforage.setItem('devos_vfs', this.vfs);
            await localforage.setItem('devos_vault', this.vault);
            document.getElementById('footer-status').innerText = "SYSTEM: SAVED";
            setTimeout(() => { document.getElementById('footer-status').innerText = "SYSTEM: READY"; }, 1000);
        },

        switchFile: function(fn) {
            this.activeFile = fn;
            document.getElementById('raw-terminal').value = this.vfs[fn] || "";
            document.getElementById('footer-file').innerText = "FILE: " + fn;
            this.renderAll();
            this.updateGutter();
        },

        renderAll: function() {
            // Render Files
            const vfsList = document.getElementById('vfs-list');
            vfsList.innerHTML = Object.keys(this.vfs).map(fn => `
                <div class="file-item ${fn === this.activeFile ? 'active-file' : ''}" onclick="Nexus.switchFile('${fn}')">
                    ${fn} <span style="color:var(--danger)" onclick="event.stopPropagation(); Nexus.deleteFile('${fn}')">×</span>
                </div>
            `).join('');

            // Render Vault
            const vaultList = document.getElementById('vault-list');
            vaultList.innerHTML = this.vault.map((s, i) => `
                <div class="file-item">
                    <label><input type="checkbox" class="vault-check" value="${i}"> ${s.name}</label>
                </div>
            `).join('');
        },

        createNewFile: function() {
            const name = prompt("Enter Filename:", "new_file.js");
            if (name) { this.vfs[name] = ""; this.switchFile(name); }
        },

        deleteFile: function(fn) {
            if (confirm("Delete " + fn + "?")) {
                delete this.vfs[fn];
                if (this.activeFile === fn) this.activeFile = Object.keys(this.vfs)[0];
                this.switchFile(this.activeFile);
            }
        },

        importAndMerge: function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const content = ev.target.result;
                    const action = prompt("Merge Detected. Type 'A' to Append to current, 'O' to Overwrite current, or 'N' for New File.", "A");
                    if (action === 'A') this.vfs[this.activeFile] += "\n\n// --- Merged Data ---\n" + content;
                    else if (action === 'O') this.vfs[this.activeFile] = content;
                    else {
                        const name = prompt("New Filename:", "merged_" + Date.now() + ".js");
                        this.vfs[name] = content;
                        this.switchFile(name);
                    }
                    this.switchFile(this.activeFile);
                    this.sync();
                };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        },

        runMedic: function() {
            let code = document.getElementById('raw-terminal').value;
            let count = 0;
            // Brace repair
            const o = (code.match(/{/g) || []).length;
            const c = (code.match(/}/g) || []).length;
            if (o > c) { code += '\n' + '}'.repeat(o - c); count++; }
            // Backtick repair
            if ((code.match(/`/g) || []).length % 2 !== 0) { code += '`'; count++; }
            
            document.getElementById('raw-terminal').value = code;
            this.vfs[this.activeFile] = code;
            this.sync();
            alert("Medic: Fixed " + count + " items.");
        },

        formatCode: function() {
            const code = document.getElementById('raw-terminal').value;
            document.getElementById('raw-terminal').value = js_beautify(code, { indent_size: 2 });
            this.sync();
        },

        buildUIComponent: function() {
            const name = document.getElementById('bp-btn-name').value;
            const id = document.getElementById('bp-btn-id').value;
            if (!name || !id) return alert("Fill out the Blueprint.");

            const html = `\n<button class="tool-btn" id="${id}" onclick="alert('${name} clicked')">${name}</button>`;
            this.vfs[this.activeFile] += `\n/* Visual Blueprint: ${name} */\n// Append this to your HTML:\n// ${html}`;
            this.switchFile(this.activeFile);
            alert("Code generated and injected into editor.");
        },

        updateGutter: function() {
            const lines = document.getElementById('raw-terminal').value.split('\n').length;
            let gutterHtml = "";
            for (let i = 1; i <= lines; i++) gutterHtml += i + "<br>";
            document.getElementById('gutter').innerHTML = gutterHtml;
        }
    };

    // --- GLOBALS ---
    function toggleP(id) { document.getElementById(id).classList.toggle('open'); }
    function switchV(id) {
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function runSandbox() {
        const out = document.getElementById('sandbox-console');
        const frame = document.getElementById('sandbox-frame');
        out.innerHTML = "";
        
        const code = document.getElementById('raw-terminal').value;
        const hook = `<script>
            console.log = (...args) => window.parent.postMessage({type:'log', msg: args.join(' ')}, '*');
            window.onerror = (m,u,l) => window.parent.postMessage({type:'error', msg: m + ' (Line ' + l + ')'}, '*');
        <\/script>`;
        
        frame.srcdoc = hook + `<script type="module">${code}<\/script>`;
        switchV('view-sandbox');
    }

    window.addEventListener('message', (e) => {
        const out = document.getElementById('sandbox-console');
        if (e.data.type === 'log') out.innerHTML += `<div>> ${e.data.msg}</div>`;
        if (e.data.type === 'error') out.innerHTML += `<div style="color:var(--danger)">> ${e.data.msg}</div>`;
    });

    Nexus.init();
</script>

</body>
</html>
