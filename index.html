<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>DevOS Nexus Prime v10.0</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>

    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --surface: #21262d;
            --border: #30363d; --text: #c9d1d9; --accent: #2f81f7;
            --success: #3fb950; --warn: #d29922; --danger: #f85149;
            --gold: #d29922; --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --gutter-bg: #0d1117; --gutter-text: #484f58;
        }

        /* OUTDOOR HIGH-CONTRAST OVERRIDE */
        body.outdoor-mode {
            --bg: #ffffff; --panel: #f6f8fa; --surface: #ffffff;
            --border: #d0d7de; --text: #24292f; --accent: #0969da;
            --gold: #9a6700; --gutter-bg: #f6f8fa; --gutter-text: #57606a;
        }

        * { box-sizing: border-box; user-select: none; }
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background: var(--bg); color: var(--text); 
            font-family: var(--font-ui); overflow: hidden; touch-action: none; 
        }

        #app-root { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }

        /* RIBBON NAVIGATION */
        #ribbon { 
            height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; padding: 0 10px; gap: 8px; 
            overflow-x: auto; -webkit-overflow-scrolling: touch; 
        }
        #ribbon::-webkit-scrollbar { display: none; }
        .tool-btn { 
            padding: 6px 14px; border-radius: 12px; background: var(--surface); 
            color: var(--text); border: 1px solid var(--border); 
            font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; 
        }
        .btn-gold { color: var(--gold); border-color: var(--gold); }
        .btn-accent { background: var(--accent); color: #fff; border: none; }
        .btn-danger { background: var(--danger); color: #fff; border: none; }

        /* WORKSPACE LAYOUT */
        #main-view { flex: 1; position: relative; display: flex; overflow: hidden; }
        .view-panel { display: none; width: 100%; height: 100%; flex-direction: column; }
        .view-panel.active { display: flex; }

        /* EDITOR CORE */
        #editor-container { flex: 1; display: flex; background: #000; position: relative; }
        body.outdoor-mode #editor-container { background: #fff; }
        #gutter { 
            width: 45px; background: var(--gutter-bg); border-right: 1px solid var(--border); 
            color: var(--gutter-text); font-family: monospace; font-size: 11px; 
            text-align: right; padding: 15px 8px 0 0; line-height: 20px; 
            pointer-events: none; overflow: hidden; 
        }
        #raw-terminal { 
            flex: 1; background: transparent; color: inherit; border: none; 
            padding: 15px; font-family: 'Courier New', monospace; font-size: 14px; 
            line-height: 20px; outline: none; resize: none; tab-size: 2; 
            white-space: pre; overflow: auto; 
        }

        /* SIDEBARS */
        .side-panel { 
            position: fixed; top: 0; bottom: 0; width: 85vw; max-width: 330px; 
            background: var(--panel); border: 1px solid var(--border); z-index: 2000; 
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }
        .left-p { left: 0; transform: translateX(-105%); border-right: 3px solid var(--gold); }
        .right-p { right: 0; transform: translateX(105%); border-left: 3px solid var(--accent); }
        .side-panel.open { transform: translateX(0); }
        .p-head { 
            padding: 15px; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
            font-weight: bold; font-size: 12px; letter-spacing: 1px;
        }
        .p-body { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .section-label { font-size: 10px; color: var(--gold); margin-bottom: 10px; font-weight: bold; }

        /* GHOST SANDBOX & CONSOLE */
        #sandbox-wrap { flex: 1; display: flex; flex-direction: column; background: #fff; }
        #sandbox-frame { flex: 1; border: none; width: 100%; }
        #ghost-console { 
            height: 180px; background: #000; color: #3fb950; padding: 12px; 
            font-family: monospace; font-size: 11px; overflow-y: auto; 
            border-top: 2px solid var(--accent); white-space: pre-wrap;
        }
        .log-err { color: var(--danger); }
        .log-warn { color: var(--warn); }

        /* CMD & OVERLAYS */
        #cmd-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 3000; display: none; align-items: flex-start; 
            justify-content: center; padding-top: 15vh; 
        }
        #cmd-box { 
            width: 90%; background: var(--surface); border: 1px solid var(--accent); 
            border-radius: 8px; padding: 15px; display: flex; align-items: center; 
            position: relative; box-shadow: 0 10px 50px rgba(0,0,0,1);
        }
        #cmd-input { 
            flex: 1; background: transparent; border: none; color: #fff; 
            font-family: monospace; font-size: 16px; outline: none; 
        }
        .close-icon { font-size: 24px; cursor: pointer; background: none; border: none; color: #fff; }

        /* FILE & VAULT ITEMS */
        .item-row { 
            padding: 10px; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .active-row { background: rgba(47, 129, 247, 0.15); color: var(--accent); font-weight: bold; }
        
        #footer { 
            height: 30px; background: var(--panel); border-top: 1px solid var(--border); 
            display: flex; align-items: center; padding: 0 15px; font-size: 10px; 
            font-family: monospace; gap: 20px;
        }
        #health-bar { height: 4px; width: 60px; background: var(--surface); border-radius: 2px; overflow: hidden; }
        #health-fill { height: 100%; background: var(--success); width: 100%; transition: width 0.5s; }
    </style>
</head>
<body>

<div id="app-root">
    <nav id="ribbon">
        <button class="tool-btn" onclick="toggleP('panel-left')">🌌 Vortex</button>
        <button class="tool-btn" onclick="switchV('view-editor')">📝 Editor</button>
        <button class="tool-btn" onclick="switchV('view-blueprint')">🎨 Blueprint</button>
        <button class="tool-btn btn-accent" onclick="Nexus.runSandbox()">▶ Run</button>
        <button class="tool-btn" onclick="toggleP('panel-right')">🧠 Intel</button>
        <button class="tool-btn btn-gold" id="btn-cmd-open">⌨ CMD</button>
        <button class="tool-btn" onclick="document.body.classList.toggle('outdoor-mode')">☀️ Sun</button>
        <button class="tool-btn btn-gold" onclick="Nexus.exportZIP()">📦 ZIP</button>
    </nav>

    <div id="main-view">
        <div id="view-editor" class="view-panel active">
            <div id="editor-container">
                <div id="gutter">1</div>
                <textarea id="raw-terminal" spellcheck="false" autocomplete="off" placeholder="Nexus Terminal Active. Ready for input..."></textarea>
            </div>
        </div>

        <div id="view-blueprint" class="view-panel">
            <div style="padding: 25px; overflow-y: auto;">
                <h3 style="color:var(--accent); margin-bottom: 20px;">Visual UI Blueprint</h3>
                <div style="background:var(--surface); padding:20px; border-radius:10px; border:1px solid var(--border);">
                    <div class="section-label">COMPONENT GENERATOR</div>
                    <input type="text" id="bp-name" placeholder="Display Label (e.g. 'Submit')" style="width:100%; margin-bottom:12px; padding:10px; background:var(--bg); border:1px solid var(--border); color:inherit;">
                    <input type="text" id="bp-id" placeholder="ID (e.g. 'btn-submit')" style="width:100%; margin-bottom:12px; padding:10px; background:var(--bg); border:1px solid var(--border); color:inherit;">
                    <select id="bp-type" style="width:100%; margin-bottom:20px; padding:10px; background:var(--bg); border:1px solid var(--border); color:inherit;">
                        <option value="btn">Ribbon Button</option>
                        <option value="panel">Side Panel</option>
                        <option value="card">Data Card</option>
                    </select>
                    <button class="tool-btn btn-accent" style="width:100%; padding:12px;" onclick="Nexus.generateBlueprint()">Inject Component Code</button>
                </div>
            </div>
        </div>

        <div id="view-sandbox" class="view-panel">
            <div id="sandbox-wrap">
                <iframe id="sandbox-frame" sandbox="allow-scripts allow-modals"></iframe>
                <div id="ghost-console"></div>
            </div>
            <button class="tool-btn btn-danger" style="border-radius:0; height:45px;" onclick="Nexus.stopSandbox()">⏹ TERMINATE SANDBOX PROCESS</button>
        </div>
    </div>

    <aside id="panel-left" class="side-panel left-p">
        <div class="p-head"><span>VORTEX WORKSPACE</span><button class="close-icon" onclick="toggleP('panel-left')">&times;</button></div>
        <div class="p-body">
            <div class="section-label">FILE MANAGER</div>
            <div id="vfs-list"></div>
            <button class="tool-btn" style="width:100%; margin-top:15px; padding:10px;" onclick="Nexus.newFile()">+ CREATE NEW FILE</button>
            <button class="tool-btn btn-gold" style="width:100%; margin-top:10px; padding:10px;" onclick="Nexus.importMerge()">📥 IMPORT & MERGE DATA</button>
            
            <hr style="border:0; border-top:1px solid var(--border); margin:25px 0;">
            
            <div class="section-label">SNIPPET VAULT</div>
            <div id="vault-list"></div>
            <button class="tool-btn btn-gold" style="width:100%; margin-top:15px; padding:10px;" onclick="Nexus.compileVault()">⚡ COMPILE SELECTED</button>
        </div>
    </aside>

    <aside id="panel-right" class="side-panel right-p">
        <div class="p-head"><span>NEURAL INTEL</span><button class="close-icon" onclick="toggleP('panel-right')">&times;</button></div>
        <div class="p-body">
            <button class="tool-btn btn-gold" style="width:100%; padding:14px; margin-bottom:12px;" onclick="Nexus.runMedic()">🩹 FILE MEDIC: AUTO-REPAIR</button>
            <button class="tool-btn btn-accent" style="width:100%; padding:14px; margin-bottom:25px;" onclick="Nexus.formatFile()">✨ FORMAT & BEAUTIFY</button>
            
            <div class="section-label">DIAGNOSTIC LOG</div>
            <div id="diag-out" style="background:#000; color:#3fb950; padding:12px; border-radius:6px; height:180px; overflow-y:auto; border:1px solid var(--border); margin-bottom:20px;">System Standing By.</div>

            <div class="section-label">LOCAL STORAGE INSPECTOR</div>
            <div id="storage-list"></div>
            <button class="tool-btn" style="width:100%; margin-top:10px;" onclick="Nexus.wipeStorage()">Wipe Sandbox Storage</button>
        </div>
    </aside>

    <div id="cmd-overlay">
        <div id="cmd-box">
            <button class="close-icon" style="position:absolute; right:10px; top:-40px;" onclick="document.getElementById('cmd-overlay').style.display='none'">&times;</button>
            <span style="color:var(--success); margin-right:12px; font-weight:bold;">nexus&gt;</span>
            <input type="text" id="cmd-input" placeholder="Execute direct JS command..." autocomplete="off">
        </div>
    </div>

    <footer id="footer">
        <div id="footer-file">main.js</div>
        <div style="display:flex; align-items:center; gap:8px;">
            <div id="health-bar"><div id="health-fill"></div></div>
            <span id="health-text">STABILITY: 100%</span>
        </div>
        <div id="footer-status" style="margin-left:auto; color:var(--gold);">IDLE</div>
    </footer>
</div>

<script type="module">
    import * as acorn from "https://esm.sh/acorn@8.11.3";

    const editor = document.getElementById('raw-terminal');
    const gutter = document.getElementById('gutter');

    // --- OMEGA ENGINE LOGIC ---
    window.Nexus = {
        vfs: { "index.html": "<h1>DevOS v10</h1>", "main.js": "console.log('Nexus Core Online.');" },
        vault: [],
        activeFile: "main.js",

        init: async function() {
            // Load Persistent State
            const savedVFS = await localforage.getItem('nexus_vfs_v10');
            if (savedVFS) this.vfs = savedVFS;
            const savedVault = await localforage.getItem('nexus_vault_v10');
            if (savedVault) this.vault = savedVault;

            this.switchFile(this.activeFile);
            this.renderVFS();
            this.renderVault();
            this.inspectStorage();

            // CMD Logic
            document.getElementById('btn-cmd-open').onclick = () => {
                document.getElementById('cmd-overlay').style.display = 'flex';
                document.getElementById('cmd-input').focus();
            };
            document.getElementById('cmd-input').onkeydown = (e) => {
                if(e.key === 'Enter') {
                    try { eval(e.target.value); } catch(err) { alert(err.message); }
                    e.target.value = ''; document.getElementById('cmd-overlay').style.display = 'none';
                }
            };

            // Editor Handlers
            editor.oninput = () => {
                this.vfs[this.activeFile] = editor.value;
                this.updateGutter();
                this.save();
                this.runLinter();
            };
            editor.onscroll = () => gutter.scrollTop = editor.scrollTop;
            
            // Tab Support
            editor.onkeydown = (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const s = editor.selectionStart;
                    editor.value = editor.value.substring(0, s) + "  " + editor.value.substring(editor.selectionEnd);
                    editor.selectionStart = editor.selectionEnd = s + 2;
                }
            };

            // Double-Tap to Vault
            let lastTap = 0;
            editor.addEventListener('touchstart', (e) => {
                const now = Date.now();
                if (now - lastTap < 300) {
                    const sel = window.getSelection().toString();
                    if (sel) this.addSnippet(sel);
                }
                lastTap = now;
            });
        },

        save: async function() {
            await localforage.setItem('nexus_vfs_v10', this.vfs);
            await localforage.setItem('nexus_vault_v10', this.vault);
            document.getElementById('footer-status').innerText = "SYNCED";
            setTimeout(() => document.getElementById('footer-status').innerText = "READY", 1000);
        },

        switchFile: function(fn) {
            this.activeFile = fn;
            editor.value = this.vfs[fn] || "";
            document.getElementById('footer-file').innerText = fn.toUpperCase();
            this.renderVFS();
            this.updateGutter();
        },

        renderVFS: function() {
            document.getElementById('vfs-list').innerHTML = Object.keys(this.vfs).map(fn => `
                <div class="item-row ${fn === this.activeFile ? 'active-row' : ''}" onclick="Nexus.switchFile('${fn}')">
                    <span>${fn}</span>
                    <button style="background:none; border:none; color:var(--danger); font-size:16px;" onclick="event.stopPropagation(); Nexus.delFile('${fn}')">&times;</button>
                </div>
            `).join('');
        },

        newFile: function() {
            const n = prompt("Filename:","script.js");
            if(n) { this.vfs[n]=""; this.switchFile(n); }
        },

        delFile: function(fn) {
            if(confirm("Permanently delete " + fn + "?")) {
                delete this.vfs[fn];
                this.switchFile(Object.keys(this.vfs)[0]);
            }
        },

        // SNIPPET VAULT LOGIC
        addSnippet: function(code) {
            const n = prompt("Save snippet as:", "Snippet " + (this.vault.length + 1));
            if(n) { this.vault.push({ name: n, code }); this.renderVault(); this.save(); }
        },

        renderVault: function() {
            document.getElementById('vault-list').innerHTML = this.vault.map((s, i) => `
                <div class="item-row">
                    <label style="display:flex; align-items:center; gap:10px;">
                        <input type="checkbox" class="vault-check" value="${i}"> ${s.name}
                    </label>
                </div>
            `).join('');
        },

        compileVault: function() {
            const checked = document.querySelectorAll('.vault-check:checked');
            if(checked.length === 0) return alert("Select snippets to compile.");
            let compiled = "";
            checked.forEach(cb => {
                const s = this.vault[cb.value];
                compiled += `\n// --- Snippet: ${s.name} ---\n${s.code}\n`;
            });
            const n = "compiled_" + Date.now().toString().slice(-4) + ".js";
            this.vfs[n] = compiled;
            this.switchFile(n);
            toggleP('panel-left');
        },

        // GHOST SANDBOX
        runSandbox: function() {
            const frame = document.getElementById('sandbox-frame');
            const con = document.getElementById('ghost-console');
            con.innerHTML = "";
            const code = editor.value;
            const hook = `<script>
                const log = console.log;
                console.log = (...args) => window.parent.postMessage({type:'log', msg: args.join(' ')}, '*');
                console.error = (...args) => window.parent.postMessage({type:'err', msg: args.join(' ')}, '*');
                window.onerror = (m,u,l) => window.parent.postMessage({type:'err', msg: m + ' (Line ' + l + ')'}, '*');
            <\/script>`;
            frame.srcdoc = hook + `<script type="module">${code}<\/script>`;
            switchV('view-sandbox');
        },

        stopSandbox: function() {
            document.getElementById('sandbox-frame').srcdoc = '';
            document.getElementById('ghost-console').innerHTML += '<div style="color:var(--warn)">> Execution Terminated by User.</div>';
        },

        // DIAGNOSTICS & MEDIC
        runLinter: function() {
            const code = editor.value;
            const fill = document.getElementById('health-fill');
            const txt = document.getElementById('health-text');
            try {
                acorn.parse(code, { ecmaVersion: 2022, sourceType: 'module' });
                fill.style.width = "100%"; fill.style.background = "var(--success)";
                txt.innerText = "STABILITY: 100%";
            } catch(e) {
                fill.style.width = "40%"; fill.style.background = "var(--danger)";
                txt.innerText = "STABILITY: CRITICAL";
                document.getElementById('diag-out').innerHTML = `<div class="log-err">Syntax Error: ${e.message}</div>`;
            }
        },

        runMedic: function() {
            let c = editor.value;
            let repairs = 0;
            // Brace repair
            const o = (c.match(/{/g)||[]).length, cl = (c.match(/}/g)||[]).length;
            if(o > cl) { c += "\n" + "}".repeat(o-cl); repairs++; }
            // Tag repair
            ['div','b','i','span'].forEach(tag => {
                const ot = (c.match(new RegExp('<'+tag,'g'))||[]).length;
                const ct = (c.match(new RegExp('</'+tag+'>','g'))||[]).length;
                if(ot > ct) { c += `</${tag}>`.repeat(ot-ct); repairs++; }
            });
            editor.value = c; this.vfs[this.activeFile] = c; this.save();
            document.getElementById('diag-out').innerHTML = `<div style="color:var(--gold)">Medic fixed ${repairs} structural issues.</div>`;
        },

        formatFile: function() {
            const code = editor.value;
            editor.value = js_beautify(code, { indent_size: 2 });
            this.save();
            document.getElementById('diag-out').innerHTML = `<div style="color:var(--accent)">Beautification Complete.</div>`;
        },

        // UTILITIES
        importMerge: function() {
            const i = document.createElement('input'); i.type='file';
            i.onchange = e => {
                const r = new FileReader();
                r.onload = ev => {
                    const c = ev.target.result;
                    const a = prompt("(A)ppend to current, (O)verwrite current, or (N)ew File?", "A");
                    if(a === 'A') this.vfs[this.activeFile] += "\n// Merged Data\n" + c;
                    else if (a === 'O') this.vfs[this.activeFile] = c;
                    else { const name = "merged_"+Date.now()+".js"; this.vfs[name]=c; this.switchFile(name); }
                    this.switchFile(this.activeFile);
                };
                r.readAsText(e.target.files[0]);
            };
            i.click();
        },

        generateBlueprint: function() {
            const name = document.getElementById('bp-name').value;
            const id = document.getElementById('bp-id').value;
            const type = document.getElementById('bp-type').value;
            if(!name || !id) return alert("Missing Blueprint Config.");
            
            let code = `\n/* Component Blueprint: ${name} */\n`;
            if(type === 'btn') code += `<button id="${id}" class="tool-btn">${name}</button>`;
            else if(type === 'card') code += `<div id="${id}" class="item-row"><strong>${name}</strong><span>Active</span></div>`;
            
            editor.value += code;
            this.switchFile(this.activeFile);
            alert("Blueprint injected into editor.");
        },

        exportZIP: async function() {
            const zip = new JSZip();
            Object.entries(this.vfs).forEach(([fn, code]) => zip.file(fn, code));
            const blob = await zip.generateAsync({type: "blob"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "Nexus_v10_Project.zip";
            a.click();
        },

        inspectStorage: function() {
            const ui = document.getElementById('storage-list');
            ui.innerHTML = Object.keys(localStorage).map(k => `
                <div style="background:rgba(0,0,0,0.2); padding:8px; margin-bottom:5px; border-radius:4px; font-size:10px;">
                    <strong>${k}</strong>: ${localStorage.getItem(k).slice(0,20)}...
                </div>
            `).join('') || "Storage Empty";
        },

        wipeStorage: function() {
            if(confirm("Wipe all Sandbox storage?")) { localStorage.clear(); this.inspectStorage(); }
        },

        updateGutter: function() {
            const l = editor.value.split('\n').length;
            gutter.innerHTML = Array.from({length:l}, (_,i)=>i+1).join('<br>');
        }
    };

    // UI COMMANDS
    window.toggleP = (id) => document.getElementById(id).classList.toggle('open');
    window.switchV = (id) => {
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.addEventListener('message', e => {
        const out = document.getElementById('ghost-console');
        const color = e.data.type === 'err' ? 'var(--danger)' : '#3fb950';
        out.innerHTML += `<div style="color:${color}">> ${e.data.msg}</div>`;
        out.scrollTop = out.scrollHeight;
    });

    // START NEXUS
    Nexus.init();
</script>

</body>
</html>
