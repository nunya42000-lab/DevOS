<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevOS Ultimate</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2f81f7">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    
    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --surface: #21262d;
            --accent: #2f81f7; --success: #3fb950; --danger: #f85149;
            --warn: #d29922; --text: #c9d1d9; --border: #30363d;
            --gold: #d29922; --sidebar-width: 300px;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        /* App Layout */
        .nexus-grid { display: flex; height: 100%; width: 100%; overflow: hidden; }

        /* Sidebar - Scrollable and Accordion-based */
        .sidebar {
            width: var(--sidebar-width); background: var(--panel);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            transition: transform 0.3s ease; z-index: 1000;
        }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; top: 0; height: 100%; }
            .sidebar.active { transform: translateX(100%); }
        }

        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); background: var(--bg); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { margin: 0; font-size: 16px; color: var(--accent); }

        .sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .acc-item { border-bottom: 1px solid var(--border); }
        .acc-head { padding: 12px 15px; background: var(--surface); cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; display: flex; justify-content: space-between; color: #8b949e; }
        .acc-body { display: none; padding: 5px 0; background: var(--panel); }
        .acc-body.active { display: block; }

        .list-item { padding: 8px 15px; font-size: 13px; color: var(--text); cursor: pointer; border-left: 3px solid transparent; display: flex; justify-content: space-between; align-items: center; }
        .list-item.active { background: var(--surface); border-left-color: var(--accent); color: white; }
        .list-item:active { background: var(--surface); }

        /* Workspace */
        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Toolbar */
        .toolbar { display: flex; background: var(--panel); padding: 8px; gap: 8px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
        .tool-btn { padding: 8px 14px; border-radius: 6px; border: none; font-size: 11px; font-weight: bold; color: white; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
        .btn-green { background: #238636; }
        .btn-blue { background: var(--accent); }
        .btn-gold { background: var(--gold); }
        .btn-gray { background: #30363d; }

        /* Tabs */
        .tab-bar { display: flex; background: var(--bg); height: 35px; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .tab { padding: 0 15px; display: flex; align-items: center; font-size: 12px; border-right: 1px solid var(--border); cursor: pointer; color: var(--muted); background: var(--panel); }
        .tab.active { background: var(--bg); color: white; border-top: 2px solid var(--accent); }

        /* Editor */
        .editor-container { flex: 1; position: relative; overflow: hidden; background: #000; }
        .CodeMirror { height: 100% !important; font-family: 'Fira Code', monospace; font-size: 14px; }

        /* Terminal Drawer */
        .terminal { height: 140px; background: #000; border-top: 2px solid var(--border); display: flex; flex-direction: column; }
        #term-out { flex: 1; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 11px; color: var(--success); }
        .term-input { display: flex; padding: 6px 12px; background: #111; border-top: 1px solid #222; }
        .term-input input { flex: 1; background: transparent; border: none; color: white; outline: none; font-family: monospace; }

        /* CUSTOM KEYBOARD TAB */
        #kb-drawer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #000;
            z-index: 5000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100%); border-top: 2px solid var(--accent);
        }
        #kb-drawer.active { transform: translateY(0); }
        #kb-handle {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: white; padding: 5px 25px;
            border-radius: 10px 10px 0 0; font-size: 10px; font-weight: bold; cursor: pointer;
        }
        .kb-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 10px; height: 200px; overflow-y: auto; }
        .kb-grid button { height: 44px; background: #222; color: white; border: 1px solid #333; border-radius: 6px; font-size: 14px; font-weight: bold; }

        /* Preview Iframe */
        #preview-overlay { position: fixed; inset: 0; background: white; z-index: 10000; display: none; flex-direction: column; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal { width: 100%; max-width: 500px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; max-height: 80vh; }
        .modal-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: bold; color: var(--gold); display: flex; justify-content: space-between; }
        .modal-body { padding: 15px; overflow-y: auto; }

        /* Mobile Trigger */
        #mobile-btn { position: fixed; bottom: 80px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--accent); color: white; border: none; z-index: 6000; font-size: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); display: none; }
        @media (max-width: 768px) { #mobile-btn { display: flex; align-items: center; justify-content: center; } }
    </style>
</head>
<body>

    <button id="mobile-btn" onclick="Nexus.toggleSidebar()">☰</button>

    <div class="nexus-grid">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>DevOS Ultimate</h2>
                <button onclick="Nexus.openSettings()" style="background:none; border:none; font-size:18px;">⚙️</button>
            </div>
            
            <div style="padding:15px; display:flex; gap:8px;">
                <button class="tool-btn btn-blue" style="flex:1" onclick="Nexus.createFile()">+ New</button>
                <button class="tool-btn btn-blue" style="flex:1" onclick="Nexus.importPortal()">💾 Import</button>
            </div>

            <div class="sidebar-scroll">
                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🌿 Branches <span>▼</span></div>
                    <div class="acc-body active" id="branch-list"></div>
                </div>
                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🔒 Vault <span>▶</span></div>
                    <div class="acc-body" id="vault-list"></div>
                </div>
                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🔍 Search <span>▶</span></div>
                    <div class="acc-body" style="padding:10px;">
                        <input type="text" placeholder="Search logic..." onkeyup="Nexus.search(this.value)" style="width:100%; background:#000; border:1px solid #333; color:white; padding:8px; border-radius:4px;">
                        <div id="search-results" style="margin-top:10px; font-size:11px;"></div>
                    </div>
                </div>
                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🆔 Declarations <span>▶</span></div>
                    <div class="acc-body" id="decl-list"></div>
                </div>
                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">📄 Files <span>▼</span></div>
                    <div class="acc-body active" id="file-explorer"></div>
                </div>
            </div>

            <div style="padding:15px; border-top:1px solid var(--border);">
                <button class="tool-btn btn-gold" style="width:100%; height:45px;" onclick="Nexus.openSettings()">Settings & Shortcuts</button>
            </div>
        </aside>

        <main class="workspace">
            <div class="toolbar">
                <button class="tool-btn btn-gray" onclick="Nexus.copy()">📋 Copy</button>
                <button class="tool-btn btn-green" onclick="Nexus.run()">▶ Preview</button>
                <button class="tool-btn btn-blue" onclick="Nexus.intel()">🧠 Intel</button>
                <button class="tool-btn btn-gold" onclick="Nexus.visual()">🎨 Visual</button>
                <button class="tool-btn btn-gray" onclick="Nexus.time()">🕒 Time</button>
            </div>

            <div class="tab-bar" id="tab-bar"></div>

            <div class="editor-container">
                <textarea id="editor"></textarea>
            </div>

            <div class="terminal">
                <div id="term-out"></div>
                <div class="term-input">
                    <span>&gt;</span>
                    <input type="text" id="term-in" placeholder="Command...">
                </div>
            </div>
        </main>
    </div>

    <!-- Keyboard Tab -->
    <div id="kb-drawer">
        <div id="kb-handle" onclick="Nexus.toggleKb()">CODE KEYS</div>
        <div class="kb-grid" id="kb-grid"></div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay" onclick="Nexus.closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header" id="modal-title">Settings</div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Preview Overlay -->
    <div id="preview-overlay">
        <div style="background:#161b22; padding:10px; display:flex; justify-content:space-between; align-items:center;">
            <b style="color:white">LIVE PREVIEW</b>
            <button onclick="document.getElementById('preview-overlay').style.display='none'" style="background:var(--danger); border:none; padding:8px 15px; color:white; border-radius:4px;">Close</button>
        </div>
        <iframe id="preview-frame" style="flex:1; border:none;"></iframe>
    </div>

    <script>
        /**
         * NEXUS ULTIMATE - CORE LOGIC
         */
        const Nexus = {
            state: { vfs: {}, active: 'index.html', tabs: [], cm: null, history: [], vault: [] },

            async boot() {
                localforage.config({ name: 'DevOS' });
                
                // Load VFS
                this.state.vfs = await localforage.getItem('nexus_vfs') || {
                    'index.html': '<!DOCTYPE html><html><body style="background:#000;color:#fff;text-align:center;"><h1>Nexus v2</h1></body></html>',
                    'main.js': 'console.log("Active");',
                    'styles.css': 'body { background: #000; }'
                };
                this.state.vault = await localforage.getItem('nexus_vault') || [{name: 'Log', code: 'console.log();'}];

                // Register PWA
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js').then(reg => {
                        this.log("PWA Service Worker Registered", "var(--success)");
                    });
                }

                // Init CodeMirror
                this.state.cm = CodeMirror.fromTextArea(document.getElementById('editor'), {
                    theme: 'dracula', mode: 'htmlmixed', lineNumbers: true, lineWrapping: true
                });

                this.state.cm.on('change', () => {
                    this.state.vfs[this.state.active] = this.state.cm.getValue();
                    this.save();
                    this.snapshot();
                });

                this.initTerm();
                this.renderAll();
                this.open('index.html');
                this.log("DevOS Ultimate Nexus Ready.", "var(--accent)");
            },

            log(msg, color = "var(--text)") {
                const out = document.getElementById('term-out');
                const line = document.createElement('div');
                line.style.color = color;
                line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                out.appendChild(line);
                out.scrollTop = out.scrollHeight;
            },

            initTerm() {
                const input = document.getElementById('term-in');
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        const val = input.value;
                        input.value = '';
                        this.execute(val);
                    }
                };
            },

            execute(cmd) {
                const raw = cmd.trim();
                const low = raw.toLowerCase();
                this.log(`> ${raw}`, "var(--accent)");
                if (low.startsWith('=')) {
                    try { this.log(`∑: ${math.evaluate(raw.substring(1))}`, "var(--warn)"); }
                    catch(e) { this.log("Math Error", "red"); }
                } else if (low === 'rebuild') { this.importPortal(); }
                else if (low === 'clear') { document.getElementById('term-out').innerHTML = ''; }
                else { this.log("Command not recognized."); }
            },

            async save() { await localforage.setItem('nexus_vfs', this.state.vfs); },

            // --- RECONSTRUCTOR (NO HASH) ---
            async importPortal() {
                const text = prompt("Paste Nexus module data:");
                if (!text) return;
                const pattern = /([\w\-\.]+\.(?:js|html|css|json|md))[:\*\s]*\n+```\w*\n([\s\S]*?)```/gi;
                let match, count = 0;
                while ((match = pattern.exec(text)) !== null) {
                    this.state.vfs[match[1]] = match[2].trim();
                    count++;
                }
                if (count > 0) {
                    await this.save();
                    this.log(`Imported ${count} files. Reloading...`, "var(--success)");
                    setTimeout(() => location.reload(), 500);
                }
            },

            // --- CORE MODULES ---
            intel() {
                const code = this.state.cm.getValue();
                const decls = code.match(/(?:const|let|var|function|class)\s+([a-zA-Z_$][\w$]*)/g) || [];
                document.getElementById('decl-list').innerHTML = decls.map(d => `<div class="list-item">${d}</div>`).join('');
                this.log("Intel analysis complete.");
                this.openSection('decl-list');
            },

            time() {
                const body = `<h3>Snapshots (Last 10)</h3>` + this.state.history.slice(-10).reverse().map((h, i) => `
                    <div class="list-item" onclick="Nexus.restore(${this.state.history.indexOf(h)})">
                        ${h.file} - ${h.time} <span style="color:var(--accent)">RESTORE</span>
                    </div>
                `).join('');
                this.modal("Time Machine", body);
            },

            snapshot() {
                if (this.state.history.length > 30) this.state.history.shift();
                const code = this.state.cm.getValue();
                const last = this.state.history[this.state.history.length - 1];
                if (last && last.code === code) return;
                this.state.history.push({ time: new Date().toLocaleTimeString(), code, file: this.state.active });
            },

            restore(idx) {
                const snap = this.state.history[idx];
                this.state.vfs[snap.file] = snap.code;
                if (this.state.active === snap.file) this.state.cm.setValue(snap.code);
                this.closeModal();
                this.log(`Restored ${snap.file} from ${snap.time}`);
            },

            run() {
                const frame = document.getElementById('preview-frame');
                const html = this.state.vfs['index.html'] || '';
                const css = `<style>${this.state.vfs['styles.css'] || ''}</style>`;
                const js = `<script>${this.state.vfs['main.js'] || ''}<\/script>`;
                const blob = new Blob([html + css + js], { type: 'text/html' });
                frame.src = URL.createObjectURL(blob);
                document.getElementById('preview-overlay').style.display = 'flex';
            },

            visual() {
                this.log("Opening Visual Designer...");
                const code = `// State Designer\nconst VisualLogic = {\n  mode: 'default',\n  active: true\n};`;
                this.state.cm.replaceSelection(code);
            },

            // --- UI RENDERERS ---
            open(name) {
                if (!this.state.tabs.includes(name)) this.state.tabs.push(name);
                this.state.active = name;
                this.state.cm.setValue(this.state.vfs[name] || '');
                const ext = name.split('.').pop();
                const modes = { js: 'javascript', html: 'htmlmixed', css: 'css' };
                this.state.cm.setOption('mode', modes[ext] || 'javascript');
                this.renderAll();
                if (window.innerWidth < 768) this.toggleSidebar(false);
            },

            renderAll() {
                document.getElementById('file-explorer').innerHTML = Object.keys(this.state.vfs).sort().map(f => `
                    <div class="list-item ${this.state.active === f ? 'active' : ''}" onclick="Nexus.open('${f}')">📄 ${f}</div>
                `).join('');
                document.getElementById('tab-bar').innerHTML = this.state.tabs.map(t => `
                    <div class="tab ${this.state.active === t ? 'active' : ''}" onclick="Nexus.open('${t}')">${t}</div>
                `).join('');
                document.getElementById('vault-list').innerHTML = this.state.vault.map(v => `
                    <div class="list-item" onclick="Nexus.state.cm.replaceSelection('${v.code}')">📦 ${v.name}</div>
                `).join('');
                document.getElementById('branch-list').innerHTML = `<div class="list-item active">● main (active)</div>`;
                this.renderKb();
            },

            renderKb() {
                const kb = document.getElementById('kb-grid');
                const keys = ["{", "}", "(", ")", ";", "=>", "&&", "||", "!", "=", "$", "_", ... "qwertyuiopasdfghjklzxcvbnm".split("")];
                kb.innerHTML = keys.map(k => `<button onclick="Nexus.type('${k}')">${k}</button>`).join('');
            },

            type(k) {
                this.state.cm.getDoc().replaceRange(k, this.state.cm.getDoc().getCursor());
                this.state.cm.focus();
                if (navigator.vibrate) navigator.vibrate(10);
            },

            toggleAcc(el) {
                const body = el.nextElementSibling;
                body.classList.toggle('active');
                el.querySelector('span').innerText = body.classList.contains('active') ? '▼' : '▶';
            },

            openSection(id) {
                const body = document.getElementById(id);
                body.classList.add('active');
                body.previousElementSibling.querySelector('span').innerText = '▼';
            },

            openSettings() {
                const body = `<button class="tool-btn btn-blue" style="width:100%;margin-bottom:10px;" onclick="Nexus.format()">✨ Beautify Code</button>
                              <button class="tool-btn btn-gold" style="width:100%;" onclick="Nexus.nuke()">☢️ Wipe Memory</button>`;
                this.modal("System Settings", body);
            },

            format() { this.state.cm.setValue(js_beautify(this.state.cm.getValue())); this.closeModal(); },
            nuke() { if(confirm("Nuke all files?")) { localforage.clear().then(() => location.reload()); } },
            toggleKb() { document.getElementById('kb-drawer').classList.toggle('active'); },
            toggleSidebar(force) { document.getElementById('sidebar').classList.toggle('active', force); },
            modal(t, b) { document.getElementById('modal-title').innerText = t; document.getElementById('modal-body').innerHTML = b; document.getElementById('modal-overlay').style.display = 'flex'; },
            closeModal() { document.getElementById('modal-overlay').style.display = 'none'; },
            copy() { navigator.clipboard.writeText(this.state.cm.getValue()); this.log("Copied to clipboard."); },
            createFile() { const n = prompt("Filename:"); if(n) { this.state.vfs[n] = ""; this.save(); this.open(n); } }
        };

        window.onload = () => Nexus.boot();
    </script>
</body>
</html>
