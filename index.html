<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevOS Nexus Prime</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script type="module">
        import { basicSetup } from "https://esm.sh/codemirror@6.0.1";
        import { EditorView } from "https://esm.sh/@codemirror/view";
        import { EditorState, Compartment } from "https://esm.sh/@codemirror/state";
        import { javascript } from "https://esm.sh/@codemirror/lang-javascript";
        import { html } from "https://esm.sh/@codemirror/lang-html";
        import { css } from "https://esm.sh/@codemirror/lang-css";
        import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark";

        window.CM6 = { basicSetup, EditorView, EditorState, Compartment, javascript, html, css, oneDark };
        window.dispatchEvent(new Event('cm6-ready'));
    </script>
</head>
<body>
    <div id="nexus-app-root" class="nexus-root">
        
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Nexus Prime</h2>
                <button onclick="Nexus.toggleSidebar()" style="background:none; border:none; color:var(--text); font-size:18px;">✕</button>
            </div>
            
            <div class="sidebar-scroll">
                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">📄 Explorer <span>▼</span></div>
                    <div class="acc-body active" id="explorer"></div>
                </div>

                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🗂️ Branches <span>▼</span></div>
                    <div class="acc-body" id="branches-container" style="padding: 10px;">
                        <button class="tool-btn btn-blue" style="width: 100%; margin-bottom: 5px;" onclick="NexusBranches.createBranch()">+ New Branch</button>
                        <div id="branch-list"></div>
                    </div>
                </div>

                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">⏳ Time Machine <span>▼</span></div>
                    <div class="acc-body" id="history-container" style="padding: 10px;">
                        <button class="tool-btn btn-gold" style="width: 100%; margin-bottom: 5px;" onclick="NexusHistory.saveSnapshot()">📸 Snapshot</button>
                        <div id="history-list"></div>
                    </div>
                </div>
            </div>

            <div style="padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 5px;">
                <button class="tool-btn btn-gold" style="flex: 1; height: 45px; justify-content: center;" onclick="Nexus.openHelp()">📖 Help</button>
                <button class="tool-btn btn-gold" style="flex: 1; height: 45px; justify-content: center;" onclick="Nexus.openSettings()">⚙ Settings</button>
            </div>
        </aside>

        <main class="workspace">
            
            <div class="toolbar-viewport">
                <div class="toolbar-track" style="overflow-x: auto; white-space: nowrap; scrollbar-width: none;">
                    <button class="tool-btn btn-gray" onclick="Nexus.toggleSidebar()">☰ Menu</button>
                    <button class="tool-btn btn-blue" onclick="NexusSmartMerger.openModal()">⚡ Merge</button>
                    <button class="tool-btn btn-accent" onclick="Nexus.openOmniDashboard()">👁️ Omni</button>
                    
                    <button class="tool-btn btn-blue" onclick="Nexus.newFile()">+ New File</button>
                    <button class="tool-btn btn-gray" onclick="Nexus.cutText()">✂️ Cut</button>
                    <button class="tool-btn btn-gray" onclick="Nexus.copyText()">📋 Copy</button>
                    <button class="tool-btn btn-green" onclick="Nexus.formatCode()">✨ Beautify</button>
                    <button class="tool-btn btn-blue" onclick="Nexus.openFindReplace()">🔍 Find/Replace</button>
                    <button class="tool-btn btn-gold" onclick="Nexus.compareFiles()">⚖️ Compare</button>
                    <button class="tool-btn btn-accent" onclick="Nexus.toggleVisual()">👁️ Visual</button>
                    <button class="tool-btn btn-gold" onclick="NexusVault.openModal()">🗄️ Vault</button>
                    <button class="tool-btn btn-green" onclick="Nexus.runIntel()">🧠 Intel</button>
                    <button class="tool-btn btn-red" onclick="NexusMic.toggle()">🎤 Mic</button>
                    <button class="tool-btn" style="background: var(--danger); color: white; border-color: darkred;" onclick="Nexus.clearFiles()">🗑️ Clear</button>
                    <button class="tool-btn" style="background: darkred; color: white; border-color: red;" onclick="Nexus.nukeSystem()">☢️ Nuke</button>
                </div>
            </div>

            <div class="tab-bar" id="tab-bar"></div>

            <div id="visual-preview" style="display: none; flex: 1; background: #fff; position: relative;">
                <button id="kill-preview-btn" onclick="Nexus.killPreview()" style="position:absolute; top:10px; right:10px; z-index:999; background:var(--danger); color:#fff; border:none; padding:8px 12px; border-radius:4px; font-weight:bold;">❌ Kill Preview</button>
                <iframe id="preview-frame" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>

            <div id="editor-wrapper" class="editor-area">
                <div id="quick-nav-bar">
                    <button onclick="ScrollEngine.jump('TOP')" title="Top">⇪</button>
                    <button onclick="ScrollEngine.jump(-15)" title="Up">↑</button>
                    <button onclick="ScrollEngine.jump(15)" title="Down">↓</button>
                    <button onclick="ScrollEngine.jump('BOTTOM')" title="Bottom">⇩</button>
                </div>
                </div>
        </main>

        <div id="terminal-zone" style="display:none; position:fixed; bottom:70px; left:15px; width:80%; max-width:350px; height:200px; z-index:3900; background:#000; border:1px solid var(--border); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.8); flex-direction:column; padding:10px;">
            <div style="display:flex; justify-content:space-between; color:var(--gold); border-bottom:1px solid var(--border); padding-bottom:5px; margin-bottom:5px;">
                <span style="font-weight:bold; font-size:12px;">📜 System Log & Terminal</span>
                <button onclick="Nexus.toggleTerminalPopup()" style="background:none; border:none; color:var(--danger); cursor:pointer;">X</button>
            </div>
            <div id="term-out" style="flex:1; overflow-y:auto; font-family:monospace; font-size:12px; margin-bottom:5px;"></div>
            <div style="display:flex; gap:8px;">
                <span style="color:var(--gold)">$</span>
                <input type="text" id="term-in" placeholder="Enter JS or payload..." style="background:transparent; border:none; color:var(--success); font-family:monospace; flex:1; outline:none;">
            </div>
        </div>

        <div id="bottom-quick-actions">
            <button onclick="Nexus.toggleTerminalPopup()" style="position:fixed; bottom:15px; left:15px; z-index:4000; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:50%; width:45px; height:45px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">📜</button>
            
            <button onclick="Nexus.copyLog()" style="position:fixed; bottom:15px; left:70px; z-index:4000; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:50%; width:45px; height:45px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);" title="Copy Log">📋</button>
            
            <button onclick="Nexus.toggleKb()" style="position:fixed; bottom:15px; right:15px; z-index:4000; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:50%; width:45px; height:45px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">⌨️</button>
        </div>

        <div id="kb-drawer" style="display:none; position:fixed; bottom:0; left:0; width:100%; background:var(--panel); border-top:2px solid var(--gold); z-index:4500;">
            <div class="kb-header" onclick="Nexus.toggleKb()" style="background:var(--surface); color:var(--gold); text-align:center; padding:8px; cursor:pointer;">▼ CLOSE ▼</div>
            <div id="kb-grid" class="kb-grid" style="display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; padding:8px; height:190px; overflow-y:auto;"></div>
        </div>

        <div id="modal-overlay" class="overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:5000; align-items:center; justify-content:center;">
            <div class="modal-box" style="background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:20px; width:90%; max-width:500px; max-height: 80vh; overflow-y: auto;">
                <h3 id="modal-title" style="margin-top:0; color:var(--gold); border-bottom:1px solid var(--border); padding-bottom:10px;"></h3>
                <div id="modal-body" style="height: 100%;"></div>
                <button class="tool-btn btn-red" style="margin-top: 15px; width: 100%; justify-content: center;" onclick="Nexus.closeModal()">Close Window</button>
            </div>
        </div>
    </div>

    <script src="./nexus.js"></script>
    <script src="./sync.js"></script>
    <script src="./virtual-keyboard.js"></script>
    <script src="./injector.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
