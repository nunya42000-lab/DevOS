<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevOS Nexus Prime | Omni-Edition</title>
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121120/diff_match_patch.js"></script>
    
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --surface: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --success: #238636;
            --gold: #d29922;
            --danger: #da3633;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #nexus-app-root {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Sidebar Logic */
        #sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            width: 280px;
            height: 100%;
            background: var(--panel);
            border-right: 1px solid var(--border);
            transition: left 0.3s ease;
            z-index: 8000;
        }
        #sidebar.active { left: 0; }

        /* Workspace & Ribbon */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .toolbar-viewport {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .toolbar-track { padding: 8px; display: flex; gap: 8px; }

        .tool-btn {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-blue { border-color: var(--accent); color: var(--accent); }
        .btn-green { border-color: var(--success); color: var(--success); }
        .btn-gold { border-color: var(--gold); color: var(--gold); }
        .btn-red { border-color: var(--danger); color: var(--danger); }

        #editor-wrapper { flex: 1; position: relative; background: #000; }

        /* Command Prompt Panel */
        #cmd-panel {
            position: fixed;
            bottom: -350px;
            left: 0;
            width: 100%;
            height: 350px;
            background: var(--panel);
            border-top: 2px solid var(--accent);
            z-index: 7000;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }
        #cmd-panel.active { bottom: 0; }

        .cmd-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        #cmd-input {
            flex: 1;
            background: #000;
            color: #22c55e;
            border: 1px solid var(--border);
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            border-radius: 4px;
        }

        /* Terminal Pop-up */
        #terminal-zone {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 200px;
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--border);
            display: none;
            flex-direction: column;
            z-index: 5000;
        }
        #term-out { flex: 1; overflow-y: auto; padding: 10px; font-size: 11px; font-family: monospace; }

        /* Modals */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: var(--panel);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div id="nexus-app-root">
    <aside id="sidebar">
        <div style="padding: 20px;">
            <h3 style="color: var(--accent);">File Explorer</h3>
            <div id="explorer"></div>
        </div>
    </aside>

    <main class="workspace">
        <div class="toolbar-viewport">
            <div class="toolbar-track">
                <button class="tool-btn" onclick="Nexus.toggleSidebar(true)">☰ Menu</button>
                <button class="tool-btn btn-accent" onclick="Nexus.toggleCMD()">⚡ CMD</button>
                <button class="tool-btn btn-blue" onclick="Nexus.openMerger()">⚡ Merge</button>
                <button class="tool-btn btn-accent" onclick="Nexus.toggleVisual()">👁️ Visual</button>
                <button class="tool-btn btn-gold" onclick="Nexus.openVault()">🗄️ Vault</button>
                <button class="tool-btn btn-green" onclick="Nexus.openIntel()">🧠 Intel</button>
                <button class="tool-btn btn-red" onclick="Nexus.nukeSystem()">☢️ Nuke</button>
            </div>
        </div>

        <div id="editor-wrapper"></div>

        <div id="cmd-panel">
            <div class="cmd-header">
                <span style="color: var(--accent); font-weight: bold; letter-spacing: 1px;">NEXUS SCRIPT INJECTOR</span>
                <div style="display: flex; gap: 8px;">
                    <button class="tool-btn btn-green" onclick="Nexus.runCMD()">EXECUTE</button>
                    <button class="tool-btn" onclick="Nexus.toggleCMD()">CLOSE</button>
                </div>
            </div>
            <textarea id="cmd-input" placeholder="// Inject JavaScript logic..."></textarea>
        </div>

        <div id="terminal-zone">
            <div id="term-out"></div>
            <input type="text" id="term-in" placeholder="Command..." style="background:#000; border:none; border-top:1px solid var(--border); color:#fff; padding:5px;">
        </div>
    </main>
</div>

<div id="modal-overlay" onclick="if(event.target === this) Nexus.closeModal()">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-top:0;"></h2>
        <div id="modal-body"></div>
    </div>
</div>

<script src="./nexus.js"></script>
<script src="./virtual-keyboard.js"></script>
<script>
    // Initialize the system
    document.addEventListener('DOMContentLoaded', () => {
        if (window.Nexus) Nexus.boot();
    });
</script>

</body>
</html>
