<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevOS Nexus Prime | Omni-Edition</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121120/diff_match_patch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    <script src="https://unpkg.com/@rollup/browser@4.13.0/dist/rollup.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <script type="module">
        import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
        import { javascript } from "https://esm.sh/@codemirror/lang-javascript@6.2.1";
        import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark@6.1.2";
        window.CM6 = { EditorView, basicSetup, javascript, oneDark };
        window.dispatchEvent(new CustomEvent('cm6-ready'));
    </script>
    
    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --surface: #21262d;
            --border: #30363d; --text: #c9d1d9; --accent: #58a6ff;
            --success: #238636; --gold: #d29922; --danger: #da3633; --purple: #bb86fc;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; touch-action: none;
        }

        #nexus-app-root { display: flex; flex-direction: column; height: 100vh; }

        /* Sidebar */
        #sidebar {
            position: fixed; left: -280px; top: 0; width: 280px; height: 100%;
            background: var(--panel); border-right: 1px solid var(--border);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 8000;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column;
        }
        #sidebar.active { left: 0; }

        .toolbar-viewport { background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; }
        .toolbar-track { padding: 8px; display: flex; gap: 8px; }

        .tool-btn {
            background: var(--surface); color: var(--text); border: 1px solid var(--border);
            padding: 8px 14px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;
        }
        .btn-blue { border-color: var(--accent); color: var(--accent); }
        .btn-green { border-color: var(--success); color: var(--success); }
        .btn-gold { border-color: var(--gold); color: var(--gold); }
        .btn-red { border-color: var(--danger); color: var(--danger); }
        .btn-purple { border-color: var(--purple); color: var(--purple); }

        #editor-wrapper { flex: 1; background: #000; position: relative; }
        .cm-editor { height: 100%; }

        /* CMD Panel */
        #cmd-panel {
            position: fixed; bottom: -400px; left: 0; width: 100%; height: 400px;
            background: var(--panel); border-top: 2px solid var(--accent);
            z-index: 7500; transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; padding: 12px; box-sizing: border-box;
        }
        #cmd-panel.active { bottom: 0; }
        #cmd-input { flex: 1; background: #000; color: #22c55e; border: 1px solid var(--border); padding: 12px; font-family: monospace; font-size: 14px; resize: none; outline: none; }

        /* Explorer */
        .explorer-item { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .explorer-item:hover { background: var(--surface); }
        .explorer-item.active { border-left: 3px solid var(--success); background: rgba(35, 134, 54, 0.1); }

        /* Terminal Pop-up */
        #terminal-zone { position: absolute; bottom: 20px; right: 20px; width: 320px; height: 180px; background: rgba(0,0,0,0.9); border: 1px solid var(--border); display: none; flex-direction: column; z-index: 5000; border-radius: 8px; }
        #term-out { flex: 1; overflow-y: auto; padding: 10px; font-size: 11px; font-family: monospace; }
        
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--panel); border: 1px solid var(--border); width: 90%; max-width: 550px; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="nexus-app-root">
    <aside id="sidebar">
        <div style="padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; color: var(--accent);">NEXUS EXPLORER</span>
            <button class="tool-btn" onclick="Nexus.toggleSidebar(false)">✕</button>
        </div>
        <div id="explorer" style="flex: 1; overflow-y: auto;"></div>
        <div style="padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;">
            <input type="file" id="zip-upload-input" accept=".zip,application/zip" style="display:none" onchange="Nexus.loadZipToVFS(this.files[0])">
            <button class="tool-btn btn-gold" onclick="document.getElementById('zip-upload-input').click()">📁 Load ZIP</button>
            <button class="tool-btn btn-purple" onclick="Nexus.openMerger()">⚡ PWA Merger</button>
            <button class="tool-btn btn-green" onclick="Nexus.saveVFS()">💾 Persist Changes</button>
        </div>
    </aside>

    <main class="workspace" style="display: flex; flex-direction: column; flex: 1;">
        <div class="toolbar-viewport">
            <div class="toolbar-track">
                <button class="tool-btn" onclick="Nexus.toggleSidebar(true)">☰ Files</button>
                <button class="tool-btn btn-blue" onclick="Nexus.toggleCMD()">⚡ CMD</button>
                <button class="tool-btn btn-blue" onclick="Nexus.beautifyCode()">✨ Format</button>
                <button class="tool-btn btn-green" onclick="Nexus.openIntel()">🧠 Intel</button>
                <button class="tool-btn btn-red" onclick="Nexus.nukeSystem()">☢️ Nuke</button>
            </div>
        </div>

        <div id="editor-wrapper"></div>

        <div id="cmd-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="color: var(--accent); font-weight: bold;">NEXUS SYSTEM INJECTOR</span>
                <div style="display: flex; gap: 8px;">
                    <button class="tool-btn btn-green" onclick="Nexus.runCMD()">EXECUTE</button>
                    <button class="tool-btn" onclick="Nexus.toggleCMD()">CLOSE</button>
                </div>
            </div>
            <textarea id="cmd-input" placeholder="// Paste script to update system or edit VFS..."></textarea>
        </div>

        <div id="terminal-zone">
            <div id="term-out"></div>
            <input type="text" id="term-in" placeholder="Command..." style="background:#000; border:none; border-top:1px solid var(--border); color:#fff; padding:8px; outline:none;">
        </div>
    </main>
</div>

<div id="modal-overlay" onclick="if(event.target === this) Nexus.closeModal()">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-top:0; font-size: 16px;"></h2>
        <div id="modal-body"></div>
    </div>
</div>

<script>
window.Nexus = {
    state: { vfs: {}, activeFile: null, cm: null },

    async boot() {
        console.log("Nexus Prime: Booting...");
        this.initGestures();
        
        // Load saved state from LocalForage
        const saved = await localforage.getItem('nexus_vfs_v4');
        if (saved) this.state.vfs = saved;

        window.addEventListener('cm6-ready', () => {
            this.initEditor();
            this.renderExplorer();
            this.log("Kernel v4 Active. Editor ready.", "var(--success)");
        });
    },

    // --- Core Editor Handling ---
    initEditor() {
        const parent = document.getElementById('editor-wrapper');
        if (!window.CM6) return;
        this.state.cm = new window.CM6.EditorView({
            doc: "// Select a file to start coding.\n",
            extensions: [
                window.CM6.basicSetup, 
                window.CM6.oneDark, 
                window.CM6.javascript(),
                window.CM6.EditorView.updateListener.of((v) => {
                    if (v.docChanged && this.state.activeFile) {
                        this.state.vfs[this.state.activeFile] = v.state.doc.toString();
                    }
                })
            ],
            parent: parent
        });
    },

    loadFile(filename) {
        this.state.activeFile = filename;
        if (this.state.cm) {
            this.state.cm.dispatch({
                changes: { from: 0, to: this.state.cm.state.doc.length, insert: this.state.vfs[filename] }
            });
        }
        this.toggleSidebar(false);
        this.renderExplorer();
        this.log(`Editing: ${filename}`, "var(--accent)");
    },

    deleteFile(filename) {
        delete this.state.vfs[filename];
        if (this.state.activeFile === filename) {
            this.state.activeFile = null;
            if (this.state.cm) {
                this.state.cm.dispatch({
                    changes: { from: 0, to: this.state.cm.state.doc.length, insert: "// Select a file to start coding.\n" }
                });
            }
        }
        this.renderExplorer();
        this.saveVFS();
        this.log(`Deleted ${filename}`, "var(--danger)");
    },

    // --- Advanced PWA Merger & Packager ---

    async loadZipToVFS(file) {
        if (!file) return;
        if (!window.JSZip) return this.log("[Error] JSZip not loaded. Check connection.", "var(--danger)");
        
        this.log("Unpacking ZIP into Nexus VFS...", "var(--gold)");
        try {
            const zip = new JSZip();
            const contents = await zip.loadAsync(file);
            let loaded = 0;
            
            const promises = [];
            contents.forEach((relativePath, zipEntry) => {
                if (!zipEntry.dir && !relativePath.includes('__MACOSX')) {
                    promises.push(
                        zipEntry.async('string').then(text => {
                            this.state.vfs[relativePath] = text;
                            loaded++;
                        })
                    );
                }
            });
            
            await Promise.all(promises);
            this.renderExplorer();
            this.log(`Successfully imported ${loaded} files from ZIP.`, "var(--success)");
            document.getElementById('zip-upload-input').value = ''; // Reset input
        } catch (err) {
            this.log(`[ZIP Error] ${err.message}`, "var(--danger)");
        }
    },

    openMerger() {
        const vfsFiles = Object.keys(this.state.vfs).filter(f => f.endsWith('.js') || f.endsWith('.mjs'));
        
        let fileListHtml = vfsFiles.length > 0 
            ? vfsFiles.map(f => `
                <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid var(--border);">
                    <label style="color:var(--text); font-size:14px; display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" class="merger-checkbox" value="${f}" style="width:18px; height:18px; accent-color:var(--accent);">
                        ${f}
                    </label>
                </div>
            `).join('')
            : '<div style="padding:10px; color:var(--danger);">No JS files found in VFS. Load some first!</div>';

        const html = `
            <div style="display:flex; flex-direction:column; gap:10px; height: 100%;">
                <p style="color:var(--text); font-size:12px; margin:0;">Select files to merge together. Rollup will resolve dependencies directly from the Nexus VFS.</p>
                
                <div style="background:#000; border:1px solid var(--border); border-radius:6px; max-height:220px; overflow-y:auto; margin-bottom:10px;">
                    ${fileListHtml}
                </div>
                
                <input type="text" id="merger-output-name" placeholder="Output filename (e.g. bundled.js)" style="padding:10px; background:#000; border:1px solid var(--border); color:var(--success); border-radius:6px; font-family:monospace;">
                
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button class="tool-btn btn-purple" style="flex:1; padding:12px; font-size:14px;" onclick="Nexus.executeMerge()">Merge Selected</button>
                    <button class="tool-btn btn-green" style="flex:1; padding:12px; font-size:14px;" onclick="Nexus.downloadProjectZip()">Download Project ZIP</button>
                </div>
                <div id="merger-status" style="margin-top:10px; font-weight:bold; font-size:12px; text-align:center;"></div>
            </div>
        `;
        
        this.showModal("📦 PWA Studio Merger", html);
    },

    async executeMerge() {
        const checkboxes = document.querySelectorAll('.merger-checkbox:checked');
        const selectedFiles = Array.from(checkboxes).map(cb => cb.value);
        let outName = document.getElementById('merger-output-name').value.trim();
        const statusEl = document.getElementById('merger-status');

        if (selectedFiles.length < 2) {
            statusEl.style.color = "var(--danger)";
            statusEl.innerText = "Error: Select at least 2 files to merge.";
            return;
        }
        if (!outName) outName = 'merged-bundle.js';
        if (!outName.endsWith('.js')) outName += '.js';

        statusEl.style.color = "var(--accent)";
        statusEl.innerText = "Analyzing dependencies & merging...";

        try {
            // Memory Plugin bridging Rollup directly to your Nexus VFS!
            const memoryPlugin = {
                name: 'nexus-vfs',
                resolveId: (source, importer) => {
                    let cleanName = source.replace(/^(\.\/|\.\.\/)+/, '').replace(/^\//, '');
                    if (!cleanName.endsWith('.js') && !cleanName.endsWith('.mjs')) cleanName += '.js';
                    
                    if (this.state.vfs[cleanName]) return cleanName;
                    return null;
                },
                load: (id) => {
                    return this.state.vfs[id] || null;
                }
            };

            // Create a temporary synthetic entry point to link the selected files
            const syntheticEntry = selectedFiles.map(p => `export * from './${p}';\nimport './${p}';`).join('\n');
            this.state.vfs['__nexus_synthetic__.js'] = syntheticEntry;

            const bundle = await window.rollup.rollup({
                input: '__nexus_synthetic__.js',
                plugins: [memoryPlugin]
            });

            const { output } = await bundle.generate({ format: 'es' });
            
            // Save the merged code back into the Nexus IDE
            this.state.vfs[outName] = output[0].code;
            delete this.state.vfs['__nexus_synthetic__.js']; 
            
            // Refresh UI
            this.renderExplorer();
            this.loadFile(outName);
            
            statusEl.style.color = "var(--success)";
            statusEl.innerText = `Successfully merged into ${outName}!`;
            this.log(`[Merger] Created ${outName} from ${selectedFiles.length} files.`, "var(--success)");

            checkboxes.forEach(cb => cb.checked = false);
            this.saveVFS();
        } catch (err) {
            statusEl.style.color = "var(--danger)";
            statusEl.innerText = "Merge Error (See Terminal)";
            this.log(`[Merger Error] ${err.message}`, "var(--danger)");
            console.error(err);
        }
    },

    async downloadProjectZip() {
        const statusEl = document.getElementById('merger-status');
        if (!window.JSZip) {
            this.log("[Error] JSZip not loaded.", "var(--danger)");
            return;
        }
        
        statusEl.style.color = "var(--gold)";
        statusEl.innerText = "Packaging ZIP...";
        
        try {
            const zip = new JSZip();
            
            Object.keys(this.state.vfs).forEach(filename => {
                zip.file(filename, this.state.vfs[filename]);
            });

            const blob = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'DevOS-Nexus-Project.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            statusEl.style.color = "var(--success)";
            statusEl.innerText = "Project Downloaded!";
            this.log("[Packager] Full project ZIP downloaded.", "var(--success)");
        } catch (err) {
            statusEl.style.color = "var(--danger)";
            statusEl.innerText = "ZIP generation failed.";
            this.log(`[Packager Error] ${err.message}`, "var(--danger)");
        }
    },

    // --- VFS & Persistence ---
    renderExplorer() {
        const exp = document.getElementById('explorer');
        const keys = Object.keys(this.state.vfs);
        if (keys.length === 0) {
            exp.innerHTML = `<div style="padding:20px; text-align:center; font-size:11px; opacity:0.5;">EXPLORER EMPTY</div>`;
            return;
        }
        exp.innerHTML = keys.map(name => `
            <div class="explorer-item ${this.state.activeFile === name ? 'active' : ''}" onclick="Nexus.loadFile('${name}')">
                <span style="font-size:12px; word-break: break-all;">${name}</span>
                <button onclick="event.stopPropagation(); Nexus.deleteFile('${name}')" style="background:none; border:none; color:var(--danger); cursor:pointer;">🗑️</button>
            </div>
        `).join('');
    },

    async saveVFS() {
        await localforage.setItem('nexus_vfs_v4', this.state.vfs);
        this.log("VFS State Saved to Local Cache.", "var(--success)");
    },

    // --- Utilities ---
    runCMD() {
        const code = document.getElementById('cmd-input').value;
        try {
            const out = new Function(code).bind(this)();
            this.log(out || "Kernel Instruction Executed.", "var(--success)");
        } catch(e) { this.log(e.message, "var(--danger)"); }
    },

    initGestures() {
        let startX;
        document.addEventListener('touchstart', e => startX = e.touches[0].clientX);
        document.addEventListener('touchend', e => {
            const diffX = e.changedTouches[0].clientX - startX;
            if (startX < 40 && diffX > 80) this.toggleSidebar(true);
            if (diffX < -80) this.toggleSidebar(false);
        });
    },

    log(msg, color = "var(--text)") {
        const term = document.getElementById('term-out');
        if (!term) return;
        const line = document.createElement('div');
        line.style.color = color; line.innerText = `> ${msg}`;
        term.appendChild(line); term.scrollTop = term.scrollHeight;
    },

    toggleSidebar(f) { document.getElementById('sidebar').classList.toggle('active', f); },
    toggleCMD() { document.getElementById('cmd-panel').classList.toggle('active'); },
    showModal(t, h) { document.getElementById('modal-title').innerText = t; document.getElementById('modal-body').innerHTML = h; document.getElementById('modal-overlay').style.display = 'flex'; },
    closeModal() { document.getElementById('modal-overlay').style.display = 'none'; },
    beautifyCode() { /* js-beautify logic */ },
    openIntel() { /* Analysis logic */ },
    nukeSystem() { if(confirm("Wipe cache?")) { localforage.clear(); location.reload(); } }

};

document.addEventListener('DOMContentLoaded', () => Nexus.boot());
</script>
</body>
</html>
