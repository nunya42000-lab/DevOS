<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevOS Nexus Prime</title>
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script type="module">
        import { basicSetup } from "https://esm.sh/codemirror@6.0.1";
        import { EditorView } from "https://esm.sh/@codemirror/view";
        import { EditorState, Compartment } from "https://esm.sh/@codemirror/state";
        import { javascript } from "https://esm.sh/@codemirror/lang-javascript";
        import { html } from "https://esm.sh/@codemirror/lang-html";
        import { css } from "https://esm.sh/@codemirror/lang-css";
        import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark";

        window.CM6 = { basicSetup, EditorView, EditorState, Compartment, javascript, html, css, oneDark };
        window.dispatchEvent(new Event('cm6-ready'));
    </script>

    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --surface: #21262d;
            --accent: #2f81f7; --success: #3fb950; --danger: #f85149;
            --warn: #d29922; --text: #c9d1d9; --border: #30363d;
            --gold: #d29922; --sidebar-width: 300px; --term-height: 180px;
            --ui-scale: 1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden; font-size: calc(14px * var(--ui-scale));
        }

        .nexus-root { display: flex; height: 100%; width: 100%; overflow: hidden; transform-origin: top left; }

        .sidebar {
            position: fixed; top: 0; left: -100%; bottom: 0; height: 100%; width: 280px; 
            max-width: 85vw; background: var(--panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 10000;
        }
        .sidebar.active { left: 0; }
        @media (min-width: 1024px) { .sidebar { position: relative; left: 0; flex-shrink: 0; } }

        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: var(--gold); }
        .sidebar-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        
        .acc-item { border-bottom: 1px solid var(--border); }
        .acc-head { padding: 12px 15px; background: var(--surface); cursor: pointer; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #8b949e; display: flex; justify-content: space-between; align-items: center; }
        .acc-body { display: none; padding: 0; background: var(--panel); }
        .acc-body.active { display: block; }
        .list-entry { padding: 10px 15px; font-size: 0.85rem; color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .list-entry.active { background: var(--surface); border-left-color: var(--gold); color: white; }

        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Infinite Ribbon Toolbar Setup */
        .toolbar-viewport {
            background: var(--panel); border-bottom: 1px solid var(--border); 
            width: 100%; overflow: hidden; flex-shrink: 0;
        }
        .toolbar-track {
            display: flex; gap: 8px; padding: 8px; overflow-x: auto; 
            white-space: nowrap; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .toolbar-track::-webkit-scrollbar { display: none; }
        
        .tool-btn { padding: 8px 14px; border-radius: 6px; border: none; font-size: 0.7rem; font-weight: bold; color: white; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
        .btn-blue { background: var(--accent); } .btn-gold { background: var(--gold); } .btn-green { background: var(--success); } .btn-gray { background: #30363d; } .btn-red { background: var(--danger); }

        .tab-bar { display: flex; background: var(--bg); height: 35px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; touch-action: pan-x; }
        .tab { padding: 0 12px; display: flex; align-items: center; font-size: 0.75rem; border-right: 1px solid var(--border); cursor: pointer; color: #8b949e; background: var(--panel); min-width: 80px; }
        .tab.active { background: var(--bg); color: white; border-top: 2px solid var(--gold); }

        /* SCROLL FIX: Absolute Positioning guarantees editor fits container */
        .editor-area { flex: 1; overflow: hidden; position: relative; background: #000; }
        .cm-editor { position: absolute; top: 0; bottom: 0; left: 0; right: 0; outline: none !important; }
        .cm-scroller { overflow: auto !important; height: 100%; font-family: 'Fira Code', monospace; font-size: 14px; -webkit-overflow-scrolling: touch; }

        #resizer { height: 8px; background: var(--border); cursor: ns-resize; flex-shrink: 0; position: relative; z-index: 5; }
        #resizer::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 40px; height: 2px; background: var(--border); border-radius: 2px; }
        
        /* Terminal is Hidden by Default */
        .terminal { display: none; height: var(--term-height); background: #000; flex-direction: column; flex-shrink: 0; }
        .terminal.active { display: flex; }
        
        #term-out { flex: 1; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 11px; color: var(--success); }
        .term-input { display: flex; padding: 6px 12px; background: #111; border-top: 1px solid #222; align-items: center; }
        .term-input input { flex: 1; background: transparent; border: none; color: white; outline: none; font-family: monospace; font-size: 14px; margin-left: 5px; }

        #kb-drawer { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; z-index: 5000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(100%); border-top: 2px solid var(--gold); }
        #kb-drawer.active { transform: translateY(0); }
        #kb-handle { position: absolute; top: -32px; left: 50%; transform: translateX(-50%); background: var(--gold); color: white; padding: 5px 22px; border-radius: 10px 10px 0 0; font-size: 10px; font-weight: bold; cursor: pointer; }
        .kb-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 8px; height: 190px; overflow-y: auto; touch-action: pan-y; }
        .kb-grid button { height: 42px; background: #222; color: white; border: 1px solid #333; border-radius: 6px; font-size: 14px; font-weight: bold; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal { width: 100%; max-width: 650px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; max-height: 85vh; overflow: hidden; }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; touch-action: pan-y; color: var(--text); }

        #mobile-nav { position: fixed; bottom: 100px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--gold); color: white; border: none; z-index: 6000; font-size: 22px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (max-width: 1024px) { #mobile-nav { display: flex; } }

        .scale-indicator { position: fixed; top: 10px; right: 10px; background: var(--gold); color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; opacity: 0; transition: opacity 0.5s; z-index: 9999; pointer-events: none; }
    </style>
</head>
<body>

    <div id="scale-toast" class="scale-indicator">100%</div>
    <button id="mobile-nav" onclick="Nexus.toggleSidebar()">☰</button>

    <div class="nexus-root" id="app-root">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Nexus Prime</h2>
            </div>
            
            <div style="padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0;">
                <button class="tool-btn btn-blue" onclick="Nexus.createFile()">+ New File</button>
                <button class="tool-btn btn-blue" onclick="Nexus.triggerImport()">💾 Import</button>
                <button class="tool-btn btn-gray" onclick="Nexus.exportZIP()">📦 ZIP Pro</button>
                <button class="tool-btn btn-gray" onclick="Nexus.exportTXT()">📄 TXT Out</button>
            </div>

            <div class="sidebar-scroll">
                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🌿 Branches <span>▼</span></div>
                    <div class="acc-body active">
                        <div style="padding:10px;">
                            <button onclick="const n = prompt('Branch Name:'); if(n) Nexus.createBranch(n);" style="width:100%; background:var(--accent); border:none; color:white; padding:8px; border-radius:4px; font-size:12px; margin-bottom:10px;">+ New Branch</button>
                            <div id="branch-list"></div>
                        </div>
                    </div>
                </div>

                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🔍 Global Search <span>▶</span></div>
                    <div class="acc-body" style="padding:10px;">
                        <input type="text" id="find-box" placeholder="Find text..." style="width:100%; background:#000; border:1px solid #333; color:white; padding:8px; border-radius:4px; margin-bottom:5px;">
                        <input type="text" id="replace-box" placeholder="Replace..." style="width:100%; background:#000; border:1px solid #333; color:white; padding:8px; border-radius:4px; margin-bottom:5px;">
                        <div style="display:flex; gap:5px;">
                            <button onclick="Nexus.searchAll()" style="flex:1; background:var(--accent); border:none; color:white; padding:6px; border-radius:4px; font-size:10px;">Search</button>
                            <button onclick="Nexus.replaceAll()" style="flex:1; background:var(--danger); border:none; color:white; padding:6px; border-radius:4px; font-size:10px;">Replace All</button>
                        </div>
                        <div id="search-results" style="margin-top:10px; max-height:200px; overflow-y:auto;"></div>
                    </div>
                </div>

                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">📄 Explorer <span>▼</span></div>
                    <div class="acc-body active" id="explorer"></div>
                </div>
            </div>

            <div style="padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 5px;">
                <button class="tool-btn btn-gold" style="flex: 1; height: 45px; justify-content: center;" onclick="Nexus.openHelp()">📖 Help</button>
                <button class="tool-btn btn-gold" style="flex: 1; height: 45px; justify-content: center;" onclick="Nexus.openSettings()">⚙️ Settings</button>
            </div>
        </aside>

        <main class="workspace">
            <div class="toolbar-viewport">
                <div class="toolbar-track" id="infinite-ribbon">
                    <div class="ribbon-block" style="display:flex; gap:8px;">
                        <button class="tool-btn btn-danger" onclick="Nexus.toggleTerminal()">⌨️ CMD</button>
                        <button class="tool-btn btn-gray" onclick="Nexus.copy()">📋 Copy</button>
                        <button class="tool-btn btn-gray" onclick="Nexus.cut()">✂️ Cut</button>
                        <button class="tool-btn btn-gray" onclick="Nexus.formatCode()">✨ Format</button>
                        <button class="tool-btn btn-green" onclick="Nexus.run()">▶ Preview</button>
                        <button class="tool-btn btn-blue" onclick="Nexus.runIntel()">🧠 Intel</button>
                        <button class="tool-btn btn-gold" onclick="Nexus.visual()">🎨 Visual</button>
                        <button class="tool-btn btn-gray" onclick="Nexus.history()">🕒 Time</button>
                        <button class="tool-btn btn-gray" onclick="Vault.openModal()">🔐 Vault</button>
                        <button class="tool-btn btn-gray" onclick="Nexus.openDiff()">⚖️ Compare</button>
                        <button class="tool-btn btn-red" onclick="System.nuke()">☢️ Nuke</button>
                    </div>
                </div>
            </div>

            <div class="tab-bar" id="tabs"></div>
            <div class="editor-area"></div>
            <div id="resizer"></div>

            <div class="terminal" id="terminal">
                <div id="term-out"></div>
                <div class="term-input">
                    <button onclick="Nexus.startVoice()" id="voice-btn" style="background:none; border:none; font-size:1.2rem; cursor:pointer;" title="Voice Command">🎙️</button>
                    <input type="text" id="term-in" placeholder="Command (nuke, pwa, build, sync) or '=' for math...">
                </div>
            </div>
        </main>
    </div>

    <div id="modal-overlay" class="overlay" onclick="Nexus.closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-title" style="margin:0; color:var(--gold);">Modal</h3>
                <button onclick="Nexus.closeModal()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <div id="kb-drawer">
        <div id="kb-handle" onclick="Nexus.toggleKb()">NEXUS KEYS</div>
        <div class="kb-grid" id="kb-grid"></div>
    </div>

    <input type="file" id="import-input" style="display:none;" multiple accept=".zip,.txt,.js,.html,.css,.json">

    <script>
        // --- BACKEND SYSTEMS ---
        const System = {
            async nuke() {
                if (confirm("WARNING: This will permanently erase ALL files, history, branches, and settings. Proceed?")) {
                    await localforage.clear();
                    const cacheKeys = await caches.keys();
                    for (let key of cacheKeys) {
                        await caches.delete(key);
                    }
                    window.location.reload();
                }
            },
            generatePWA() {
                const manifest = {
                    name: "DevOS Custom App", short_name: "App", display: "standalone",
                    start_url: "./index.html", background_color: "#000000", theme_color: "#2f81f7",
                    icons: [{"src": "icon.png", "sizes": "512x512", "type": "image/png"}]
                };
                const sw = `const CACHE = 'app-cache-v1';\nself.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html']))));\nself.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(res => res || fetch(e.request))));`;
                Nexus.state.vfs['manifest.json'] = JSON.stringify(manifest, null, 2);
                Nexus.state.vfs['sw.js'] = sw;
                Nexus.save();
                Nexus.renderAll();
                Nexus.log("PWA Manifest & Service Worker generated.", "var(--success)");
            }
        };

        const Vault = {
            snippets: [],
            async init() {
                this.snippets = await localforage.getItem('nexus_snippets') || [];
            },
            async saveSnippet() {
                if (!Nexus.state.cm) return;
                const s = Nexus.state.cm.state.selection.main;
                const code = s.empty ? Nexus.state.cm.state.doc.toString() : Nexus.state.cm.state.sliceDoc(s.from, s.to);
                if (!code.trim()) return Nexus.log("Highlight code to save a snippet.", "var(--warn)");
                
                const name = prompt("Name this snippet:");
                if (!name) return;
                
                this.snippets.push({ id: Date.now(), name, code });
                await localforage.setItem('nexus_snippets', this.snippets);
                Nexus.log(`Snippet "${name}" saved to Vault.`, "var(--success)");
                this.openModal(); // Refresh modal UI
            },
            async deleteSnippet(id) {
                this.snippets = this.snippets.filter(s => s.id !== id);
                await localforage.setItem('nexus_snippets', this.snippets);
                this.openModal();
            },
            insertSnippet(code) {
                if (!Nexus.state.cm) return;
                Nexus.state.cm.dispatch({ changes: { from: Nexus.state.cm.state.selection.main.head, insert: code } });
                Nexus.closeModal();
                Nexus.log("Snippet inserted.", "var(--success)");
            },
            openModal() {
                let html = `
                    <div style="margin-bottom: 15px;">
                        <button class="tool-btn btn-blue" onclick="Vault.saveSnippet()" style="width: 100%; justify-content: center; height: 40px;">+ Save Selection to Vault</button>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:10px;">
                `;
                if (this.snippets.length === 0) {
                    html += `<p style="color:var(--muted); font-size:12px;">No snippets saved yet. Highlight code and click the button above to save snippets.</p>`;
                } else {
                    this.snippets.forEach(s => {
                        const safeCode = s.code.replace(/`/g, '\\`'); // Escape backticks for injection
                        html += `
                        <div style="background:var(--surface); padding:10px; border-radius:6px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-weight:bold; color:var(--text);">${s.name}</span>
                            <div style="display:flex; gap:5px;">
                                <button class="tool-btn btn-green" onclick="Vault.insertSnippet(\`${safeCode}\`)">Insert</button>
                                <button class="tool-btn btn-red" onclick="Vault.deleteSnippet(${s.id})">🗑</button>
                            </div>
                        </div>`;
                    });
                }
                html += `</div>`;
                Nexus.showModal("🔐 Snippet Vault", html);
            },
            compile() {
                Nexus.log("Starting Production Bundle...", 'var(--gold)');
                const bundle = Object.entries(Nexus.state.vfs)
                    .map(([name, content]) => `/* File: ${name} */\n${content}`).join('\n\n');
                const blob = new Blob([bundle], { type: 'text/javascript' });
                Nexus.download(blob, 'devos-bundle.js');
                Nexus.log("Build Complete. Download started.", 'var(--success)');
            }
        };

        const NexusHistory = {
            history: {}, limit: 30,
            async init() { this.history = await localforage.getItem('nexus_history') || {}; },
            async takeSnapshot(filename, code) {
                if (!this.history[filename]) this.history[filename] = [];
                const last = this.history[filename][this.history[filename].length - 1];
                if (last && last.code === code) return;
                this.history[filename].push({ ts: Date.now(), code });
                if (this.history[filename].length > this.limit) this.history[filename].shift();
                await localforage.setItem('nexus_history', this.history);
            },
            restore(filename, timestamp) {
                const snap = this.history[filename].find(h => h.ts === timestamp);
                if (snap) {
                    Nexus.state.vfs[filename] = snap.code;
                    Nexus.save();
                    Nexus.openFile(filename);
                    Nexus.log(`Restored ${filename}`, "var(--success)");
                }
            }
        };

        const NexusSync = {
            peer: null, conn: null,
            init() {
                if (typeof Peer === 'undefined') return Nexus.log("PeerJS missing.", 'var(--danger)');
                const deviceId = 'devos-' + Math.floor(Math.random() * 10000);
                this.peer = new Peer(deviceId);
                this.peer.on('open', (id) => Nexus.log(`Sync ID: ${id}. Share to link devices.`, 'var(--accent)'));
                this.peer.on('connection', (connection) => {
                    this.conn = connection;
                    this.setupListeners();
                    Nexus.log("REMOTE DEVICE LINKED", 'var(--success)');
                });
            },
            connectTo(remoteId) {
                if (!this.peer) return;
                this.conn = this.peer.connect(remoteId);
                this.setupListeners();
            },
            setupListeners() {
                this.conn.on('data', (data) => {
                    if (data.type === 'KEYSTROKE') {
                        Nexus.type(data.value, true);
                    }
                });
            },
            sendKeystroke(key) {
                if (this.conn && this.conn.open) this.conn.send({ type: 'KEYSTROKE', value: key });
            }
        };

        // --- CORE NEXUS OBJECT ---
        const Nexus = {
            state: {
                vfs: {}, active: null, tabs: [], cm: null,
                languageConf: null, 
                branchesData: {}, currentBranch: 'main',
                config: { 
                    haptics: true, scale: 1, termHeight: 180, gesturesEnabled: true,
                    kbEnabled: true,
                    kb: ['{', '}', '(', ')', ';', '=>', '&&', '||', '!', '=', '$', '_', '.', ',', '+', '-', '*', '/', '<', '>'] 
                }
            },

            async boot() {
                localforage.config({ name: 'Nexus_Prime_V6' });
                
                this.state.vfs = await localforage.getItem('vfs') || {};
                
                // Merge config so new properties (like kbEnabled) don't get lost on older saves
                const storedConfig = await localforage.getItem('config');
                if (storedConfig) {
                    this.state.config = { ...this.state.config, ...storedConfig };
                }
                
                this.state.branchesData = await localforage.getItem('nexus_branches') || { 'main': { ...this.state.vfs } };
                this.state.currentBranch = await localforage.getItem('nexus_active_branch') || 'main';

                await NexusHistory.init();
                await Vault.init(); 
                this.applyUIProperties();

                if (!window.CM6) {
                    await new Promise(r => window.addEventListener('cm6-ready', r));
                }

                this.initEditor('');
                this.initResizer();
                this.initGestures();
                this.initImporter();
                this.initTerm();
                this.initInfiniteRibbon();
                
                this.renderAll();
                this.renderKb();
                
                const files = Object.keys(this.state.vfs);
                if (files.length > 0) {
                    this.openFile(files[0]);
                } else {
                    this.log("VFS Empty. Import or create a file to start.", "var(--gold)");
                }
            },

            toggleTerminal() {
                const term = document.getElementById('terminal');
                term.classList.toggle('active');
                if (term.classList.contains('active')) {
                    document.getElementById('term-in').focus();
                }
                if (this.state.cm) this.state.cm.requestMeasure();
            },

            initInfiniteRibbon() {
                const ribbon = document.getElementById('infinite-ribbon');
                const block = ribbon.innerHTML;
                ribbon.innerHTML = block + block + block;
                
                setTimeout(() => {
                    const blockWidth = ribbon.scrollWidth / 3;
                    ribbon.scrollLeft = blockWidth; 

                    ribbon.addEventListener('scroll', () => {
                        if (ribbon.scrollLeft <= 10) {
                            ribbon.scrollLeft += blockWidth;
                        } else if (ribbon.scrollLeft >= (blockWidth * 2) - 10) {
                            ribbon.scrollLeft -= blockWidth;
                        }
                    });
                }, 100);
            },

            initEditor(initialContent) {
                const editorArea = document.querySelector('.editor-area');
                editorArea.innerHTML = ''; 

                this.state.languageConf = new window.CM6.Compartment();

                const updateListener = window.CM6.EditorView.updateListener.of((update) => {
                    if (update.docChanged && this.state.active) {
                        const code = update.state.doc.toString();
                        this.state.vfs[this.state.active] = code;
                        NexusHistory.takeSnapshot(this.state.active, code);
                    }
                });

                this.state.cm = new window.CM6.EditorView({
                    state: window.CM6.EditorState.create({
                        doc: initialContent,
                        extensions: [
                            window.CM6.basicSetup,
                            window.CM6.oneDark,
                            this.state.languageConf.of(window.CM6.javascript()), 
                            updateListener,
                            window.CM6.EditorView.lineWrapping
                        ]
                    }),
                    parent: editorArea
                });
            },

            async save() { 
                await localforage.setItem('vfs', this.state.vfs);
                await localforage.setItem('config', this.state.config); 
            },

            applyUIProperties() {
                document.documentElement.style.setProperty('--ui-scale', this.state.config.scale);
                document.documentElement.style.setProperty('--term-height', this.state.config.termHeight + 'px');
            },

            openFile(filename) {
                if (!this.state.vfs.hasOwnProperty(filename)) return;
                this.state.active = filename;
                const content = this.state.vfs[filename] || '';
                
                if (this.state.cm) {
                    const ext = filename.split('.').pop().toLowerCase();
                    let langExt = window.CM6.javascript();
                    if (ext === 'html') langExt = window.CM6.html();
                    else if (ext === 'css') langExt = window.CM6.css();

                    this.state.cm.dispatch({
                        changes: { from: 0, to: this.state.cm.state.doc.length, insert: String(content) },
                        effects: this.state.languageConf.reconfigure(langExt)
                    });
                }
                
                this.renderAll();
                if (window.innerWidth < 1024) document.getElementById('sidebar').classList.remove('active');
            },

            type(val, fromSync = false) {
                if (!this.state.cm || !this.state.active) return;
                const cursor = this.state.cm.state.selection.main.head;
                
                if (val === 'BACKSPACE') {
                    if (cursor > 0) this.state.cm.dispatch({ changes: { from: cursor - 1, to: cursor, insert: "" } });
                } else {
                    this.state.cm.dispatch({
                        changes: { from: cursor, insert: val },
                        selection: { anchor: cursor + val.length } 
                    });
                }
                
                if (this.state.config.haptics && window.navigator.vibrate) window.navigator.vibrate(50);
                if (!fromSync && NexusSync.conn) NexusSync.sendKeystroke(val);
            },

            toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); },
            triggerImport() { document.getElementById('import-input').click(); },

            initGestures() {
                let initialDist = 0; let initialScale = 1;
                const toast = document.getElementById('scale-toast');

                window.addEventListener('touchstart', (e) => {
                    if (!this.state.config.gesturesEnabled) return;
                    if (e.touches.length === 2) {
                        initialDist = Math.hypot( e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY );
                        initialScale = this.state.config.scale;
                    }
                }, { passive: false });
                window.addEventListener('touchmove', (e) => {
                    if (!this.state.config.gesturesEnabled || e.touches.length !== 2) return;
                    e.preventDefault(); 
                    const currentDist = Math.hypot( e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY );
                    const factor = currentDist / initialDist;
                    const newScale = Math.max(0.6, Math.min(2.0, initialScale * factor));
                    this.state.config.scale = parseFloat(newScale.toFixed(2));
                    this.applyUIProperties();
                    toast.innerText = Math.round(this.state.config.scale * 100) + '%';
                    toast.style.opacity = '1';
                }, { passive: false });
                window.addEventListener('touchend', () => {
                    if (!this.state.config.gesturesEnabled) return;
                    setTimeout(() => toast.style.opacity = '0', 1000);
                    this.save();
                });
            },

            initResizer() {
                const resizer = document.getElementById('resizer');
                let startY, startH;
                const onDown = (e) => {
                    startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    startH = this.state.config.termHeight;
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onUp);
                };
                const onMove = (e) => {
                    const currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    const delta = startY - currentY;
                    this.state.config.termHeight = Math.max(100, Math.min(window.innerHeight * 0.7, startH + delta));
                    this.applyUIProperties();
                };
                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    document.removeEventListener('touchmove', onMove);
                    document.removeEventListener('touchend', onUp);
                    this.save();
                };
                resizer.addEventListener('mousedown', onDown);
                resizer.addEventListener('touchstart', onDown);
            },

            openSettings() {

                            <label style="font-size:12px; display:block; margin-bottom:5px;">Programmable Nexus Keys (comma separated)</label>
                            <textarea id="kb-keys" style="width:100%; height:60px; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:5px;">${keysStr}</textarea>

            openHelp() {

                    <div style="line-height: 1.6;">
                        <h4 style="margin-top:0;">Nexus Prime Ultimate</h4>
                        <ul style="padding-left: 20px;">

            initImporter() {
                const input = document.getElementById('import-input');
                input.onchange = async (e) => {
                    const files = e.target.files;
                    if (!files.length) return;
                    for(let file of files) {
                        if (file.name.endsWith('.zip')) {
                            const zip = await JSZip.loadAsync(file);
                            for (let path in zip.files) {
                                if (!zip.files[path].dir) {
                                    this.state.vfs[zip.files[path].name] = await zip.files[path].async("string");
                                }
                            }
                            this.log(`Extracted ZIP: ${file.name}`, "var(--success)");
                        } else {
                            this.state.vfs[file.name] = await file.text();
                        }
                    }
                    this.save();
                    this.renderAll();
                    input.value = "";
                };
            },

            async exportZIP() {
                let name = prompt("Enter ZIP file name:", "nexus-project");
                if(!name) return;
                const zip = new JSZip();
                Object.entries(this.state.vfs).forEach(([n, c]) => zip.file(n, c));
                const blob = await zip.generateAsync({ type: "blob" });
                this.download(blob, name.endsWith('.zip') ? name : name + '.zip');
            },

            exportTXT() {
                let name = prompt("Enter TXT file name:", "nexus-log");
                if(!name) return;
                let out = "";
                Object.entries(this.state.vfs).forEach(([n, c]) => { out += `${n}\n\`\`\`\n${c}\n\`\`\`\n\n`; });
                this.download(new Blob([out], { type: "text/plain" }), name.endsWith('.txt') ? name : name + '.txt');
            },

            download(blob, name) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name;
                a.click();
            },

            formatCode() {
                if (!this.state.active || !this.state.cm) return;
                const code = this.state.cm.state.doc.toString();
                const ext = this.state.active.split('.').pop();
                let formatted = code;
                try {
                    if (ext === 'js' || ext === 'json') formatted = js_beautify(code, { indent_size: 4 });
                    else if (ext === 'html') formatted = html_beautify(code, { indent_size: 4 });
                    else if (ext === 'css') formatted = css_beautify(code, { indent_size: 4 });
                    this.state.cm.dispatch({ changes: { from: 0, to: code.length, insert: formatted } });
                    this.log("Code Formatted ✨", "var(--success)");
                } catch(e) { this.log("Format error", "var(--danger)"); }
            },

            run() {
                const html = this.state.vfs['index.html'] || '<h1>No index.html</h1>';
                const css = `<style>${this.state.vfs['styles.css'] || ''}</style>`;
                const js = `<script>${this.state.vfs['main.js'] || ''}<\/script>`;
                const blob = new Blob([html + css + js], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                
                const frameHtml = `
                    <div style="display:flex; justify-content:flex-end; padding-bottom:10px;">
                        <a href="${url}" target="_blank" style="color:var(--accent); text-decoration:none; font-size:12px;">Open in New Tab ↗</a>
                    </div>
                    <iframe src="${url}" style="width:100%; height:60vh; border:none; background:#fff; border-radius:8px;"></iframe>
                `;
                this.showModal("Live Sandbox", frameHtml);
            },

            visual() { 
                let html = `
                    <div style="display:flex; flex-direction:column; gap:15px;">
                        <div style="background:var(--surface); padding:15px; border-radius:8px;">
                            <h4 style="margin-top:0;">State Machine Builder</h4>
                            <p style="font-size:12px; color:var(--muted);">Generate boilerplate switch logic for app states.</p>
                            <input type="text" id="sm-states" placeholder="States (e.g. INIT, RUN, END)" style="width:100%; padding:8px; margin-bottom:10px; background:var(--bg); border:1px solid var(--border); color:white;">
                            <button class="tool-btn btn-blue" onclick="Nexus.genStateMachine()">Generate Logic</button>
                        </div>
                        <div style="background:var(--surface); padding:15px; border-radius:8px;">
                            <h4 style="margin-top:0;">Audio Synthesizer</h4>
                            <p style="font-size:12px; color:var(--muted);">Generate JS AudioContext beep function directly into code.</p>
                            <button class="tool-btn btn-gold" onclick="Nexus.genAudioSynth()">Insert Synth API</button>
                        </div>
                    </div>
                `;
                this.showModal("🎨 Visual Builders", html); 
            },

            genStateMachine() {
                const val = document.getElementById('sm-states').value;
                if(!val || !this.state.cm) return;
                const states = val.split(',').map(s => s.trim().toUpperCase());
                let code = `const STATES = {\n${states.map(s => `  ${s}: '${s}'`).join(',\n')}\n};\n\nlet currentState = STATES.${states[0]};\n\nfunction handleState() {\n  switch(currentState) {\n`;
                states.forEach(s => code += `    case STATES.${s}:\n      // Logic for ${s}\n      break;\n`);
                code += `  }\n}\n`;
                this.state.cm.dispatch({ changes: { from: this.state.cm.state.selection.main.head, insert: code } });
                this.closeModal();
                this.log("State Machine logic injected.", "var(--success)");
            },

            genAudioSynth() {
                if(!this.state.cm) return;
                const code = `\nconst playTone = (freq = 440, type = 'sine', duration = 100) => {\n  const ctx = new (window.AudioContext || window.webkitAudioContext)();\n  const osc = ctx.createOscillator();\n  osc.type = type;\n  osc.frequency.setValueAtTime(freq, ctx.currentTime);\n  osc.connect(ctx.destination);\n  osc.start();\n  setTimeout(() => osc.stop(), duration);\n};\n`;
                this.state.cm.dispatch({ changes: { from: this.state.cm.state.selection.main.head, insert: code } });
                this.closeModal();
                this.log("Audio Synth injected.", "var(--success)");
            },

            runIntel() {
                let html = `
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <button class="tool-btn btn-blue" onclick="Nexus.intelDeps()" style="height:60px; justify-content:center;">Dependencies</button>
                        <button class="tool-btn btn-gold" onclick="Nexus.intelStorage()" style="height:60px; justify-content:center;">Storage Inspector</button>
                    </div>
                    <div id="intel-output" style="margin-top:15px; background:var(--bg); padding:10px; border-radius:6px; min-height:150px; font-family:monospace; font-size:12px; white-space:pre-wrap; color:var(--success);">Ready. Select an analysis tool.</div>
                `;
                this.showModal("🧠 Intelligence Tools", html);
            },

            intelDeps() {
                if(!this.state.active) return;
                const code = this.state.vfs[this.state.active];
                const decls = code.match(/(?:const|let|var|function|class)\s+([a-zA-Z_$][\w$]*)/g) || [];
                const unique = [...new Set(decls.map(d => d.split(/\s+/).pop()))];
                document.getElementById('intel-output').innerText = `Declarations in ${this.state.active}:\n\n` + unique.join('\n');
            },

            intelStorage() {
                let size = JSON.stringify(this.state.vfs).length;
                let kb = (size / 1024).toFixed(2);
                document.getElementById('intel-output').innerText = `LocalForage VFS Payload:\n\nTotal Size: ${kb} KB\nFiles: ${Object.keys(this.state.vfs).length}\nBranches: ${Object.keys(this.state.branchesData).length}`;
            },

            openDiff() {
                const files = Object.keys(this.state.vfs);
                if(files.length < 2) {
                    this.log("Need at least 2 files to diff.", "var(--warn)");
                    return;
                }
                let opts = files.map(f => `<option value="${f}">${f}</option>`).join('');
                let html = `
                    <div style="display:flex; gap:10px; margin-bottom:10px;">
                        <select id="diff-f1" style="flex:1; background:var(--bg); color:white; border:1px solid var(--border); padding:5px;">${opts}</select>
                        <select id="diff-f2" style="flex:1; background:var(--bg); color:white; border:1px solid var(--border); padding:5px;">${opts}</select>
                        <button class="tool-btn btn-green" onclick="Nexus.runDiff()">Compare</button>
                    </div>
                    <div id="diff-output" style="background:#000; padding:10px; height:300px; overflow:auto; font-family:monospace; font-size:12px;">Select files to compare semantic differences.</div>
                `;
                this.showModal("⚖️ Compare Files", html);
            },

            runDiff() {
                if (typeof diff_match_patch === 'undefined') return document.getElementById('diff-output').innerText = "Diff library not loaded.";
                const f1 = document.getElementById('diff-f1').value;
                const f2 = document.getElementById('diff-f2').value;
                const dmp = new diff_match_patch();
                const diffs = dmp.diff_main(this.state.vfs[f1], this.state.vfs[f2]);
                dmp.diff_cleanupSemantic(diffs);
                document.getElementById('diff-output').innerHTML = dmp.diff_prettyHtml(diffs);
            },

            history() {
                if(!this.state.active) return;
                const hist = NexusHistory.history[this.state.active] || [];
                let html = `<h4 style="margin-top:0;">History for ${this.state.active}</h4><div style="display:flex;flex-direction:column;gap:5px;">`;
                if(hist.length === 0) html += "<p>No snapshots found.</p>";
                hist.slice().reverse().forEach(h => {
                    html += `<button onclick="NexusHistory.restore('${this.state.active}', ${h.ts}); Nexus.closeModal();" style="padding:10px; background:var(--surface); color:white; border:1px solid var(--border); border-radius:6px; cursor:pointer; text-align:left;">Restore: ${new Date(h.ts).toLocaleString()}</button>`;
                });
                html += "</div>";
                this.showModal("🕒 Time Machine", html);
            },

            searchAll() {
                const q = document.getElementById('find-box').value.toLowerCase();
                const res = document.getElementById('search-results');
                res.innerHTML = "";
                if (!q) return;
                Object.entries(this.state.vfs).forEach(([file, code]) => {
                    code.split('\n').forEach((line, i) => {
                        if (line.toLowerCase().includes(q)) {
                            const div = document.createElement('div');
                            div.className = "list-entry";
                            div.style.fontSize = "10px";
                            div.innerText = `${file}:${i+1} > ${line.trim().substring(0, 30)}`;
                            div.onclick = () => this.openFile(file);
                            res.appendChild(div);
                        }
                    });
                });
            },

            replaceAll() {
                const f = document.getElementById('find-box').value;
                const r = document.getElementById('replace-box').value;
                if (!f) return;
                Object.keys(this.state.vfs).forEach(file => {
                    this.state.vfs[file] = this.state.vfs[file].split(f).join(r);
                });
                this.save();
                if(this.state.active) this.openFile(this.state.active);
                this.log("Global replace complete.");
            },

            showModal(title, bodyHTML) {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-body').innerHTML = bodyHTML;
                document.getElementById('modal-overlay').style.display = 'flex';
            },
            closeModal() { document.getElementById('modal-overlay').style.display = 'none'; },
            toggleAcc(el) {
                const body = el.nextElementSibling;
                body.classList.toggle('active');
                el.querySelector('span').innerText = body.classList.contains('active') ? '▼' : '▶';
            },
            toggleKb() { 
                const kb = document.getElementById('kb-drawer');
                const navBtn = document.getElementById('mobile-nav');
                kb.classList.toggle('active'); 
                if (kb.classList.contains('active')) navBtn.style.bottom = '260px';
                else navBtn.style.bottom = '100px';
            },
            copy() { 
                if(!this.state.cm) return;
                const s = this.state.cm.state.selection.main;
                const text = s.empty ? this.state.cm.state.doc.toString() : this.state.cm.state.sliceDoc(s.from, s.to);
                navigator.clipboard.writeText(text); 
                this.log("Copied to clipboard."); 
            },
            cut() { 
                if (!this.state.cm) return;
                const s = this.state.cm.state.selection.main;
                if (!s.empty) {
                    const text = this.state.cm.state.sliceDoc(s.from, s.to);
                    navigator.clipboard.writeText(text);
                    this.state.cm.dispatch({ changes: { from: s.from, to: s.to, insert: "" } });
                    this.log("Cut to clipboard.");
                } else {
                    this.log("Highlight text to cut.", "var(--warn)");
                }
            },

            initTerm() {
                const input = document.getElementById('term-in');
                input.onkeydown = (e) => {
                    if (e.key === 'Enter' && input.value) {
                        this.log(`> ${input.value}`, "white");
                        this.processCommand(input.value);
                        input.value = "";
                    }
                };
            },

            startVoice() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return this.log("Voice not supported here.", "var(--danger)");
                const recognition = new SpeechRecognition();
                this.log("🎙️ Listening...", "var(--accent)");
                recognition.onresult = (e) => {
                    const txt = e.results[0][0].transcript;
                    this.log(`Heard: "${txt}"`);
                    this.processCommand(txt);
                };
                recognition.start();
            },

            log(msg, color = "var(--text)") {
                const out = document.getElementById('term-out');
                const div = document.createElement('div');
                div.style.color = color;
                div.innerText = msg;
                out.appendChild(div);
                out.scrollTop = out.scrollHeight;
            },

            processCommand(cmd) {
                const c = cmd.trim().toLowerCase();
                if (c.startsWith('=')) {
                    try { this.log(`= ${math.evaluate(cmd.substring(1))}`, "var(--success)"); } 
                    catch (e) { this.log("Math Error", "var(--danger)"); }
                } 
                else if (c === 'clear') document.getElementById('term-out').innerHTML = "";
                else if (c === 'nuke') System.nuke();
                else if (c === 'pwa') System.generatePWA();
                else if (c === 'build') Vault.compile();
                else if (c === 'sync') NexusSync.init();
                else if (c === 'help') this.log("Available: clear, nuke, pwa, build, sync, =, help", "var(--gold)");
                else this.log("Unknown command. Type 'help'.", "var(--danger)");
            },

            renderAll() {
                this.renderTabs();
                this.renderExplorer();
                this.renderBranches();
            },

            renderTabs() {
                const t = document.getElementById('tabs');
                t.innerHTML = "";
                this.state.tabs.forEach(tab => {
                    const div = document.createElement('div');
                    div.className = `tab ${tab === this.state.active ? 'active' : ''}`;
                    div.innerHTML = `${tab} <span style="margin-left:8px;color:#888;" onclick="event.stopPropagation(); Nexus.closeTab('${tab}')">✕</span>`;
                    div.onclick = () => this.openFile(tab);
                    t.appendChild(div);
                });
            },

            closeTab(tab) {
                this.state.tabs = this.state.tabs.filter(t => t !== tab);
                if (this.state.active === tab) this.openFile(this.state.tabs[0] || null);
                else this.renderTabs();
            },

            renderExplorer() {
                const e = document.getElementById('explorer');
                e.innerHTML = "";
                Object.keys(this.state.vfs).forEach(file => {
                    const div = document.createElement('div');
                    div.className = `list-entry ${file === this.state.active ? 'active' : ''}`;
                    div.innerHTML = `<span>📄 ${file}</span> <span style="color:var(--danger);" onclick="event.stopPropagation(); Nexus.deleteFile('${file}')">🗑</span>`;
                    div.onclick = () => {
                        if (!this.state.tabs.includes(file)) this.state.tabs.push(file);
                        this.openFile(file);
                    };
                    e.appendChild(div);
                });
            },

            createFile() {
                const name = prompt("File name (e.g., script.js):");
                if (name && !this.state.vfs[name]) {
                    this.state.vfs[name] = "";
                    this.state.tabs.push(name);
                    this.save();
                    this.openFile(name);
                }
            },

            deleteFile(name) {
                if (confirm(`Delete ${name}?`)) {
                    delete this.state.vfs[name];
                    this.closeTab(name);
                    this.save();
                    this.renderAll();
                }
            },

            async createBranch(name) {
                const id = name.toLowerCase().replace(/\s+/g, '-');
                if (this.state.branchesData[id]) return this.log("Branch already exists.", 'var(--warn)');
                this.state.branchesData[this.state.currentBranch] = { ...this.state.vfs };
                this.state.branchesData[id] = { ...this.state.vfs };
                this.state.currentBranch = id;
                await localforage.setItem('nexus_branches', this.state.branchesData);
                await localforage.setItem('nexus_active_branch', this.state.currentBranch);
                this.log(`Switched to new branch: ${id}`, 'var(--success)');
                this.renderBranches();
            },

            async switchBranch(id) {
                if (!this.state.branchesData[id]) return;
                this.state.branchesData[this.state.currentBranch] = { ...this.state.vfs };
                this.state.currentBranch = id;
                this.state.vfs = { ...this.state.branchesData[id] };
                await this.save();
                await localforage.setItem('nexus_branches', this.state.branchesData);
                await localforage.setItem('nexus_active_branch', this.state.currentBranch);
                this.log(`Active Branch: ${id}`);
                this.renderAll();
                const files = Object.keys(this.state.vfs);
                if (files.length) this.openFile(files[0]);
            },

            renderBranches() {
                const b = document.getElementById('branch-list');
                b.innerHTML = "";
                Object.keys(this.state.branchesData).forEach(br => {
                    const div = document.createElement('div');
                    div.className = `list-entry ${br === this.state.currentBranch ? 'active' : ''}`;
                    div.innerHTML = `${br === this.state.currentBranch ? '●' : '○'} ${br}`;
                    div.onclick = () => this.switchBranch(br);
                    b.appendChild(div);
                });
            },

            renderKb() {
                const drawer = document.getElementById('kb-drawer');
                if (!this.state.config.kbEnabled) {
                    drawer.style.display = 'none';
                    return;
                }
                drawer.style.display = 'block';

                const grid = document.getElementById('kb-grid');
                if(!grid) return;
                grid.innerHTML = "";
                this.state.config.kb.forEach(k => {
                    const btn = document.createElement('button');
                    btn.innerText = k;
                    btn.onclick = () => this.type(k);
                    grid.appendChild(btn);
                });
                ['Space: ', 'Enter:\n', 'Del:BACKSPACE'].forEach(sys => {
                    const [label, val] = sys.split(':');
                    const btn = document.createElement('button');
                    btn.innerText = label;
                    if(label === 'Space') btn.style.gridColumn = "span 2";
                    btn.onclick = () => this.type(val);
                    grid.appendChild(btn);
                });
            }
        };

        window.onload = () => Nexus.boot();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
            });
        }
    
    <button id="patch-btn" class="tool-btn">Apply Patch</button>

<div id="conflict-modal" class="modal" style="display:none;">
    </div>

<script src="injector.js"></script>
<script src="app.js"></script>
    
</body>
</html>
