<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevOS Nexus Prime | Omni-Edition</title>
    
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121120/diff_match_patch.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/terser/dist/bundle.min.js"></script>
    
    <script src="https://unpkg.com/@rollup/browser@3.29.4/dist/rollup.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/merge/merge.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/merge/merge.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <script type="module">
        import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
        import { javascript } from "https://esm.sh/@codemirror/lang-javascript@6.2.1";
        import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark@6.1.2";
        window.CM6 = { EditorView, basicSetup, javascript, oneDark };
        window.dispatchEvent(new CustomEvent('cm6-ready'));
    </script>
    
    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --surface: #21262d;
            --border: #30363d; --text: #c9d1d9; --accent: #58a6ff;
            --success: #238636; --gold: #d29922; --danger: #da3633; --purple: #bb86fc;
            --muted: #8b949e;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; touch-action: none; display: flex; flex-direction: column;
        }

        header { background: var(--panel); padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .menu-btn { background: transparent; border: 1px solid var(--border); color: var(--text); font-size: 18px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
        
        .tabs-ribbon { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; padding: 10px 15px; background: var(--panel); border-bottom: 1px solid var(--border); scrollbar-width: none; flex-shrink: 0; }
        .tabs-ribbon::-webkit-scrollbar { display: none; }
        
        .tool-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        
        .tab-btn { padding: 8px 12px; background: #000; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; color: var(--muted); }
        .tab-btn.active-tab { background: var(--accent); color: #fff; border-color: var(--accent); }

        .btn-primary { background: var(--accent); color: white; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-warn { background: var(--gold); color: #000; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-success { background: var(--success); color: white; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .btn-blue-outline { border-color: var(--accent); color: var(--accent); background: transparent; }
        .btn-green-outline { border-color: var(--success); color: var(--success); background: transparent; }
        .btn-purple-outline { border-color: var(--purple); color: var(--purple); background: transparent; }
        .btn-red-outline { border-color: var(--danger); color: var(--danger); background: transparent; }

        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; width: 100%; }
        .view-panel { display: none; flex-direction: column; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); }
        .view-panel.active { display: flex; }

        #sidebar { position: absolute; left: -280px; top: 0; width: 280px; height: 100%; background: var(--panel); border-right: 1px solid var(--border); transition: left 0.3s; z-index: 8000; box-shadow: 10px 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        #sidebar.active { left: 0; }
        .side-sec { padding: 10px; border-bottom: 1px solid var(--border); }

        #editor-wrapper { flex: 1; position: relative; overflow: hidden; background: #000; }
        .cm-editor { height: 100%; width: 100%; outline: none !important; }
        
        #mobile-soft-keys { display: flex; overflow-x: auto; padding: 6px; background: var(--panel); gap: 6px; border-top: 1px solid var(--border); flex-shrink: 0; scrollbar-width: none; scroll-behavior: smooth; }
        .soft-key { padding: 10px 15px; background: var(--surface); border: 1px solid var(--border); color: var(--accent); border-radius: 4px; font-family: monospace; font-size: 16px; font-weight: bold; flex-shrink: 0; cursor: pointer; min-width: 45px; text-align: center; }

        .tool-card { background: var(--surface); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--panel); border: 1px solid var(--border); width: 90%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="menu-btn" onclick="Nexus.toggleSidebar(true)">☰</button>
        <div style="font-weight: bold; font-size: 16px;">DevOS <span id="active-file-display" style="color:var(--accent); font-size:12px; margin-left:8px;">No File</span></div>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="tool-btn btn-blue-outline" onclick="Nexus.toggleCMD()">⚡ CMD</button>
        <button class="tool-btn btn-blue-outline" onclick="Nexus.beautifyCode()">✨ FMT</button>
        <button class="tool-btn" onclick="document.getElementById('zip-upload-input').click()">📁 LOAD</button>
        <input type="file" id="zip-upload-input" accept=".zip,application/zip" style="display:none" onchange="Nexus.loadZipToVFS(this.files[0])">
        <button class="tool-btn btn-purple-outline" onclick="Nexus.openAdvancedMerger()">📦 MERGE</button>
        <button class="tool-btn btn-green-outline" onclick="Nexus.saveVFS()">💾 SAVE</button>
        <button class="tool-btn btn-warn" onclick="Nexus.buildForProduction()">🚀 BUILD</button>
    </div>
</header>

<nav class="tabs-ribbon">
    <button class="tab-btn active-tab" id="tab-btn-editor" onclick="Nexus.switchTab('editor')">Code</button>
    <button class="tab-btn" id="tab-btn-preview" onclick="Nexus.switchTab('preview')">Sandbox</button>
    <button class="tab-btn" id="tab-btn-diagnostic" onclick="Nexus.switchTab('diagnostic')">Inspector</button>
    <button class="tab-btn" id="tab-btn-visual" onclick="Nexus.switchTab('visual')">Visual Labs</button>
    <button class="tab-btn" id="tab-btn-intel" onclick="Nexus.switchTab('intel')">Intel</button>
    <button class="tab-btn" id="tab-btn-time" onclick="Nexus.switchTab('time')">Time & Diff</button>
</nav>

<div class="workspace">
    <aside id="sidebar">
        <div style="padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; color: var(--accent);">EXPLORER</span>
            <button class="tool-btn" onclick="Nexus.toggleSidebar(false)">✕</button>
        </div>
        <div class="side-sec">
            <input type="text" id="global-search-input" placeholder="Search..." style="width:100%; padding:10px; background:#000; border:1px solid var(--border); color:white; border-radius:4px;">
            <div id="search-results-tree"></div>
        </div>
        <div id="explorer" style="flex: 1; overflow-y: auto;"></div>
        <div style="padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;">
            <button class="tool-btn btn-purple-outline" onclick="Nexus.initSync()">📡 Start Sync</button>
            <button class="tool-btn btn-blue-outline" onclick="Nexus.connectSync()">🔗 Connect</button>
            <button class="tool-btn btn-green-outline" onclick="Nexus.generateComponent()">🧩 New Component</button>
            <button class="tool-btn btn-red-outline" onclick="Nexus.clearWorkspace()">🗑️ Wipe All</button>
        </div>
    </aside>

    <div id="editor-view" class="view-panel active">
        <div id="editor-wrapper"></div>
        <div id="mobile-soft-keys"></div>
    </div>

    <div id="preview-view" class="view-panel">
        <div style="padding: 10px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <strong style="color: var(--success)">Sandbox</strong>
            <div style="display: flex; gap: 8px;">
                <button class="btn-danger" style="padding: 4px 12px;" onclick="Nexus.stopSandbox()">⏹ STOP</button>
                <button class="btn-success" style="padding: 4px 12px;" onclick="Nexus.refreshLivePreview()">▶ RUN</button>
            </div>
        </div>
        <iframe id="live-preview-frame" style="flex:1; width:100%; border:none; background:#fff;"></iframe>
        <div id="ghost-console" style="height: 120px; background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; overflow-y: auto; border-top: 2px solid #333;"></div>
    </div>

    <div id="diagnostic-view" class="view-panel" style="padding: 15px; overflow-y:auto;">
        <h3 style="color:var(--danger)">Diagnostics Hub</h3>
        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
            <button class="btn-danger" style="flex:1" onclick="Nexus.runLinter()">LINT</button>
            <button class="btn-warn" style="flex:1" onclick="Nexus.runDependencyCheck()">SCAN</button>
            <button class="btn-success" style="flex:1" onclick="Nexus.autoFixCurrentFile()">FIX</button>
        </div>
        <div id="diagnostic-results" style="height: 120px; background:#000; padding:10px; border-radius:6px; font-family:monospace; font-size:12px; overflow-y:auto; border:1px solid var(--border);"></div>
        <h3 style="color:var(--gold); margin-top:20px;">LocalStorage Inspector</h3>
        <div id="storage-inspector-ui"></div>
    </div>

    <div id="visual-view" class="view-panel" style="padding:20px; overflow-y:auto;">
        <h2 style="color:var(--accent);">Visual Labs</h2>
        <div class="tool-card">
            <h3>🖼️ Sprite Slicer</h3>
            <input type="file" accept="image/*" onchange="Nexus.handleSpriteUpload(event)">
            <button class="btn-primary" style="width:100%; margin-top:10px;" onclick="Nexus.generateSpriteCSS()">Generate CSS</button>
        </div>
    </div>

    <div id="intel-view" class="view-panel" style="padding:20px;">
        <h2>System Intel</h2>
        <div id="project-stats-container"></div>
    </div>

    <div id="time-view" class="view-panel" style="padding:15px; display:flex; flex-direction:column;">
        <h2>Time & Diff</h2>
        <div style="display: flex; gap: 10px; margin-bottom:10px;">
            <select id="diff-file-a" class="tool-btn" style="flex:1"></select>
            <select id="diff-file-b" class="tool-btn" style="flex:1"></select>
            <button class="btn-primary" onclick="Nexus.executeDiff()">Compare</button>
        </div>
        <div id="diff-container" style="flex:1; border:1px solid var(--border); background:#000;"></div>
    </div>

    <div id="cmd-panel" style="position:absolute; bottom:-400px; left:0; width:100%; height:400px; background:var(--panel); border-top:2px solid var(--accent); transition:bottom 0.3s; display:flex; flex-direction:column; padding:12px; box-sizing:border-box; z-index:9000;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="color:var(--accent); font-weight:bold;">INJECTOR</span>
            <button class="btn-outline" onclick="Nexus.toggleCMD()">CLOSE</button>
        </div>
        <textarea id="cmd-input" style="flex:1; background:#000; color:#22c55e; border:1px solid var(--border); padding:10px; font-family:monospace;"></textarea>
        <button class="btn-success" style="margin-top:10px;" onclick="Nexus.runCMD()">EXECUTE</button>
    </div>
</div>

<div id="modal-overlay" onclick="if(event.target === this) Nexus.closeModal()">
    <div class="modal-content">
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
    </div>
</div>

<script src="./nexus.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
        if (window.Nexus) window.Nexus.boot();
    });
</script>
</body>
</html>
