    <script>
        window.Nexus = window.Nexus || {};
        window.Nexus._queue = window.Nexus._queue || [];
        window.Nexus.boot = window.Nexus.boot || function(...args) {
            console.warn("Nexus.boot called before engine ready. Queueing command.");
            window.Nexus._queue.push({ fn: 'boot', args });
        };
    </script>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --surface: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #2f81f7;
            --success: #3fb950;
            --warn: #d29922;
            --danger: #f85149;
            --gold: #d29922;
            --font-UI: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --sidebar-w: 88vw;
            --sidebar-max: 450px;
            --dock-bg: #282c34;
            --dock-border: #3e4451;
            --dock-text: #abb2bf;
            --dock-hover-bg: #3e4451;
            --dock-hover-text: #fff;
            --dock-label: #9da5b4;
            --dock-active-bg: #e5e9f0;
            --dock-active-text: #282c34;
            --gutter-text: #7d8590;
        }

        body.outdoor-mode {
            --bg: #ffffff;
            --panel: #f6f8fa;
            --surface: #ffffff;
            --border: #d0d7de;
            --text: #24292f;
            --accent: #0969da;
            --gold: #9a6700;
            --dock-bg: #f6f8fa;
            --dock-border: #d0d7de;
            --dock-text: #24292f;
            --dock-hover-bg: #e5e9f0;
            --dock-hover-text: #0d1117;
            --dock-label: #57606a;
            --dock-active-bg: #0969da;
            --dock-active-text: #ffffff;
            --gutter-text: #57606a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-UI);
            overflow: hidden;
            overscroll-behavior: none;
            user-select: none;
        }

        #app-root {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        #ribbon-container {
            height: 55px;
            flex-shrink: 0;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            overflow-x: scroll;
            white-space: nowrap;
            position: relative;
            z-index: 1000;
            display: flex;
            align-items: center;
            -webkit-overflow-scrolling: touch;
        }

        #ribbon-container::-webkit-scrollbar { display: none; }

        #ribbon-track {
            display: inline-flex;
            padding: 0 10px;
            gap: 8px;
        }

        .tool-btn {
            padding: 10px 18px;
            border-radius: 14px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        #workspace {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        #file-tabs-bar {
            display: flex;
            overflow-x: auto;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            min-height: 38px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        #file-tabs-bar::-webkit-scrollbar { display: none; }

        #editor-view {
            flex: 1;
            display: flex;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        #gutter {
            width: 45px;
            background: var(--bg);
            border-right: 1px solid var(--border);
            color: var(--gutter-text);
            font-family: monospace;
            font-size: 14px;
            line-height: 22px;
            text-align: right;
            padding: 15px 10px 50vh 0;
            cursor: pointer;
            overflow: hidden;
            height: 100%;
            touch-action: manipulation;
        }

        #raw-terminal {
            flex: 1;
            background: transparent;
            color: var(--text);
            border: none;
            padding: 15px;
            padding-bottom: 50vh;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 22px;
            outline: none;
            resize: none;
            white-space: pre;
            overflow: auto;
            user-select: text !important;
            -webkit-user-select: text !important;
            touch-action: pan-y pan-x;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            width: 90%;
            height: 80%;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,1);
        }

        .modal-body {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .p-head {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 900;
            font-size: 14px;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .close-x {
            font-size: 32px;
            cursor: pointer;
            color: var(--text);
            background: none;
            border: none;
            line-height: 1;
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <div id="app-root">
        <nav id="ribbon-container">
            <div id="ribbon-track">
                <button class="tool-btn">⚙️</button>
                <button class="tool-btn">📁</button>
                <button class="tool-btn">🔒</button>
                <button class="tool-btn">🔄</button>
                <button class="tool-btn">🔎</button>
                <button class="tool-btn">▶️</button>
            </div>
        </nav>

        <div id="workspace">
            <div id="file-tabs-bar"></div>
            <div id="editor-view">
                <div id="gutter">1</div>
                <textarea id="raw-terminal" readonly placeholder="Ready..."></textarea>
            </div>
        </div>
    </div>

    <div id="modal-manual" class="modal-overlay">
        <div class="modal-content">
            <div class="p-head">
                <span>📖 divIDE v0.8</span>
                <button class="close-x" onclick="this.closest('.modal-overlay').classList.remove('active')">&times;</button>
            </div>
            <div class="modal-body">
                <p>divIDE is a mobile-first code editor built for your phone.</p>
            </div>
        </div>
    </div>

    <script>
        console.log("divIDE v0.8 loaded successfully");
        if (window.Nexus && window.Nexus._queue) {
            window.Nexus._queue.forEach(item => {
                if (item.fn === 'boot') console.log("Pending boot:", item.args);
            });
        }
    </script>
</body>
</html>
