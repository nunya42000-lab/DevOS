<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevOS Workspace | Ultimate</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <style>
        :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #2f81f7; --warn: #d29922; --danger: #f85149; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        * { box-sizing: border-box; }
        
        /* Layout */
        .tab-bar { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); height: 50px; align-items: center; padding: 0 10px; gap: 10px; }
        .app-container { display: flex; flex: 1; position: relative; overflow: hidden; }
        
        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); height: 100%; display: flex; flex-direction: column; transition: 0.3s; }
        .sidebar.closed { margin-left: -280px; }
        
        main { flex: 1; display: flex; flex-direction: column; background: #000; }
        .CodeMirror { flex: 1; font-size: 14px; }

        /* Terminal */
        #bottom-terminal { position: fixed; bottom: 0; left: 0; right: 0; height: 35vh; background: #000; border-top: 2px solid var(--accent); transform: translateY(100%); transition: 0.3s; display: flex; flex-direction: column; z-index: 3000; }
        #bottom-terminal.open { transform: translateY(0); }
        #terminal-log { flex: 1; overflow-y: auto; padding: 10px; font-family: monospace; color: #aaa; font-size: 12px; }
        .terminal-input-row { display: flex; background: #111; padding: 10px; gap: 10px; border-top: 1px solid #222; }
        #terminal-input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-family: monospace; }

        /* UI Elements */
        button { cursor: pointer; border: none; border-radius: 4px; padding: 6px 12px; font-weight: bold; background: var(--accent); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .accordion-header { padding: 10px; background: #21262d; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12px; font-weight: bold; }
        .accordion-content { display: none; padding: 5px; }
        .accordion-content.open { display: block; }
    </style>
</head>
<body>

    <div class="tab-bar">
        <button class="btn-outline" onclick="Nexus.toggleSidebar()">☰</button>
        <button class="btn-outline" onclick="Nexus.toggleTerminal()">>_ Term</button>
        <span id="current-file-label" style="font-family:monospace; color:var(--accent); margin-left:10px;">No File</span>
        <div style="flex:1"></div>
        <button onclick="Nexus.runPreview()">▶ LIVE RUN</button>
    </div>

    <div class="app-container">
        <aside id="ui-sidebar" class="sidebar">
            <div style="padding:15px; border-bottom:1px solid var(--border);"><strong>DevOS 4.0</strong></div>
            <div style="padding:10px;"><button style="width:100%" onclick="Nexus.createNewFile()">+ New File</button></div>
            <div id="file-list"></div>
        </aside>

        <main>
            <textarea id="code-editor"></textarea>
        </main>
    </div>

    <div id="bottom-terminal">
        <div id="terminal-log"><div>Nexus Kernel v4.5 Ready. Type 'patch-ui' to fix everything.</div></div>
        <div class="terminal-input-row">
            <span style="color:var(--warn)">$</span>
            <input type="text" id="terminal-input" placeholder="Enter command...">
        </div>
    </div>

    <script>
        const Nexus = {
            vfs: {},
            activeFile: null,
            editor: null,

            async boot() {
                console.log("Nexus: Initializing...");
                
                // Initialize Editor
                this.editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
                    mode: "htmlmixed", theme: "dracula", lineNumbers: true, autoCloseBrackets: true
                });

                // Load Data
                const saved = await localforage.getItem('devos_vfs');
                if (saved) this.vfs = saved;

                this.renderFiles();
                if (Object.keys(this.vfs).length > 0) this.openFile(Object.keys(this.vfs)[0]);

                // Input listener
                document.getElementById('terminal-input').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.terminalExec();
                });
                
                console.log("Nexus: Systems Online.");
            },

            renderFiles() {
                const list = document.getElementById('file-list');
                if (!list) return;
                list.innerHTML = Object.keys(this.vfs).map(fn => `
                    <div style="padding:10px; border-bottom:1px solid #222; cursor:pointer;" onclick="Nexus.openFile('${fn}')">📄 ${fn}</div>
                `).join('');
            },

            openFile(fn) {
                if (this.activeFile) this.vfs[this.activeFile] = this.editor.getValue();
                this.activeFile = fn;
                this.editor.setValue(this.vfs[fn] || "");
                document.getElementById('current-file-label').innerText = fn;
                this.renderFiles();
            },

            async saveVFS() {
                if (this.activeFile) this.vfs[this.activeFile] = this.editor.getValue();
                await localforage.setItem('devos_vfs', this.vfs);
            },

            createNewFile() {
                const n = prompt("Filename:");
                if (n) { this.vfs[n] = ""; this.openFile(n); }
            },

            toggleTerminal() { document.getElementById('bottom-terminal').classList.toggle('open'); },
            toggleSidebar() { document.getElementById('ui-sidebar').classList.toggle('closed'); },

            terminalExec() {
                const input = document.getElementById('terminal-input');
                const log = document.getElementById('terminal-log');
                const cmd = input.value.trim().toLowerCase();
                if (!cmd) return;

                log.innerHTML += `<div><span style="color:var(--accent)">$</span> ${cmd}</div>`;
                
                if (cmd === 'patch-ui') {
                    this.applyUltimatePatch();
                    log.innerHTML += `<div style="color:var(--warn)">> Permanent Patch Applied. Restarting...</div>`;
                } else if (cmd === 'save') {
                    this.saveVFS();
                    log.innerHTML += `<div>> VFS Synced.</div>`;
                } else if (cmd === 'help') {
                    log.innerHTML += `<div>> Commands: patch-ui, save, help</div>`;
                } else {
                    log.innerHTML += `<div style="color:var(--danger)">> Unknown command.</div>`;
                }

                input.value = "";
                log.scrollTop = log.scrollHeight;
            },

            applyUltimatePatch() {
                // This is the HTML from your screenshots
                const ultimateHTML = `
            <div style="padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0"><span style="color:var(--accent)">DevOS</span> <span style="color:var(--warn)">Ultimate</span></h3>
                <button onclick="Nexus.toggleSidebar()" style="background:var(--danger); font-size:10px;">✖</button>
            </div>
            <div style="padding: 10px; display: flex; gap: 5px;">
                <button style="flex:1; background:var(--accent);" onclick="Nexus.createNewFile()">+ NEW</button>
                <button style="flex:1; background:var(--warn); color:#000;" onclick="document.getElementById('file-upload').click()">📁 IMPORT</button>
            </div>
            <div style="flex:1; overflow-y:auto;">
                <div class="accordion-header" onclick="this.nextElementSibling.classList.toggle('open')" style="color:var(--warn)">📂 EXPLORER <span>▼</span></div>
                <div class="accordion-content open" id="file-list"></div>
                <div class="accordion-header" onclick="this.nextElementSibling.classList.toggle('open')" style="color:#7ee787">🌿 BRANCHES <span>▶</span></div>
                <div class="accordion-content" style="padding:10px;">
                    <div style="color:var(--accent); border:1px solid var(--accent); padding:5px; border-radius:4px;">● main</div>
                </div>
                <div class="accordion-header" onclick="this.nextElementSibling.classList.toggle('open')" style="color:#e3b341">🔐 VAULT <span>▶</span></div>
                <div class="accordion-content" style="padding:10px; color:#666; font-size:10px; text-align:center;">Vault Empty</div>
            </div>
            <div style="padding:10px;"><button style="width:100%; background:var(--warn); color:#000;">⚙️ SETTINGS</button></div>`;

                // PERMANENT REFRACTORING
                let code = this.editor.getValue();
                const regex = /(<aside id="ui-sidebar"[^>]*>)([\s\S]*?)(<\/aside>)/;
                
                if (regex.test(code)) {
                    // Inject the new UI into the editor text
                    const newCode = code.replace(regex, "$1" + ultimateHTML + "$3");
                    this.editor.setValue(newCode);
                    
                    // Force Save & Update Live UI
                    this.saveVFS().then(() => {
                        document.getElementById('ui-sidebar').innerHTML = ultimateHTML;
                        this.renderFiles();
                    });
                } else {
                    alert("Patch Error: Could not find <aside id='ui-sidebar'> in the code editor.");
                }
            },

            runPreview() {
                this.saveVFS();
                const html = this.vfs['index.html'] || "<h1>Create index.html first!</h1>";
                const win = window.open();
                win.document.write(html);
                win.document.close();
            }
        };

        window.onload = () => Nexus.boot();
    </script>
</body>
</html>
