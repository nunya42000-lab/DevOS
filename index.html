<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevOS Nexus Prime | Omni-Edition</title>
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121120/diff_match_patch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-css.min.js"></script>
    <script src="https://unpkg.com/@rollup/browser@3.29.4/dist/rollup.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <script type="module">
        import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
        import { javascript } from "https://esm.sh/@codemirror/lang-javascript@6.2.1";
        import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark@6.1.2";
        window.CM6 = { EditorView, basicSetup, javascript, oneDark };
        window.dispatchEvent(new CustomEvent('cm6-ready'));
    </script>
    
    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --surface: #21262d;
            --border: #30363d; --text: #c9d1d9; --accent: #58a6ff;
            --success: #238636; --gold: #d29922; --danger: #da3633; --purple: #bb86fc;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; touch-action: none;
        }

        #nexus-app-root { display: flex; flex-direction: column; height: 100vh; }

        /* --- OMNI RIBBON (Per 378.png) --- */
        .omni-ribbon { background: var(--panel); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; }
        .ribbon-toolbar { padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
        .ribbon-tabs { display: flex; gap: 4px; padding: 0 10px 10px 10px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .ribbon-tabs::-webkit-scrollbar { display: none; }
        
        .tool-btn {
            background: var(--surface); color: var(--text); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .tool-btn:active { opacity: 0.8; }
        
        .tab-btn { background: #000; color: #8b949e; border-color: var(--border); }
        .tab-btn.active-tab { background: var(--accent); color: #fff; border-color: var(--accent); }

        .btn-blue { border-color: var(--accent); color: var(--accent); }
        .btn-green { border-color: var(--success); color: var(--success); }
        .btn-gold { border-color: var(--gold); color: var(--gold); }
        .btn-red { border-color: var(--danger); color: var(--danger); }
        .btn-purple { border-color: var(--purple); color: var(--purple); }

        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .view-panel { flex: 1; display: none; flex-direction: column; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); overflow-y: auto; }
        .view-panel.active { display: flex; }

        /* Sidebar (Per 380.png) */
        #sidebar {
            position: absolute; left: -280px; top: 0; width: 280px; height: 100%;
            background: var(--panel); border-right: 1px solid var(--border);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 8000;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column;
        }
        #sidebar.active { left: 0; }
        .side-sec { padding: 10px; border-bottom: 1px solid var(--border); }

        /* Editor Area (Per 381.png) */
        #editor-wrapper { flex: 1; background: #000; position: relative; overflow: hidden; }
        .cm-editor { height: 100%; }
        #mobile-soft-keys { display: flex; overflow-x: auto; padding: 6px; background: var(--panel); gap: 6px; border-top: 1px solid var(--border); }
        .soft-key { padding: 10px 15px; background: var(--surface); border: 1px solid var(--border); color: var(--accent); border-radius: 4px; font-family: monospace; font-size: 16px; font-weight: bold; }

        /* Preview Area (Per 382.png) */
        #live-preview-frame { width: 100%; flex: 1; border: none; background: #fff; transition: width 0.3s; }
        #ghost-console { height: 150px; background: rgba(0,0,0,0.9); border-top: 2px solid var(--accent); color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; overflow-y: auto; }
        .preview-controls { padding: 8px; background: var(--panel); display: flex; gap: 10px; align-items: center; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--border); }

        /* Visual Cards (Per 379.png) */
        .tool-card { background: var(--surface); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); cursor: pointer; }

        /* Modals */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--panel); border: 1px solid var(--border); width: 90%; max-width: 550px; padding: 20px; border-radius: 8px; }
        
        #search-results-tree { max-height: 150px; overflow-y: auto; margin-top: 10px; font-size: 12px; }
        .search-hit { padding: 5px; cursor: pointer; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<div id="nexus-app-root">
    
    <header class="omni-ribbon">
        <div class="ribbon-toolbar">
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="tool-btn" onclick="Nexus.toggleSidebar(true)">☰</button>
                <span style="font-weight: bold; color: var(--accent); font-size: 14px;">DEVOS NEXUS</span>
            </div>
            
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                <button class="tool-btn btn-blue" onclick="Nexus.beautifyCode()">✨ FMT</button>
                <button class="tool-btn btn-blue" onclick="Nexus.exportForAI()">🤖 AI TXT</button>
                <input type="file" id="zip-upload-input" accept=".zip,application/zip" style="display:none" onchange="Nexus.loadZipToVFS(this.files[0])">
                <button class="tool-btn btn-gold" onclick="document.getElementById('zip-upload-input').click()">📁 LOAD</button>
                <button class="tool-btn btn-green" onclick="Nexus.saveVFS()">💾 SAVE</button>
                <button class="tool-btn btn-purple" onclick="Nexus.openAdvancedMerger()">⚡ MERGE</button>
                <button class="tool-btn btn-green" onclick="Nexus.downloadProjectZip()">📦 ZIP</button>
                <button class="tool-btn btn-red" onclick="Nexus.clearWorkspace()">🗑️ WIPE</button>
            </div>
        </div>

        <nav class="ribbon-tabs">
            <button class="tool-btn tab-btn active-tab" id="tab-btn-editor" onclick="Nexus.switchTab('editor')">1. Code</button>
            <button class="tool-btn tab-btn" id="tab-btn-preview" onclick="Nexus.switchTab('preview')">2. Sandbox</button>
            <button class="tool-btn tab-btn" id="tab-btn-visual" onclick="Nexus.switchTab('visual')">3. Visual Labs</button>
            <button class="tool-btn tab-btn" id="tab-btn-intel" onclick="Nexus.switchTab('intel')">4. Intel</button>
            <button class="tool-btn tab-btn" id="tab-btn-time" onclick="Nexus.switchTab('time')">5. Time</button>
        </nav>
    </header>

    <div class="main-container">
        
        <aside id="sidebar">
            <div style="padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold; color: var(--accent);">EXPLORER</span>
                <button class="tool-btn" onclick="Nexus.toggleSidebar(false)">✕</button>
            </div>
            <div class="side-sec">
                <input type="text" id="global-search-input" placeholder="Search code..." style="width:100%; padding:8px; background:#000; border:1px solid var(--border); border-radius:4px; color:white; box-sizing:border-box;">
                <div id="search-results-tree"></div>
            </div>
            <div id="explorer" style="flex: 1; overflow-y: auto;"></div>
            <div style="padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;">
                <button class="tool-btn btn-blue" onclick="Nexus.exportForAI()">🤖 Export AI Context</button>
                <button class="tool-btn btn-red" onclick="Nexus.clearWorkspace()">🗑️ Wipe Workspace</button>
            </div>
        </aside>

        <div id="editor-view" class="view-panel active">
            <div id="editor-wrapper"></div>
            <div id="mobile-soft-keys"></div>
        </div>

        <div id="preview-view" class="view-panel">
            <div class="preview-controls">
                <button class="tool-btn btn-green" onclick="Nexus.refreshLivePreview()">▶ REBUILD & RUN</button>
                <select class="tool-btn" id="preview-size" onchange="Nexus.resizePreview(this.value)">
                    <option value="100%">Full Screen</option>
                    <option value="375px">iPhone SE</option>
                    <option value="414px">iPhone Pro</option>
                </select>
                <button class="tool-btn btn-blue" onclick="Nexus.toggleCMD()">⚡ CMD INJECT</button>
                <span id="fps-counter" style="font-size:10px; color:var(--success); font-weight:bold; margin-left:auto;">0 FPS</span>
            </div>
            <div style="flex:1; background:#000; display:flex; justify-content:center; overflow:hidden;">
                <iframe id="live-preview-frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
            </div>
            <div id="ghost-console"></div>
        </div>

        <div id="visual-view" class="view-panel" style="padding:20px;">
            <h2 style="margin-top:0; color:var(--accent);">Visual Creative Labs</h2>
            <div class="tool-card" onclick="Nexus.log('State Machine Builder Online.', 'var(--success)')">
                <h3>⚙️ State Machine</h3>
                <p style="font-size:12px; color:#888;">Generate logic blocks for IDLE, WIN, LOSE, and Upside Down states.</p>
            </div>
            <div class="tool-card" onclick="Nexus.log('Audio Synth Online.', 'var(--success)')">
                <h3>🎵 Audio Synth</h3>
                <p style="font-size:12px; color:#888;">Design retro sound effects with code.</p>
            </div>
            <div class="tool-card" onclick="Nexus.log('Sprite Slicer Online.', 'var(--success)')">
                <h3>🖼️ Sprite Slicer</h3>
                <p style="font-size:12px; color:#888;">Map CSS positions for sprite sheets.</p>
            </div>
        </div>

        <div id="intel-view" class="view-panel" style="padding:20px;">
            <h2 style="margin-top:0; color:var(--gold);">System Intelligence</h2>
            <div id="project-stats-container"></div>
        </div>

        <div id="time-view" class="view-panel" style="padding:20px;">
            <h2 style="margin-top:0; color:var(--purple);">Time Machine</h2>
            <div id="history-list"></div>
        </div>

        <div id="cmd-panel" style="position:absolute; bottom:-400px; left:0; width:100%; height:400px; background:var(--panel); border-top:2px solid var(--accent); z-index:7500; transition:bottom 0.3s; display:flex; flex-direction:column; padding:12px; box-sizing:border-box;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="color:var(--accent); font-weight:bold;">NEXUS INJECTOR</span>
                <div style="display:flex; gap:8px;">
                    <button class="tool-btn btn-green" onclick="Nexus.runCMD()">EXECUTE</button>
                    <button class="tool-btn" onclick="Nexus.toggleCMD()">CLOSE</button>
                </div>
            </div>
            <textarea id="cmd-input" placeholder="// Paste script to edit VFS..." style="flex:1; background:#000; color:#22c55e; border:1px solid var(--border); padding:12px; font-family:monospace; font-size:14px; outline:none;"></textarea>
        </div>

    </div>
</div>

<div id="modal-overlay" onclick="if(event.target === this) Nexus.closeModal()">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-top:0; font-size: 16px;"></h2>
        <div id="modal-body"></div>
    </div>
</div>

<script src="./nexus.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Error:', err));
        }
        if (window.Nexus) window.Nexus.boot();
    });
</script>
</body>
</html>
