<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevOS Nexus Apex</title>
    <link rel="manifest" href="./manifest.json">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    
    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --surface: #21262d;
            --accent: #2f81f7; --success: #3fb950; --danger: #f85149;
            --warn: #d29922; --text: #c9d1d9; --border: #30363d;
            --gold: #d29922; --sidebar-width: 320px;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        .apex-grid { display: flex; height: 100%; width: 100%; overflow: hidden; }

        /* Sidebar - Scrollable & Feature Rich */
        .sidebar {
            width: var(--sidebar-width); background: var(--panel);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000;
        }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; top: 0; height: 100%; }
            .sidebar.active { transform: translateX(100%); }
        }

        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { margin: 0; font-size: 18px; color: var(--gold); letter-spacing: 1px; }

        .sidebar-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        
        /* Accordion */
        .acc-item { border-bottom: 1px solid var(--border); }
        .acc-head { padding: 14px 18px; background: var(--surface); cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #8b949e; display: flex; justify-content: space-between; align-items: center; }
        .acc-body { display: none; padding: 5px 0; background: var(--panel); max-height: 400px; overflow-y: auto; }
        .acc-body.active { display: block; }

        .list-entry { padding: 10px 18px; font-size: 13px; color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; }
        .list-entry.active { background: var(--surface); border-left-color: var(--gold); color: white; }
        .list-entry:active { background: var(--surface); }

        /* Workspace */
        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #000; }
        
        /* Toolbar Action Bar */
        .action-bar { display: flex; background: var(--panel); padding: 10px; gap: 8px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
        .tool-btn { padding: 10px 16px; border-radius: 8px; border: none; font-size: 11px; font-weight: bold; color: white; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
        .btn-blue { background: var(--accent); }
        .btn-gold { background: var(--gold); }
        .btn-green { background: var(--success); }
        .btn-gray { background: #30363d; }

        /* Tab Bar */
        .tab-bar { display: flex; background: var(--bg); height: 40px; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .tab { padding: 0 15px; display: flex; align-items: center; font-size: 12px; border-right: 1px solid var(--border); cursor: pointer; color: #8b949e; background: var(--panel); min-width: 100px; position: relative; }
        .tab.active { background: var(--bg); color: white; border-top: 2px solid var(--gold); }
        .tab .close-x { margin-left: 10px; font-size: 10px; opacity: 0.5; }

        /* Editor */
        .editor-container { flex: 1; position: relative; overflow: hidden; }
        .CodeMirror { height: 100% !important; font-family: 'Fira Code', monospace; font-size: 14px; }

        /* Terminal Drawer */
        .terminal { height: 160px; background: #000; border-top: 2px solid var(--border); display: flex; flex-direction: column; }
        #term-log { flex: 1; overflow-y: auto; padding: 12px; font-family: monospace; font-size: 11px; color: var(--success); -webkit-overflow-scrolling: touch; }
        .term-input { display: flex; padding: 8px 15px; background: #111; border-top: 1px solid #222; align-items: center; }
        .term-input input { flex: 1; background: transparent; border: none; color: white; outline: none; font-family: monospace; font-size: 14px; margin-left: 8px; }

        /* KEYBOARD SYSTEM */
        #kb-drawer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #000;
            z-index: 5000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100%); border-top: 2px solid var(--gold);
        }
        #kb-drawer.active { transform: translateY(0); }
        #kb-handle {
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            background: var(--gold); color: white; padding: 6px 25px;
            border-radius: 12px 12px 0 0; font-size: 11px; font-weight: bold; cursor: pointer;
        }
        .kb-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 10px; height: 210px; overflow-y: auto; }
        .kb-grid button { height: 46px; background: #222; color: white; border: 1px solid #333; border-radius: 8px; font-size: 15px; font-weight: bold; }

        /* Modals */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal { width: 100%; max-width: 600px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; max-height: 90vh; overflow: hidden; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 15px; border-top: 1px solid var(--border); background: var(--bg); display: flex; gap: 10px; }

        /* Mobile UI */
        #mobile-nav { position: fixed; bottom: 100px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--gold); color: white; border: none; z-index: 6000; font-size: 24px; box-shadow: 0 5px 25px rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; }
        @media (max-width: 768px) { #mobile-nav { display: flex; } }

        /* Visual Logic Canvas */
        #visual-canvas { width: 100%; height: 300px; background: #111; border: 1px solid var(--border); margin-top: 10px; position: relative; }
        
        .result-item { padding: 8px; border-bottom: 1px solid #333; font-size: 11px; cursor: pointer; }
        .result-item:hover { background: var(--surface); }

        /* Haptic Animation */
        .pulse { animation: pulse-anim 0.2s ease; }
        @keyframes pulse-anim { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <button id="mobile-nav" onclick="Nexus.toggleSidebar()">☰</button>

    <div class="apex-grid">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>NEXUS APEX</h2>
                <button onclick="Nexus.openHelp()" style="background:none; border:none; font-size:18px; color:var(--gold);">📖</button>
            </div>
            
            <div style="padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button class="tool-btn btn-blue" onclick="Nexus.createFile()">+ New File</button>
                <button class="tool-btn btn-blue" onclick="Nexus.triggerImport()">💾 Import</button>
                <button class="tool-btn btn-gray" onclick="Nexus.exportZIP()">📦 Zip</button>
                <button class="tool-btn btn-gray" onclick="Nexus.exportTXT()">📄 Txt</button>
            </div>

            <div class="sidebar-scroll">
                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🌿 Branches <span>▼</span></div>
                    <div class="acc-body active" id="branch-list"></div>
                </div>

                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🔍 Global Search <span>▶</span></div>
                    <div class="acc-body" style="padding:10px;">
                        <input type="text" id="find-input" placeholder="Find..." style="width:100%; background:#000; border:1px solid #333; color:white; padding:8px; border-radius:4px; margin-bottom:5px;">
                        <input type="text" id="replace-input" placeholder="Replace with..." style="width:100%; background:#000; border:1px solid #333; color:white; padding:8px; border-radius:4px; margin-bottom:5px;">
                        <div style="display:flex; gap:5px;">
                            <button onclick="Nexus.searchAll()" style="flex:1; background:var(--accent); border:none; color:white; padding:5px; border-radius:4px;">Search</button>
                            <button onclick="Nexus.replaceAll()" style="flex:1; background:var(--danger); border:none; color:white; padding:5px; border-radius:4px;">Replace All</button>
                        </div>
                        <div id="search-results" style="margin-top:10px; max-height:200px; overflow-y:auto;"></div>
                    </div>
                </div>

                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">🆔 Declarations <span>▶</span></div>
                    <div class="acc-body" id="decl-list"></div>
                </div>

                <div class="acc-item">
                    <div class="acc-head" onclick="Nexus.toggleAcc(this)">📄 Explorer <span>▼</span></div>
                    <div class="acc-body active" id="file-explorer"></div>
                </div>
            </div>

            <div style="padding: 15px; border-top: 1px solid var(--border);">
                <button class="tool-btn btn-gold" style="width: 100%; height: 50px; justify-content: center;" onclick="Nexus.openSettings()">⚙️ SYSTEM SETTINGS</button>
            </div>
        </aside>

        <main class="workspace">
            <div class="action-bar">
                <button class="tool-btn btn-gray" onclick="Nexus.copySelection()">📋 Copy</button>
                <button class="tool-btn btn-gray" onclick="Nexus.cutSelection()">✂️ Cut</button>
                <button class="tool-btn btn-green" onclick="Nexus.runPreview()">▶ Preview</button>
                <button class="tool-btn btn-blue" onclick="Nexus.runIntel()">🧠 Intel</button>
                <button class="tool-btn btn-gold" onclick="Nexus.openVisual()">🎨 Visual</button>
                <button class="tool-btn btn-gray" onclick="Nexus.openTime()">🕒 History</button>
            </div>

            <div class="tab-bar" id="tab-bar"></div>

            <div class="editor-container">
                <textarea id="editor"></textarea>
            </div>

            <div class="terminal">
                <div id="term-log"></div>
                <div class="term-input">
                    <button onclick="Nexus.startVoice()" id="voice-btn" style="background:none; border:none; font-size:18px;">🎙️</button>
                    <input type="text" id="term-in" placeholder="Command or '=' for math...">
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="overlay" onclick="Nexus.closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-title" style="margin:0; color:var(--gold);">Modal</h3>
                <button onclick="Nexus.closeModal()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Custom Keyboard -->
    <div id="kb-drawer">
        <div id="kb-handle" onclick="Nexus.toggleKb()">NEXUS KEYS</div>
        <div class="kb-grid" id="kb-grid"></div>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="zip-input" style="display:none;" accept=".zip,.txt">

    <script>
        /**
         * NEXUS APEX CORE - Feature Complete Logic
         */
        const Nexus = {
            state: {
                vfs: {}, active: 'index.html', tabs: [], cm: null,
                history: [], branches: ['main'], currentBranch: 'main',
                config: { haptics: true, voice: true, kb: ['{', '}', '(', ')', ';', '=>', '&&', '||', '!', '=', '$', '_', '.', ',', '+', '-', '*', '/', '<', '>'] }
            },

            async boot() {
                localforage.config({ name: 'DevOS_Nexus_Apex' });
                this.state.vfs = await localforage.getItem('vfs') || {
                    'index.html': '<h1>DevOS Apex Online</h1>',
                    'main.js': 'console.log("Nexus Apex Initialized.");',
                    'styles.css': 'body { background: #000; color: #fff; }'
                };
                this.state.config = await localforage.getItem('config') || this.state.config;

                // Init CodeMirror
                this.state.cm = CodeMirror.fromTextArea(document.getElementById('editor'), {
                    theme: 'dracula', mode: 'htmlmixed', lineNumbers: true, lineWrapping: true,
                    viewportMargin: Infinity, dragDrop: true
                });

                this.state.cm.on('change', () => {
                    this.state.vfs[this.state.active] = this.state.cm.getValue();
                    this.save();
                    this.snapshot();
                });

                this.initTerm();
                this.initImporter();
                this.renderAll();
                this.openFile('index.html');
                this.log("DevOS Nexus Apex v3.0 Initialized.", "var(--gold)");
            },

            log(msg, color = "var(--text)") {
                const out = document.getElementById('term-log');
                const line = document.createElement('div');
                line.style.color = color;
                line.style.marginBottom = "4px";
                line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                out.appendChild(line);
                out.scrollTop = out.scrollHeight;
            },

            async save() { await localforage.setItem('vfs', this.state.vfs); await localforage.setItem('config', this.state.config); },

            // --- FILE MANAGEMENT ---
            openFile(name) {
                if (!this.state.tabs.includes(name)) this.state.tabs.push(name);
                this.state.active = name;
                this.state.cm.setValue(this.state.vfs[name] || '');
                const ext = name.split('.').pop();
                const modes = { js: 'javascript', html: 'htmlmixed', css: 'css' };
                this.state.cm.setOption('mode', modes[ext] || 'javascript');
                this.renderAll();
                if (window.innerWidth < 768) this.toggleSidebar(false);
                this.haptic();
            },

            closeTab(name, e) {
                if (e) e.stopPropagation();
                this.state.tabs = this.state.tabs.filter(t => t !== name);
                if (this.state.active === name) {
                    this.state.active = this.state.tabs[this.state.tabs.length - 1] || null;
                }
                if (this.state.active) this.openFile(this.state.active);
                else { this.state.cm.setValue(""); this.renderAll(); }
            },

            createFile() {
                const name = prompt("Filename (e.g. engine.js):");
                if (name) { this.state.vfs[name] = ""; this.save(); this.openFile(name); }
            },

            // --- SEARCH & REPLACE ---
            searchAll() {
                const query = document.getElementById('find-input').value.toLowerCase();
                const res = document.getElementById('search-results');
                res.innerHTML = "";
                if (!query) return;

                Object.entries(this.state.vfs).forEach(([file, code]) => {
                    const lines = code.split('\n');
                    lines.forEach((line, i) => {
                        if (line.toLowerCase().includes(query)) {
                            const div = document.createElement('div');
                            div.className = "result-item";
                            div.innerText = `${file}:${i+1} > ${line.trim().substring(0, 40)}`;
                            div.onclick = () => {
                                this.openFile(file);
                                this.state.cm.setSelection({line: i, ch: 0}, {line: i, ch: line.length});
                            };
                            res.appendChild(div);
                        }
                    });
                });
                this.log(`Search complete for: ${query}`);
            },

            replaceAll() {
                const find = document.getElementById('find-input').value;
                const repl = document.getElementById('replace-input').value;
                if (!find) return;

                let count = 0;
                Object.keys(this.state.vfs).forEach(file => {
                    const oldCode = this.state.vfs[file];
                    const newCode = oldCode.split(find).join(repl);
                    if (oldCode !== newCode) {
                        this.state.vfs[file] = newCode;
                        count++;
                    }
                });
                this.save();
                if (this.state.active) this.openFile(this.state.active);
                this.log(`Replaced matches in ${count} files.`, "var(--success)");
            },

            // --- IMPORT / EXPORT ---
            initImporter() {
                const input = document.getElementById('zip-input');
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    if (file.name.endsWith('.zip')) {
                        const zip = await JSZip.loadAsync(file);
                        zip.forEach(async (path, zipFile) => {
                            if (!zipFile.dir) {
                                const content = await zipFile.async("string");
                                this.state.vfs[path] = content;
                                this.renderAll();
                            }
                        });
                        this.log(`ZIP "${file.name}" imported.`, "var(--success)");
                    } else if (file.name.endsWith('.txt')) {
                        const reader = new FileReader();
                        reader.onload = (re) => {
                            this.digestReconstruction(re.target.result);
                        };
                        reader.readAsText(file);
                    }
                    input.value = "";
                };
            },

            triggerImport() { document.getElementById('zip-input').click(); },

            async digestReconstruction(text) {
                const pattern = /([\w\-\.]+\.(?:js|html|css|json|md))[:\*\s]*\n+```\w*\n([\s\S]*?)```/gi;
                let match, count = 0;
                while ((match = pattern.exec(text)) !== null) {
                    this.state.vfs[match[1]] = match[2].trim();
                    count++;
                }
                if (count > 0) { await this.save(); this.renderAll(); this.log(`Imported ${count} modules from TXT/Log.`, "var(--success)"); }
                else { this.log("No valid code blocks detected.", "var(--danger)"); }
            },

            async exportZIP() {
                const zip = new JSZip();
                Object.entries(this.state.vfs).forEach(([name, code]) => zip.file(name, code));
                const blob = await zip.generateAsync({ type: "blob" });
                this.download(blob, "nexus-apex-project.zip");
            },

            exportTXT() {
                let out = "NEXUS APEX PROJECT EXPORT\n\n";
                Object.entries(this.state.vfs).forEach(([name, code]) => {
                    out += `${name}\n\`\`\`\n${code}\n\`\`\`\n\n`;
                });
                const blob = new Blob([out], { type: "text/plain" });
                this.download(blob, "nexus-apex-project.txt");
            },

            download(blob, name) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name; a.click();
            },

            // --- INTELLIGENCE & VISUAL ---
            runIntel() {
                const code = this.state.cm.getValue();
                const decls = code.match(/(?:const|let|var|function|class)\s+([a-zA-Z_$][\w$]*)/g) || [];
                document.getElementById('decl-list').innerHTML = decls.map(d => `<div class="list-entry" onclick="Nexus.findDecl('${d}')">${d}</div>`).join('');
                this.log("Scope Intelligence Analysis Complete.");
                this.openSection('decl-list');
            },

            findDecl(name) {
                const code = this.state.cm.getValue();
                const lines = code.split('\n');
                const idx = lines.findIndex(l => l.includes(name));
                if (idx !== -1) this.state.cm.setCursor({line: idx, ch: 0});
            },

            openVisual() {
                const body = `
                    <p style="font-size:12px; color:var(--muted);">Visual Logic Designer: Create states and logic flow.</p>
                    <div id="visual-canvas">
                        <div style="position:absolute; top:20px; left:20px; padding:10px; background:var(--accent); border-radius:5px;">State: IDLE</div>
                        <div style="position:absolute; top:120px; left:150px; padding:10px; background:var(--gold); border-radius:5px;">Action: SPIN</div>
                    </div>
                    <button class="tool-btn btn-gold" style="width:100%; margin-top:10px;" onclick="Nexus.generateVisualCode()">Generate Logic Code</button>
                `;
                this.showModal("Visual Logic Designer", body);
            },

            generateVisualCode() {
                const code = `\nconst StateMachine = {\n  IDLE: 'idle',\n  ACTIVE: 'active',\n  transition: (s) => console.log('Transition to:', s)\n};`;
                this.state.cm.replaceSelection(code);
                this.closeModal();
                this.log("Visual Logic injected.");
            },

            // --- VOICE & TERMINAL ---
            initTerm() {
                const input = document.getElementById('term-in');
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') { this.execute(input.value); input.value = ''; }
                };
            },

            execute(cmd) {
                const raw = cmd.trim();
                this.log(`> ${raw}`, "var(--accent)");
                if (raw.startsWith('=')) {
                    try { this.log(`∑ Result: ${math.evaluate(raw.substring(1))}`, "var(--gold)"); }
                    catch(e) { this.log("Math Error", "var(--danger)"); }
                } else if (raw.toLowerCase() === 'help') { this.openHelp(); }
                else if (raw.toLowerCase() === 'clear') { document.getElementById('term-log').innerHTML = ""; }
                else if (raw.toLowerCase() === 'rebuild') { this.triggerImport(); }
                else { this.log("Unknown command."); }
            },

            startVoice() {
                const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Speech) return this.log("Speech not supported.", "var(--danger)");
                const rec = new Speech();
                rec.onstart = () => { document.getElementById('voice-btn').innerText = "🔴"; };
                rec.onresult = (e) => {
                    const trans = e.results[0][0].transcript;
                    document.getElementById('term-in').value = trans;
                    this.log(`Voice recognized: "${trans}"`);
                };
                rec.onend = () => { document.getElementById('voice-btn').innerText = "🎙️"; };
                rec.start();
            },

            // --- UI RENDERERS ---
            renderAll() {
                document.getElementById('file-explorer').innerHTML = Object.keys(this.state.vfs).sort().map(f => `
                    <div class="list-entry ${this.state.active === f ? 'active' : ''}" onclick="Nexus.openFile('${f}')">📄 ${f}</div>
                `).join('');
                document.getElementById('tab-bar').innerHTML = this.state.tabs.map(t => `
                    <div class="tab ${this.state.active === t ? 'active' : ''}" onclick="Nexus.openFile('${t}')">
                        ${t} <span class="close-x" onclick="Nexus.closeTab('${t}', event)">✕</span>
                    </div>
                `).join('');
                document.getElementById('branch-list').innerHTML = this.state.branches.map(b => `
                    <div class="list-entry ${this.state.currentBranch === b ? 'active' : ''}">● ${b}</div>
                `).join('');
                this.renderKb();
            },

            renderKb() {
                const grid = document.getElementById('kb-grid');
                grid.innerHTML = this.state.config.kb.concat("qwertyuiopasdfghjklzxcvbnm".split("")).map(k => `
                    <button onclick="Nexus.type('${k}')">${k}</button>
                `).join('');
            },

            type(k) {
                const doc = this.state.cm.getDoc();
                doc.replaceRange(k, doc.getCursor());
                this.state.cm.focus();
                this.haptic();
            },

            haptic() {
                if (this.state.config.haptics && navigator.vibrate) navigator.vibrate(10);
            },

            // --- SNAPSHOTS ---
            snapshot() {
                if (this.state.history.length > 50) this.state.history.shift();
                const code = this.state.cm.getValue();
                const last = this.state.history[this.state.history.length - 1];
                if (last && last.code === code) return;
                this.state.history.push({ time: new Date().toLocaleTimeString(), code, file: this.state.active });
            },

            openTime() {
                const body = `<h3>Time Machine Snapshots</h3>` + this.state.history.slice(-10).reverse().map((h, i) => `
                    <div class="list-entry" onclick="Nexus.restoreSnapshot(${this.state.history.indexOf(h)})">
                        ${h.file} - ${h.time} <span style="color:var(--gold)">RESTORE</span>
                    </div>
                `).join('');
                this.showModal("Time Machine", body);
            },

            restoreSnapshot(idx) {
                const h = this.state.history[idx];
                this.state.vfs[h.file] = h.code;
                if (this.state.active === h.file) this.state.cm.setValue(h.code);
                this.closeModal();
                this.log(`Restored ${h.file} from ${h.time}`);
            },

            // --- SYSTEM MODALS ---
            openSettings() {
                const body = `
                    <div style="display:grid; gap:10px;">
                        <label>Keyboard Symbols (Comma Separated)</label>
                        <input type="text" id="kb-conf" value="${this.state.config.kb.join(',')}" style="background:#000; border:1px solid #333; color:white; padding:10px; border-radius:4px;">
                        
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--surface); border-radius:8px;">
                            <span>Haptic Feedback</span>
                            <input type="checkbox" id="hap-check" ${this.state.config.haptics ? 'checked' : ''}>
                        </div>

                        <button class="tool-btn btn-gold" style="width:100%; margin-top:20px;" onclick="Nexus.saveSettings()">SAVE CONFIGURATION</button>
                        <button class="tool-btn btn-gray" style="width:100%; opacity:0.5;" onclick="localforage.clear().then(()=>location.reload())">☢️ NUKE SYSTEM MEMORY</button>
                    </div>
                `;
                this.showModal("System Control Center", body);
            },

            saveSettings() {
                this.state.config.kb = document.getElementById('kb-conf').value.split(',');
                this.state.config.haptics = document.getElementById('hap-check').checked;
                this.save();
                this.renderKb();
                this.closeModal();
                this.log("Settings updated successfully.", "var(--success)");
            },

            openHelp() {
                const body = `
                    <div style="line-height:1.6; font-size:13px;">
                        <h4 style="color:var(--gold);">🚀 Quick Start</h4>
                        <p>Welcome to <b>Nexus Apex</b>. This is your mobile terminal and logic editor.</p>
                        
                        <h4 style="color:var(--accent);">📂 Data Management</h4>
                        <ul>
                            <li><b>Import:</b> Click Import to load ZIP archives or TXT chat logs.</li>
                            <li><b>ZIP:</b> Export your entire project as a compressed bundle.</li>
                            <li><b>Global Search:</b> Find and replace code across every file in the VFS.</li>
                        </ul>

                        <h4 style="color:var(--accent);">🧩 Tools</h4>
                        <ul>
                            <li><b>Intel:</b> Scans code for function/variable definitions.</li>
                            <li><b>History:</b> One-click restoration for the last 50 edits.</li>
                            <li><b>Visual:</b> Map out state logic flows visually.</li>
                        </ul>

                        <h4 style="color:var(--accent);">🎙️ Voice Control</h4>
                        <p>Tap the mic in the terminal to dictate commands or code snippets.</p>
                    </div>
                `;
                this.showModal("System Documentation", body);
            },

            // --- UI HELPERS ---
            toggleAcc(el) { el.nextElementSibling.classList.toggle('active'); el.querySelector('span').innerText = el.nextElementSibling.classList.contains('active') ? '▼' : '▶'; },
            openSection(id) { const el = document.getElementById(id); el.classList.add('active'); el.previousElementSibling.querySelector('span').innerText = '▼'; },
            toggleKb() { document.getElementById('kb-drawer').classList.toggle('active'); },
            toggleSidebar(force) { document.getElementById('sidebar').classList.toggle('active', force); },
            showModal(t, b) { document.getElementById('modal-title').innerText = t; document.getElementById('modal-body').innerHTML = b; document.getElementById('modal-overlay').style.display = 'flex'; },
            closeModal() { document.getElementById('modal-overlay').style.display = 'none'; },
            copySelection() { navigator.clipboard.writeText(this.state.cm.getSelection() || this.state.cm.getValue()); this.log("Copied."); },
            cutSelection() { const s = this.state.cm.getSelection(); if (s) { navigator.clipboard.writeText(s); this.state.cm.replaceSelection(""); this.log("Cut."); } },
            runPreview() { const w = window.open(); w.document.write((this.state.vfs['index.html']||'') + '<style>'+(this.state.vfs['styles.css']||'')+'</style>' + '<script>'+(this.state.vfs['main.js']||'')+'<\/script>'); w.document.close(); }
        };

        window.onload = () => Nexus.boot();
    </script>
</body>
</html>
