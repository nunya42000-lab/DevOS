<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DevOS Nexus Prime | All-In-One Edition</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121120/diff_match_patch.js"></script>

    <script type="module">
        import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
        import { javascript } from "https://esm.sh/@codemirror/lang-javascript@6.2.1";
        import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark@6.1.2";

        // This builds the object that Nexus.initEditor() is looking for
        window.CM6 = {
            EditorView,
            basicSetup,
            javascript,
            oneDark
        };

        // Notify the system that CM6 is ready to avoid the 100ms race condition
        window.dispatchEvent(new CustomEvent('cm6-ready'));
    </script>
    
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --surface: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --success: #238636;
            --gold: #d29922;
            --danger: #da3633;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #nexus-app-root { display: flex; flex-direction: column; height: 100vh; }

        /* Sidebar */
        #sidebar {
            position: fixed; left: -280px; top: 0; width: 280px; height: 100%;
            background: var(--panel); border-right: 1px solid var(--border);
            transition: left 0.3s ease; z-index: 8000;
        }
        #sidebar.active { left: 0; }

        /* Toolbar / Ribbon */
        .toolbar-viewport { background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; }
        .toolbar-track { padding: 8px; display: flex; gap: 8px; }

        .tool-btn {
            background: var(--surface); color: var(--text); border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .btn-blue { border-color: var(--accent); color: var(--accent); }
        .btn-green { border-color: var(--success); color: var(--success); }
        .btn-gold { border-color: var(--gold); color: var(--gold); }
        .btn-red { border-color: var(--danger); color: var(--danger); }
        .btn-accent { border-color: #bb86fc; color: #bb86fc; }

        #editor-wrapper { flex: 1; background: #000; position: relative; }
        
        /* Ensure CM6 fills the container */
        .cm-editor { height: 100%; }

        /* CMD Panel */
        #cmd-panel {
            position: fixed; bottom: -350px; left: 0; width: 100%; height: 350px;
            background: var(--panel); border-top: 2px solid var(--accent);
            z-index: 7500; transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; padding: 12px; box-sizing: border-box;
        }
        #cmd-panel.active { bottom: 0; }

        #cmd-input {
            flex: 1; background: #000; color: #22c55e; border: 1px solid var(--border);
            padding: 12px; font-family: monospace; font-size: 14px; resize: none; outline: none;
        }

        /* Terminal Pop-up */
        #terminal-zone {
            position: absolute; bottom: 20px; right: 20px; width: 320px; height: 220px;
            background: rgba(0,0,0,0.9); border: 1px solid var(--border);
            display: none; flex-direction: column; z-index: 5000; border-radius: 8px;
        }
        #term-out { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; font-family: monospace; }

        /* Modals */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content { background: var(--panel); border: 1px solid var(--border); width: 90%; max-width: 500px; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="nexus-app-root">
    <aside id="sidebar">
        <div style="padding: 20px;">
            <h3 style="color: var(--accent); margin-top: 0;">Project Explorer</h3>
            <div id="explorer"></div>
            <button class="tool-btn btn-blue" style="width: 100%; margin-top: 15px;" onclick="Nexus.repopulateExplorer()">♻️ Restore Defaults</button>
        </div>
    </aside>

    <main class="workspace" style="display: flex; flex-direction: column; flex: 1;">
        <div class="toolbar-viewport">
            <div class="toolbar-track">
                <button class="tool-btn" onclick="Nexus.toggleSidebar(true)">☰ Menu</button>
                <button class="tool-btn btn-accent" onclick="Nexus.toggleCMD()">⚡ CMD</button>
                <button class="tool-btn btn-blue" onclick="Nexus.openMerger()">⚡ Merge</button>
                <button class="tool-btn btn-gold" onclick="Nexus.openVault()">🗄️ Vault</button>
                <button class="tool-btn btn-green" onclick="Nexus.openIntel()">🧠 Intel</button>
                <button class="tool-btn btn-red" onclick="Nexus.nukeSystem()">☢️ Nuke</button>
            </div>
        </div>

        <div id="editor-wrapper"></div>

        <div id="cmd-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="color: var(--accent); font-weight: bold;">NEXUS COMMAND INJECTOR</span>
                <div style="display: flex; gap: 8px;">
                    <button class="tool-btn btn-green" onclick="Nexus.runCMD()">RUN SCRIPT</button>
                    <button class="tool-btn" onclick="Nexus.toggleCMD()">CLOSE</button>
                </div>
            </div>
            <textarea id="cmd-input" placeholder="// Input JavaScript to manipulate the system..."></textarea>
        </div>

        <div id="terminal-zone">
            <div id="term-out"></div>
            <input type="text" id="term-in" placeholder="Command..." style="background:#000; border:none; border-top:1px solid var(--border); color:#fff; padding:8px;">
        </div>
    </main>
</div>

<div id="modal-overlay" onclick="if(event.target === this) Nexus.closeModal()">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-top:0; font-size: 18px;"></h2>
        <div id="modal-body"></div>
    </div>
</div>

<script>
window.Nexus = {
    state: { vfs: {}, activeFile: "main.js", cm: null },

    boot() {
        console.log("Nexus Prime: Systems Online.");
        this.initGestures();
        this.verifyIntelligence();

        // Listen for CM6 being ready before initializing editor
        window.addEventListener('cm6-ready', () => {
            this.initEditor();
            this.renderExplorer();
            this.log("Editor Components Loaded.", "var(--success)");
        });

        // Fallback for slower connections
        setTimeout(() => {
            if (!this.state.cm && window.CM6) {
                this.initEditor();
                this.renderExplorer();
            }
        }, 2000);

        const termIn = document.getElementById('term-in');
        if (termIn) {
            termIn.onkeydown = (e) => {
                if (e.key === 'Enter') { 
                    this.executeCommand(e.target.value);
                    e.target.value = ''; 
                }
            };
        }
    },

    repopulateExplorer() {
        const templates = {
            "index.html": "<!DOCTYPE html>\n<html>\n<body>\n  <h1>Nexus Page</h1>\n</body>\n</html>",
            "style.css": "body { background: #000; color: #fff; }",
            "main.js": "console.log('Nexus System Active');",
            "config.json": "{\n  \"version\": \"1.0.0\"\n}"
        };
        Object.entries(templates).forEach(([name, content]) => {
            if (!this.state.vfs[name]) this.state.vfs[name] = content;
        });
        this.renderExplorer();
        this.log("Explorer repopulated.", "var(--success)");
    },

    renderExplorer() {
        const exp = document.getElementById('explorer');
        if (!exp) return;
        exp.innerHTML = Object.keys(this.state.vfs).map(name => `
            <div style="padding:10px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="Nexus.loadFile('${name}')">
                <span style="color:${this.state.activeFile === name ? 'var(--success)' : 'var(--text)'}">${name}</span>
                <button onclick="event.stopPropagation(); Nexus.deleteFile('${name}')" style="background:none; border:none; color:var(--danger); cursor:pointer;">🗑️</button>
            </div>
        `).join('');
    },

    loadFile(filename) {
        if (!this.state.vfs[filename]) return;
        this.state.activeFile = filename;
        if (this.state.cm) {
            this.state.cm.dispatch({
                changes: { from: 0, to: this.state.cm.state.doc.length, insert: this.state.vfs[filename] }
            });
        }
        this.renderExplorer();
        this.log(`Loaded: ${filename}`, "var(--accent)");
    },

    deleteFile(filename) {
        if (filename === "main.js") return this.log("Cannot delete main.js.", "var(--danger)");
        if (confirm(`Delete ${filename}?`)) {
            delete this.state.vfs[filename];
            if (this.state.activeFile === filename) this.loadFile("main.js");
            this.renderExplorer();
        }
    },

    toggleCMD() {
        const panel = document.getElementById('cmd-panel');
        if (panel) panel.classList.toggle('active');
    },

    runCMD() {
        const code = document.getElementById('cmd-input').value;
        if (!code) return;
        try {
            const result = new Function(code).bind(this)();
            this.log(`Result: ${result || 'Success'}`, "var(--success)");
        } catch (e) {
            this.log(`Script Error: ${e.message}`, "var(--danger)");
        }
    },

    log(msg, color = "var(--text)") {
        const term = document.getElementById('term-out');
        if (!term) return;
        const line = document.createElement('div');
        line.style.color = color;
        line.innerText = `> ${msg}`;
        term.appendChild(line);
        term.scrollTop = term.scrollHeight;
    },

    showModal(title, html) {
        const overlay = document.getElementById('modal-overlay');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerHTML = html;
        overlay.style.display = 'flex';
    },

    closeModal() { document.getElementById('modal-overlay').style.display = 'none'; },

    toggleSidebar(force) {
        const s = document.getElementById('sidebar');
        if (s) s.classList.toggle('active', force);
    },

    openMerger() {
        const html = `
            <textarea id="merger-input" style="width:100%; height:180px; background:#000; color:#22c55e; font-family:monospace; padding:10px; border:1px solid var(--border);"></textarea>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="tool-btn btn-blue" style="flex:1" onclick="Nexus.applyMerge('replace')">Replace All</button>
                <button class="tool-btn btn-accent" style="flex:1" onclick="Nexus.applyMerge('cursor')">Insert</button>
            </div>`;
        this.showModal("⚡ Code Merger", html);
    },

    applyMerge(mode) {
        const code = document.getElementById('merger-input').value;
        if (!code || !this.state.cm) return;
        if (mode === 'replace') {
            this.state.cm.dispatch({ changes: { from: 0, to: this.state.cm.state.doc.length, insert: code } });
        } else {
            const pos = this.state.cm.state.selection.main.from;
            this.state.cm.dispatch({ changes: { from: pos, insert: code } });
        }
        this.closeModal();
    },

    initEditor() {
        const parent = document.getElementById('editor-wrapper');
        if (!parent || !window.CM6) return;
        
        this.state.cm = new window.CM6.EditorView({
            doc: this.state.vfs[this.state.activeFile] || "// Nexus Codebase\n",
            extensions: [
                window.CM6.basicSetup, 
                window.CM6.oneDark, 
                window.CM6.javascript()
            ],
            parent: parent
        });
    },

    executeCommand(cmd) {
        try { this.log(eval(cmd), "var(--success)"); } catch(e) { this.log(e.message, "var(--danger)"); }
    },

    verifyIntelligence() {
        if (!this.state.vfs["main.js"]) this.state.vfs["main.js"] = "// Nexus Active";
    },

    initGestures() {
        let startX;
        document.addEventListener('touchstart', e => startX = e.touches[0].clientX);
        document.addEventListener('touchend', e => {
            const diff = e.changedTouches[0].clientX - startX;
            if (startX < 50 && diff > 100) this.toggleSidebar(true);
            if (diff < -100) this.toggleSidebar(false);
        });
    },

    openVault() { this.log("Vault module inactive.", "var(--gold)"); },
    openIntel() { this.log("Intel engine online.", "var(--gold)"); },
    nukeSystem() { if(confirm("Clear system?")) { this.state.vfs = {}; location.reload(); } }
};

document.addEventListener('DOMContentLoaded', () => Nexus.boot());
</script>

</body>
</html>
