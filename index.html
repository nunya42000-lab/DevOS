<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>DevOS Nexus Prime</title>
    
    <link rel="stylesheet" href="styles.css">
  
<link rel="manifest" href="manifest.json">
    <script type="importmap">
      {
        "imports": {
          "acorn": "https://esm.sh/acorn@8.11.3",
          "acorn-walk": "https://esm.sh/acorn-walk@8.3.2",
          "@codemirror/state": "https://esm.sh/@codemirror/state@6.4.1",
          "@codemirror/view": "https://esm.sh/@codemirror/view@6.26.0",
          "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.1",
          "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.3.3",
          "@codemirror/search": "https://esm.sh/@codemirror/search@6.5.6",
          "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.16.0",
          "codemirror": "https://esm.sh/codemirror@6.0.1",
          "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6.2.2",
          "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6.1.2"
        }
      }
    </script>

    
</head>
<body>
    <canvas id="omni-canvas" class="omni-hidden"></canvas>

    <div id="cmd-overlay" class="hidden">
        <div id="cmd-prompt">
            <span class="cmd-prefix">nexus&gt;</span>
            <input type="text" id="cmd-input" placeholder="Enter command or search project..." autocomplete="off">
        </div>
    </div>

    <aside id="panel-left" class="side-panel left-panel">
        <div class="panel-header">
            <span class="gold-text">VORTEX GRAPH</span>
            <button class="close-panel" data-target="panel-left">&times;</button>
        </div>
        <div class="panel-content" id="fs-tree">
            </div>
    </aside>

    <aside id="panel-right" class="side-panel right-panel">
        <div class="panel-header">
            <span class="blue-text">NEURAL INTEL</span>
            <button class="close-panel" data-target="panel-right">&times;</button>
        </div>
        <div class="panel-content" id="intel-dashboard">
            <div id="neural-summary" class="neural-box">Awaiting scan...</div>
            <div id="sentinel-issues"></div>
        </div>
    </aside>

    <main id="app-root">
        
        <nav id="ribbon-toolbar" class="hide-scrollbar">
            <div class="ribbon-track">
                <button class="tool-btn" id="btn-intel">🧠 Intel</button>
                <button class="tool-btn" id="btn-refactor">⚡ Refactor</button>
                <button class="tool-btn" id="btn-chronos">⏳ Chronos</button>
                <button class="tool-btn" id="btn-vortex">🌌 Vortex</button>
                <button class="tool-btn" id="btn-split">✂️ Split</button>
                <button class="tool-btn" id="btn-merge">🔗 Merge</button>
                <button class="tool-btn" id="btn-dreamer">🌙 Dreamer</button>
                <button class="tool-btn" id="btn-cmd">⌨️ CMD</button>
                </div>
        </nav>

        <header id="editor-guard">
            <div class="file-info">
                <span id="current-file-name">nexus_core.js</span>
                <span id="save-status" class="status-dot clean"></span>
            </div>
            <div class="toggle-container">
                <span class="toggle-label">Read-Only</span>
                <label class="switch">
                    <input type="checkbox" id="readonly-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
        </header>

        <div id="editor-wrapper">
            <div id="primary-editor"></div>
            
            <div id="secondary-editor" class="hidden"></div>
        </div>
<div id="intel-modal-backdrop" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:9998;"></div>

<div id="intel-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:80%; height:70%; background:#1e1e1e; border:1px solid #444; border-radius:8px; box-shadow:0 20px 40px rgba(0,0,0,0.5); z-index:9999; flex-direction:column; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <div style="padding:15px; background:#252525; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center; border-radius:8px 8px 0 0;">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="color:#4d94ff; font-weight:bold;">⚡ DEVOS INTEL</span>
            <span id="intel-count-pill" style="background:#444; padding:2px 8px; border-radius:10px; font-size:11px; color:#fff;">0 Issues</span>
        </div>
        <button id="close-intel" style="background:none; border:none; color:#888; cursor:pointer; font-size:20px;">&times;</button>
    </div>

    <div id="intel-content" style="flex:1; overflow-y:auto; padding:10px;">
        </div>

    <div style="padding:10px; background:#252525; border-top:1px solid #333; font-size:11px; color:#666; display:flex; justify-content:space-between;">
        <span>Sentinel Engine v3.5</span>
        <span>Ready to Optimize</span>
    </div>
</div>
    </main>

    <iframe id="chronos-sandbox" style="display: none;"></iframe>
      
             <script type="module">
        try {
            // Switched to jsDelivr (+esm) which handles mobile CORS and flattening much better
            import { basicSetup } from "https://cdn.jsdelivr.net/npm/codemirror@6.0.1/+esm";
            import { EditorState } from "https://cdn.jsdelivr.net/npm/@codemirror/state@6.4.1/+esm";
            import { EditorView } from "https://cdn.jsdelivr.net/npm/@codemirror/view@6.26.0/+esm";
            import { javascript } from "https://cdn.jsdelivr.net/npm/@codemirror/lang-javascript@6.2.2/+esm";
            import { oneDark } from "https://cdn.jsdelivr.net/npm/@codemirror/theme-one-dark@6.1.2/+esm";

            document.addEventListener("DOMContentLoaded", () => {
                const editorParent = document.getElementById("primary-editor");
                if (!editorParent) return;
                
                const updateCallbacks = [];

                const state = EditorState.create({
                    doc: "// DevOS Nexus Prime Active.\n// Sentinel Core Online...\n// Begin typing to engage heuristics.\n\n",
                    extensions: [
                        basicSetup,
                        javascript(), 
                        oneDark,      
                        EditorView.theme({
                            "&": { height: "100%", fontSize: "14px" },
                            ".cm-scroller": { overflow: "auto" }
                        }),
                        EditorView.updateListener.of((update) => {
                            updateCallbacks.forEach(cb => cb(update));
                        })
                    ]
                });

                const view = new EditorView({
                    state,
                    parent: editorParent
                });

                window.myEditor = view;
                window.myEditor.onUpdate = (callback) => {
                    updateCallbacks.push(callback);
                };

                console.log("[Nexus] CodeMirror mounted successfully.");
            });
            
        } catch (error) {
            // If the CDN or local server blocks it, print the error directly to the UI
            document.addEventListener("DOMContentLoaded", () => {
                const editorParent = document.getElementById("primary-editor");
                if (editorParent) {
                    editorParent.innerHTML = `
                        <div style="color: var(--danger); padding: 20px; font-family: monospace; border: 1px solid var(--danger); margin: 10px; border-radius: 8px; background: rgba(248, 81, 73, 0.1);">
                            <h3>⚠️ Editor Mount Failure</h3>
                            <p>${error.message}</p>
                            <p style="font-size: 11px; color: var(--text); opacity: 0.7;">Check your network connection, or your mobile editor is blocking external CDN scripts.</p>
                        </div>
                    `;
                }
            });
        }
    </script>

    
    <script type="module" src="wires.js"></script>
</body>
</html>
