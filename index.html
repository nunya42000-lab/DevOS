<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>DevOS Nexus Prime</title>
    
    <style>
        /* ========================================
           DEVOS MASTER CSS
           ======================================== */
        :root {
            --bg: #0d1117; --panel: #161b22; --surface: #21262d;
            --border: #30363d; --text: #c9d1d9; --accent: #2f81f7;
            --success: #3fb950; --warn: #d29922; --danger: #f85149;
            --gold: #d29922; --term-height: 180px;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background: var(--bg); color: var(--text); font-family: var(--font-ui);
            overflow: hidden; touch-action: none;
        }

        #app-root { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; z-index: 1; }

        #editor-wrapper { flex: 1; position: relative; display: flex; flex-direction: column; background: #000; overflow: hidden; }
        #primary-editor { flex: 1; position: relative; }
        #editor-shield { position: absolute; inset: 0; z-index: 10; display: none; }
        #editor-shield.active { display: block; }

        #editor-guard { display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: #000; border-bottom: 1px solid var(--border); }
        .file-info { display: flex; align-items: center; gap: 8px; font-size: 13px; font-family: monospace; color: var(--gold); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }
        .toggle-container { display: flex; align-items: center; gap: 10px; font-size: 12px; }

        #ribbon-toolbar { height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
        #ribbon-toolbar::-webkit-scrollbar { display: none; }
        .ribbon-track { display: flex; align-items: center; height: 100%; padding: 0 10px; gap: 10px; width: max-content; white-space: nowrap; }
        .tool-btn { padding: 8px 16px; border-radius: 20px; background: var(--surface); color: var(--text); border: 1px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
        .tool-btn:active { transform: scale(0.95); border-color: var(--accent); }
        .btn-gold { color: var(--gold); border-color: var(--gold); }
        .btn-red { color: var(--danger); border-color: var(--danger); }

        #cmd-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 3000; display: flex; align-items: flex-start; justify-content: center; padding-top: 20vh; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        #cmd-overlay.active { opacity: 1; pointer-events: auto; }
        #cmd-prompt { width: 90%; max-width: 500px; background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; display: flex; align-items: center; padding: 10px 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .cmd-prefix { color: var(--success); font-family: monospace; margin-right: 10px; font-weight: bold; }
        #cmd-input { flex: 1; background: transparent; border: none; color: var(--text); font-family: monospace; font-size: 16px; outline: none; }

        .side-panel { position: fixed; top: 0; bottom: 0; width: 85vw; max-width: 350px; background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--border); z-index: 2000; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .left-panel { left: 0; transform: translateX(-105%); border-right: 1px solid var(--accent); }
        .right-panel { right: 0; transform: translateX(105%); border-left: 1px solid var(--gold); }
        .side-panel.open { transform: translateX(0); }
        .panel-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-weight: bold; letter-spacing: 1px; }
        .panel-content { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; }
        .close-panel { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
        .gold-text { color: var(--gold); } .blue-text { color: var(--accent); }

        #omni-canvas { position: fixed; inset: 0; z-index: 9999; pointer-events: none; }
        #omni-canvas.active { pointer-events: auto; background: rgba(47, 129, 247, 0.05); }
    </style>
</head>
<body>
    <canvas id="omni-canvas"></canvas>

    <div id="cmd-overlay">
        <div id="cmd-prompt">
            <span class="cmd-prefix">nexus&gt;</span>
            <input type="text" id="cmd-input" placeholder="Enter command..." autocomplete="off">
        </div>
    </div>

    <aside id="panel-left" class="side-panel left-panel">
        <div class="panel-header">
            <span class="gold-text">VORTEX GRAPH</span>
            <button class="close-panel" data-target="panel-left">&times;</button>
        </div>
        <div class="panel-content" id="fs-tree">System Graph Initializing...</div>
    </aside>

    <aside id="panel-right" class="side-panel right-panel">
        <div class="panel-header">
            <span class="blue-text">NEURAL INTEL</span>
            <button class="close-panel" data-target="panel-right">&times;</button>
        </div>
        <div class="panel-content" id="intel-dashboard">
            <div id="intel-content">
                <div style="text-align:center; padding:60px 20px; color:var(--text); opacity:0.5;">
                    <div style="font-size:32px; margin-bottom:10px;">🛡️</div>
                    <div>Optimal Performance Reached. No threats detected.</div>
                </div>
            </div>
        </div>
    </aside>

    <main id="app-root">
        
        <nav id="ribbon-toolbar">
            <div class="ribbon-track">
                <button class="tool-btn" id="btn-intel" onclick="document.getElementById('panel-right').classList.add('open')">🧠 Intel</button>
                <button class="tool-btn" id="btn-refactor">⚡ Refactor</button>
                <button class="tool-btn" id="btn-chronos">⏳ Chronos</button>
                <button class="tool-btn" id="btn-vortex">🌌 Vortex</button>
                <button class="tool-btn" id="btn-cmd">⌨️ CMD</button>
            </div>
        </nav>

        <header id="editor-guard">
            <div class="file-info">
                <span id="current-file-name">nexus_core.js</span>
            </div>
            <div class="toggle-container">
                <span class="toggle-label" id="toggle-lbl">Read-Only</span>
                <label class="switch">
                    <input type="checkbox" id="readonly-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
        </header>

        <div id="editor-wrapper">
            <div id="primary-editor"></div>
        </div>
    </main>

    <script>
        // --- LOGIC ENGINES ---
        const NexusNeural = {
            analyzeDelta: (oldIssues, newIssues) => {
                const delta = { performance: 0, security: 0, complexity: 0, summary: [] };
                if (newIssues.length > oldIssues.length) delta.summary.push("⚠️ Anomaly Detected: Issue count increased.");
                if (delta.summary.length === 0) delta.summary.push("✅ Logic is stable or improved.");
                return delta;
            }
        };

        class OmniGesture {
            constructor(onCommand) {
                this.path = []; this.onCommand = onCommand;
                this.library = { 'DL': 'FIX', 'UDUD': 'INTEL', 'DRUL': 'REFRESH' };
            }
            record(x, y) { this.path.push({ x, y }); }
            process() {
                if (this.path.length < 5) return this.reset();
                let str = "";
                for (let i = 1; i < this.path.length; i++) {
                    const dx = this.path[i].x - this.path[i-1].x;
                    const dy = this.path[i].y - this.path[i-1].y;
                    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) continue;
                    let dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
                    if (str[str.length - 1] !== dir) str += dir;
                }
                const command = this.library[str];
                if (command) { console.log(`[Omni] Command: ${command}`); this.onCommand(command); }
                this.reset();
            }
            reset() { this.path = []; }
        }

        // --- UI & UX INITIALIZATION ---
        document.addEventListener("DOMContentLoaded", () => {
            
            // 1. Mount Terminal Fallback (Bypasses all CDN/Import errors)
            const editorParent = document.getElementById("primary-editor");
            editorParent.innerHTML = `
                <textarea id="raw-terminal" spellcheck="false" 
                style="width: 100%; height: 100%; background: #000; color: #c9d1d9; border: none; outline: none; font-family: monospace; font-size: 14px; padding: 10px; resize: none;"></textarea>
            `;
            const textArea = document.getElementById("raw-terminal");
            textArea.value = "// DevOS Terminal Active.\n// Monolith Mode Online.\n// Sentinel standing by...\n\n";

            // 2. Infinite Ribbon
            const track = document.querySelector('.ribbon-track');
            const items = Array.from(track.children);
            items.forEach(item => track.appendChild(item.cloneNode(true)));
            items.forEach(item => track.appendChild(item.cloneNode(true)));
            track.parentElement.addEventListener('scroll', (e) => {
                if (e.target.scrollLeft <= 0 || e.target.scrollLeft >= (track.scrollWidth / 3) * 2) {
                    e.target.scrollLeft = track.scrollWidth / 3;
                }
            });
            setTimeout(() => { document.getElementById('ribbon-toolbar').scrollLeft = track.scrollWidth / 3; }, 50);

            // 3. Edge Swipes
            let startX = 0;
            document.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
            document.addEventListener('touchend', e => {
                const diffX = e.changedTouches[0].clientX - startX;
                if (startX < 40 && diffX > 50) document.getElementById('panel-left').classList.add('open');
                if (startX > window.innerWidth - 40 && diffX < -50) document.getElementById('panel-right').classList.add('open');
            }, { passive: true });

            document.querySelectorAll('.close-panel').forEach(btn => {
                btn.addEventListener('click', (e) => document.getElementById(e.target.dataset.target).classList.remove('open'));
            });

            // 4. Read-Only Guard
            const toggle = document.getElementById('readonly-toggle');
            const shield = document.createElement('div');
            shield.id = 'editor-shield';
            document.getElementById('editor-wrapper').appendChild(shield);

            const updateShield = () => {
                shield.classList.toggle('active', toggle.checked);
                document.getElementById('toggle-lbl').style.color = toggle.checked ? "var(--success)" : "var(--text)";
            };
            toggle.addEventListener('change', updateShield);
            updateShield();

            // 5. CMD Prompt
            const cmdOverlay = document.getElementById('cmd-overlay');
            const cmdInput = document.getElementById('cmd-input');
            document.addEventListener('click', (e) => {
                if (e.target.id === 'btn-cmd' || e.target.textContent.includes('CMD')) {
                    cmdOverlay.classList.add('active');
                    setTimeout(() => cmdInput.focus(), 100);
                }
            });
            cmdOverlay.addEventListener('click', (e) => { if (e.target === cmdOverlay) cmdOverlay.classList.remove('active'); });
            cmdInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    try {
                        const result = eval(cmdInput.value);
                        alert("CMD Output: " + (result !== undefined ? result : "Executed Successfully"));
                    } catch(err) { alert("CMD Error: " + err.message); }
                    cmdInput.value = ''; cmdOverlay.classList.remove('active');
                }
            });

            // 6. Omni Gestures (Ctrl key or 3-finger tap to activate)
            const canvas = document.getElementById('omni-canvas');
            const ctx = canvas.getContext('2d');
            const resizeCanvas = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
            window.addEventListener('resize', resizeCanvas); resizeCanvas();

            const gestureEngine = new OmniGesture((cmd) => {
                if (cmd === 'INTEL') document.getElementById('panel-right').classList.add('open');
            });

            let isDrawing = false;
            document.addEventListener('touchstart', (e) => { if (e.touches.length === 3) canvas.classList.add('active'); });
            
            canvas.addEventListener('touchstart', (e) => {
                if (!canvas.classList.contains('active')) return;
                isDrawing = true; ctx.beginPath(); ctx.moveTo(e.touches[0].clientX, e.touches[0].clientY);
            });
            canvas.addEventListener('touchmove', (e) => {
                if (!isDrawing) return;
                gestureEngine.record(e.touches[0].clientX, e.touches[0].clientY);
                ctx.strokeStyle = 'var(--accent)'; ctx.lineWidth = 3;
                ctx.lineTo(e.touches[0].clientX, e.touches[0].clientY); ctx.stroke();
            });
            canvas.addEventListener('touchend', () => {
                if (!isDrawing) return;
                isDrawing = false; canvas.classList.remove('active');
                gestureEngine.process(); ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
            
            console.log("[Nexus] Monolith Initialized successfully.");
        });
    </script>
</body>
</html>
